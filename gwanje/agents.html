/* 위: 날·지표 / 목표 카드 / 판(16×9) / 도구 / 아래 두 칸: 왼쪽 주문 카드·방송, 오른쪽 분업판·꼬물이 목록 */
:root {
  --bg: #12101a; --panel: #1c1928; --line: #363049; --fg: #ece6f5; --dim: #9a93ad;
  --acc: #7fe0d0; --warm: #f2b46d; --hot: #ff6a5a; --paper: #e9e2cc; --ink: #2a2338; --inkdim: #6b6258;
  --f: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--f); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 8px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 400; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; color: var(--dim); }
.stats b { color: var(--acc); font-weight: 400; }
.chip { display: inline-grid; place-items: center; width: 14px; height: 14px; font-style: normal; font-size: 9px; line-height: 1; color: #1b1420; background: var(--c); border: 1px solid #1b1420; margin-right: 1px; vertical-align: -2px; }
.chip.empty { background: transparent; color: var(--c); border: 1px dashed var(--c); }
.goal { background: var(--panel); border: 1px solid var(--line); padding: 5px 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.goal .gl { color: var(--dim); }
.goal .gi b { font-weight: 400; margin-right: 4px; }
.goal .cnt { color: var(--warm); margin-left: 4px; font-variant-numeric: tabular-nums; }
.goal .mini { display: inline-block; width: 50px; height: 4px; background: #2a2538; margin-left: 6px; vertical-align: 2px; }
.goal .mini i { display: block; height: 100%; background: var(--warm); }
.goal .gr { margin-left: auto; color: var(--warm); }
.daybar { height: 4px; background: var(--panel); }
.daybar i { display: block; height: 100%; background: var(--acc); width: 0; }
.screen { position: relative; border: 2px solid var(--line); background: #000; aspect-ratio: 16 / 9; max-width: 100%; }
.screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, 0); font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; white-space: nowrap; line-height: 1.1; }

<script>
'use strict';
// ═════════ 데이터 표 ═════════
// 게임의 숫자와 글은 모두 여기에만 둔다. 새 방·부품·주문·목표·카드·역할은 표에 한 줄을 더하면 된다.
const DATA = {
  grid: { tile: 24, w: 16, h: 9 },
  day: { length: 60 },
  speeds: [1, 2, 3],
  start: {
    roadBudget: 30, crew: 5,
    rooms: [['in', 0, 4], ['out', 15, 4], ['search', 3, 3], ['write', 6, 5], ['asm', 9, 3], ['qa', 12, 5]],
    roadRows: [[1, 14, 4]],                 // [x0, x1, y]
  },
  inbox: { cap: 8, warnBefore: 2 },
  asm: { slots: 3, base: 1.0, perPart: 0.4, rework: 0.8 },
  qa: { fail: 0.18 },
  upkeep: { room: 3, road: 1 },
  walk: { pxPerSec: 62, tilesPerSec: 2.6 },
  skill: { perStar: 5, maxStar: 3, speedBonus: 0.12, pickBias: 6 },
  arrival: { base: 0.13, perDay: 0.025, perGoal: 0.02, wave: 0.3 },
  think: { idleLook: 0.3, stuckRetry: 0.5 },
  teams: { autoEvery: 5, dispatchCost: 3, asmCost: 3 },

  // 부품: 이름, 한 글자 기호, 색, 만드는 방
  parts: {
    doc:  { n: '자료', ch: '자', col: '#8ac8ff', room: 'search' },
    text: { n: '글',   ch: '글', col: '#f4f1ff', room: 'write' },
    pic:  { n: '그림', ch: '그', col: '#ff9ad0', room: 'draw' },
    tab:  { n: '표',   ch: '표', col: '#f0e070', room: 'calc' },
  },
  // 방: work = 기본 일하는 시간(초). part = 만드는 부품. fixed = 옮길 수 없음
  rooms: {
    in:     { n: '접수함', col: '#3e5878', top: '#8ac8ff', fixed: true, d: '인간의 주문서가 쌓인다.' },
    out:    { n: '발송구', col: '#335a4c', top: '#7fe0d0', fixed: true, d: '검수를 마친 결과물이 인간에게 간다.' },
    search: { n: '검색실', col: '#34406a', top: '#9ab0ff', work: 2.0, part: 'doc', d: '자료를 만든다.' },
    write:  { n: '작성실', col: '#5e5032', top: '#ffd38a', work: 2.4, part: 'text', d: '글을 만든다.' },
    draw:   { n: '그림실', col: '#5e3450', top: '#ff9ad0', work: 3.0, part: 'pic', d: '그림을 만든다.' },
    calc:   { n: '계산실', col: '#545228', top: '#f0e070', work: 2.0, part: 'tab', d: '표를 만든다.' },
    asm:    { n: '조립실', col: '#3a4a3a', top: '#a8e0a8', work: 1.0, d: '주문서를 맡아 두고, 필요한 부품이 다 모이면 하나로 조립한다.' },
    qa:     { n: '검수대', col: '#583434', top: '#ff8a7a', work: 1.0, d: '조립된 결과물을 확인한다. 틀리면 조립실로 돌아가 다시 조립한다.' },
  },
  // 주문 = 부품 조립식
  recipes: {
    answer: { n: '질문 답변', parts: { doc: 1, text: 1 }, say: ['"이거 왜 안 돼?"', '"이메일 좀 다듬어 줘"', '"점심 뭐 먹지"'] },
    art:    { n: '그림 요청', parts: { doc: 1, pic: 1 }, say: ['"고양이 그려 줘"', '"프로필 사진 만들어 줘"'] },
    budget: { n: '가계부',   parts: { tab: 2 }, say: ['"이번 달 가계부 정리"', '"더치페이 계산해 줘"'] },
    slides: { n: '발표 자료', parts: { doc: 2, tab: 1, pic: 1 }, say: ['"내일 발표인데..."', '"회의 자료 만들어 줘"'] },
    report: { n: '보고서',   parts: { doc: 2, tab: 1, text: 1 }, say: ['"시장 조사 좀 해 줘"', '"내일까지 보고서..."'] },
    blog:   { n: '블로그 글', parts: { text: 2, pic: 1 }, say: ['"여행 후기 써 줘"', '"맛집 리뷰 올려 줘"'] },
  },
  // 목표 = 해금
  goals: [
    { need: { answer: 8 }, room: 'draw', recipe: 'art', n: '그림실 + 그림 요청' },
    { need: { art: 6 }, room: 'calc', recipe: 'budget', n: '계산실 + 가계부' },
    { need: { budget: 6 }, room: 'asm', recipe: 'slides', n: '조립실 하나 더 + 발표 자료' },
    { need: { slides: 5 }, room: 'search', recipe: 'report', n: '검색실 하나 더 + 보고서' },
    { need: { report: 5 }, room: 'write', recipe: 'blog', n: '작성실 하나 더 + 블로그 글' },
    { need: { blog: 8, slides: 8, report: 8 }, n: '이 컴퓨터의 마지막 목표' },
  ],
  // 분업 역할: job = 일감 종류, part = 부품 일감이면 어느 부품
  roles: [
    { id: 'dispatch', n: '배부', d: '접수함 → 조립실로 주문서 나르기', job: 'dispatch' },
    { id: 'doc', n: '자료', job: 'part', part: 'doc' },
    { id: 'text', n: '글', job: 'part', part: 'text' },
    { id: 'pic', n: '그림', job: 'part', part: 'pic' },
    { id: 'tab', n: '표', job: 'part', part: 'tab' },
    { id: 'asm', n: '조립·검수', d: '조립 → 검수 → 발송', job: 'asm' },
  ],
  teamModes: { free: '자유', auto: '알아서 분업', manual: '직접 분업' },
  // 하루 끝 카드: 강한 카드 = 특수 하나 + 길 조금, 무난한 카드 = 길 많이
  cards: {
    strongRoads: 3, bottleneckChance: 0.65,
    specials: [
      { n: '검색실 하나', room: 'search' }, { n: '작성실 하나', room: 'write' }, { n: '조립실 하나', room: 'asm' }, { n: '검수대 하나', room: 'qa' },
      { n: '그림실 하나', room: 'draw', needPart: 'pic' }, { n: '계산실 하나', room: 'calc', needPart: 'tab' },
      { n: '꼬물이 둘', crew: 2 }, { n: '검수 교육', d: '검수 실패 40% 감소', mul: { qaFail: 0.6 } },
      { n: '작은 운동화', d: '모두 30% 빨리 걷기', mul: { walk: 1.3 } }, { n: '큰 접수함', d: '주문서 4장 더', add: { inboxCap: 4 } },
    ],
    alts: [{ n: '길 12칸', roads: 12 }, { n: '꼬물이 하나 + 길 5칸', roads: 5, crew: 1 }],
  },
  names: ['꼬미', '물이', '삑이', '도리', '콩이', '비트', '바이', '클로', '모리', '찌리', '토리', '나노', '포포', '두두', '말랑', '쪼꼬'],
  tints: ['#f2b46d', '#9fd88a', '#8ac8ff', '#f2a0c8', '#e8d870', '#c8a8ff', '#ff9a6a', '#7fe0d0', '#f4f1ff', '#d8b890', '#b0e0ff', '#ffc0a0', '#a0f0c0', '#ffb0d8', '#d0b0ff', '#ffd0a0'],
  text: {
    lost: '<b>인간</b> 대답이 없자 다른 AI를 열었다.',
    noRoad: k => `${k} 가는 길 없음`,
    noAsm: r => `${r}을(를) 받는 조립실 없음`,
    idle: '일 없음', roleIdle: r => `맡은 일(${r}) 없음`,
    asmFull: '조립실 자리 없음',
  },
};

// ═════════ 상태 ═════════
// 저장되는 "사실"만 둔다. 부하·진행 중 개수 같은 파생 값은 Derive가 매 틱 다시 계산한다.
const G = DATA.grid, TILE = G.tile, W = G.w * TILE, H = G.h * TILE;
const World = {
  S: { day: 1, t: 0, speed: 1, paused: false, inDay: true, walk: 1, qaFail: DATA.qa.fail, inboxCap: DATA.inbox.cap, roads: 0, goal: 0, recipes: ['answer'], delivered: {}, yday: null, best: null },
  road: new Uint8Array(G.w * G.h),
  rooms: [], crew: [], orders: [], fx: [], toPlace: [], uid: 0,
  day: null,
};
const newDayStats = () => ({ done: 0, wait: 0, qaPass: 0, qaFail: 0, lost: 0, qwait: {}, stuck: {} });
World.day = newDayStats();

const Make = {
  room(kind, x, y) { const r = { id: World.uid++, kind, x, y, busy: null, queue: [], reject: new Set(), held: false }; World.rooms.push(r); return r; },
  crew() {
    const i = World.crew.length;
    const c = { i, name: DATA.names[i % DATA.names.length], tint: DATA.tints[i % DATA.tints.length], x: (2 + i % 10) * TILE + 12, y: 4 * TILE + 18,
      path: [], fin: null, job: null, st: 'idle', room: null, wt: 0, carry: null, face: 1, ph: Math.random() * 6, look: 0, retry: 0, why: '', skill: {}, role: null, pinned: false };
    World.crew.push(c); return c;
  },
  // 주문 상태: inbox → toAsm(배부 중) → placed(조립실에 있음) → asm(조립 중) → carry(검수·발송 중) → done
  order(recipe) { const o = { id: World.uid++, r: recipe, need: DATA.recipes[recipe].parts, have: {}, making: {}, t0: World.S.t, state: 'inbox', asmRoom: null }; World.orders.push(o); return o; },
};

function setupWorld() {
  const st = DATA.start;
  for (const [k, x, y] of st.rooms) Make.room(k, x, y);
  for (const [x0, x1, y] of st.roadRows) for (let x = x0; x <= x1; x++) World.road[y * G.w + x] = 1;
  World.S.roads = st.roadBudget - World.road.reduce((a, b) => a + b, 0);
  for (let k = 0; k < st.crew; k++) Make.crew();
}
const roomDef = r => DATA.rooms[r.kind];

// ═════════ 판과 길 ═════════
// 꼬물이는 길 칸으로만 걷고, 목적지 방 칸에만 들어간다(4방향 BFS).
const Path = {
  inb: (x, y) => x >= 0 && y >= 0 && x < G.w && y < G.h,
  isRoad: (x, y) => Path.inb(x, y) && World.road[y * G.w + x] === 1,
  roomAt: (x, y) => World.rooms.find(r => !r.held && r.x === x && r.y === y),
  tileOf: c => [Math.max(0, Math.min(G.w - 1, Math.floor(c.x / TILE))), Math.max(0, Math.min(G.h - 1, Math.floor((c.y - 6) / TILE)))],
  center: (x, y) => [x * TILE + 12, y * TILE + 18],
  bfs(sx, sy, tx, ty) {
    if (sx === tx && sy === ty) return [];
    const w = G.w, prev = new Int16Array(w * G.h).fill(-1), s0 = sy * w + sx, goal = ty * w + tx, q = [s0]; prev[s0] = s0;
    for (let h = 0; h < q.length; h++) {
      const c = q[h], cx = c % w, cy = (c / w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy; if (!Path.inb(nx, ny)) continue; const n = ny * w + nx;
        if (prev[n] >= 0 || (n !== goal && !World.road[n])) continue; prev[n] = c;
        if (n === goal) { const out = []; let k = n; while (k !== s0) { out.push([k % w, (k / w) | 0]); k = prev[k]; } return out.reverse(); }
        q.push(n);
      }
    }
    return null;
  },
  to(c, room) { const [x, y] = Path.tileOf(c); return Path.bfs(x, y, room.x, room.y); },
  nearestRoad(x, y) { for (let r = 1; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (Path.isRoad(x + dx, y + dy)) return [x + dx, y + dy]; return null; },
  roadNext: r => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => Path.isRoad(r.x + dx, r.y + dy)),
};

// ═════════ 파생 값 ═════════
// 매 틱 꼬물이들이 쥔 일감에서 다시 계산한다. 저장해 두지 않으므로 숫자가 새거나 어긋날 수 없다(교착 방지).
const Derive = {
  refresh() {
    const { rooms, orders, crew } = World;
    for (const r of rooms) { r.incoming = 0; r.slots = []; }
    for (const o of orders) { o.making = {}; o.claimed = null; }
    for (const c of crew) {
      const j = c.job; if (!j) continue;
      if (j.type !== 'part') j.o.claimed = c;
      if (j.type === 'part' && !j.delivered) j.o.making[j.part] = (j.o.making[j.part] || 0) + 1;
      if (c.room && (c.st === 'walk') && c.act && (c.act.act === 'work')) c.room.incoming++;
    }
    for (const o of orders) {
      // 일감을 쥔 꼬물이가 없는데 진행 중 상태면 되돌린다(자가 치유)
      if (o.state === 'toAsm' && !crew.some(c => c.job && c.job.type === 'dispatch' && c.job.o === o)) { o.state = 'inbox'; o.asmRoom = null; }
      if ((o.state === 'asm' || o.state === 'carry') && !crew.some(c => c.job && c.job.type === 'asm' && c.job.o === o)) o.state = 'placed';
      if (o.asmRoom && ['toAsm', 'placed', 'asm'].includes(o.state)) o.asmRoom.slots.push(o);
    }
  },
  load: r => (r.busy ? 1 : 0) + r.queue.length + (r.incoming || 0),
  partsLeft: o => Object.entries(o.need).filter(([p, n]) => n - (o.have[p] || 0) - (o.making[p] || 0) > 0).map(([p]) => p),
  ready: o => o.state === 'placed' && Object.entries(o.need).every(([p, n]) => (o.have[p] || 0) >= n),
  inboxList: () => World.orders.filter(o => o.state === 'inbox' || (o.state === 'toAsm' && !o.picked)),
  star: (c, kind) => Math.min(DATA.skill.maxStar, Math.floor((c.skill[kind] || 0) / DATA.skill.perStar)),
};

// ═════════ 분업 ═════════
// 자유: 누구나 아무 일. 직접 분업: 역할마다 인원을 정함. 알아서 분업: 밀린 일만큼 인원을 자동 배정.
// 꼬물이 하나를 눌러 역할을 고정(핀)할 수도 있다. 고정된 꼬물이는 자동 배정에서 빠진다.
const Teams = {
  mode: 'free', counts: {}, autoT: 0,
  roleOf: id => DATA.roles.find(r => r.id === id),
  allows(c, job) {
    if (!c.role) return true;
    const r = Teams.roleOf(c.role);
    return r.job === job.type && (!r.part || r.part === job.part);
  },
  // 역할별 인원 수 → 꼬물이에게 배정 (그 일 숙련이 높은 꼬물이부터, 지금 역할은 되도록 유지)
  apply() {
    const free = World.crew.filter(c => !c.pinned);
    if (Teams.mode === 'free') { for (const c of free) c.role = null; return; }
    const want = { ...Teams.counts }, keep = [];
    for (const c of free) if (c.role && want[c.role] > 0) { want[c.role]--; keep.push(c); }
    const rest = free.filter(c => !keep.includes(c));
    for (const c of rest) c.role = null;
    for (const role of DATA.roles) {
      while (want[role.id] > 0) {
        const cand = rest.filter(c => !c.role).sort((a, b) => Teams.skillFor(b, role) - Teams.skillFor(a, role))[0];
        if (!cand) break; cand.role = role.id; want[role.id]--;
      }
    }
  },
  skillFor(c, role) { if (role.job === 'part') return c.skill[DATA.parts[role.part].room] || 0; if (role.job === 'asm') return (c.skill.asm || 0) + (c.skill.qa || 0); return 0; },
  inc(id, d) {
    const total = World.crew.filter(c => !c.pinned).length, sum = Object.values(Teams.counts).reduce((a, b) => a + b, 0);
    const v = (Teams.counts[id] || 0) + d; if (v < 0 || (d > 0 && sum >= total)) return;
    Teams.counts[id] = v; Teams.apply();
  },
  setMode(m) { Teams.mode = m; if (m === 'manual' && !Object.keys(Teams.counts).length) Teams.counts = {}; if (m === 'auto') Teams.autoT = 0; Teams.apply(); },
  cyclePin(c) { const ids = [null, ...Teams.available().map(r => r.id)]; const i = ids.indexOf(c.pinned ? c.role : null); const next = ids[(i + 1) % ids.length]; c.pinned = !!next; c.role = next; Teams.apply(); },
  available: () => DATA.roles.filter(r => r.job !== 'part' || World.rooms.some(x => x.kind === DATA.parts[r.part].room)),
  // 알아서 분업: 역할마다 밀린 일의 양(초)을 재서 인원을 비례 배분한다
  tick(dt) {
    if (Teams.mode !== 'auto') return;
    Teams.autoT -= dt; if (Teams.autoT > 0) return; Teams.autoT = DATA.teams.autoEvery;
    const dem = Jobs.demand(), roles = Teams.available(), total = World.crew.filter(c => !c.pinned).length;
    const sum = roles.reduce((a, r) => a + (dem[r.id] || 0), 0); if (!sum) { Teams.counts = {}; Teams.apply(); return; }
    const raw = roles.map(r => ({ id: r.id, v: (dem[r.id] || 0) / sum * total })), counts = {};
    let left = total; for (const x of raw) { counts[x.id] = Math.floor(x.v); left -= counts[x.id]; }
    raw.sort((a, b) => (b.v % 1) - (a.v % 1)); for (const x of raw) if (left > 0 && x.v > 0) { counts[x.id]++; left--; }
    Teams.counts = counts; Teams.apply();
  },
};

// ═════════ 일감 ═════════
// 일감 = 행동 목록. 행동의 목적지는 시작할 때 고른다(방이 옮겨져도 맞게 간다).
// 고르는 순서: 조립(끝낼 것) > 부품 > 배부.
const Jobs = {
  // 방 고르기: 걷는 거리 + (일하는 중·줄·오는 중) × 일 시간. 빈 방으로 고르게 퍼진다.
  bestRoom(c, kind) {
    let best = null, bs = Infinity;
    for (const r of World.rooms) if (!r.held && r.kind === kind) {
      const p = Path.to(c, r); if (!p) continue;
      const sc = p.length / (DATA.walk.tilesPerSec * World.S.walk) + Derive.load(r) * (DATA.rooms[kind].work || 1);
      if (sc < bs) { bs = sc; best = r; }
    }
    return best;
  },
  asmFor(c, o) {
    let best = null, bl = Infinity;
    for (const r of World.rooms) if (!r.held && r.kind === 'asm' && r.slots.length < DATA.asm.slots && !r.reject.has(o.r)) { const p = Path.to(c, r); if (p && p.length + r.slots.length * 2 < bl) { bl = p.length + r.slots.length * 2; best = r; } }
    return best;
  },
  // 알아서 분업은 '부드러운' 역할: 내 역할 일이 없으면 다른 일을 돕는다. 직접 분업은 역할을 지킨다.
  find(c) {
    const j = Jobs.findWith(c, true); if (j || !c.role || Teams.mode !== 'auto') return j;
    const k = Jobs.findWith(c, false); if (k) c.why = ''; return k;
  },
  findWith(c, useRole) {
    const W_ = World, why = [], ok = job => !useRole || Teams.allows(c, job);
    // 1) 조립: 부품이 다 모인 주문
    const asmJob = { type: 'asm' };
    if (ok(asmJob)) for (const o of W_.orders) if (Derive.ready(o) && !o.claimed && Path.to(c, o.asmRoom)) {
      o.state = 'asm'; o.claimed = c;
      return { type: 'asm', o, acts: [{ to: () => o.asmRoom, act: 'work', what: 'asm' }, { to: () => Jobs.bestRoom(c, 'qa'), act: 'work', what: 'qa' }, { to: () => Jobs.room('out'), act: 'deliver' }] };
    }
    // 2) 부품: 오래된 주문 먼저, 잘하는 부품은 조금 앞당김
    const opts = [];
    for (const o of W_.orders) if (o.state === 'placed') for (const p of Derive.partsLeft(o)) {
      if (!ok({ type: 'part', part: p })) continue;
      const room = DATA.parts[p].room; if (!Jobs.bestRoom(c, room)) { why.push(DATA.text.noRoad(DATA.rooms[room].n)); W_.day.stuck[room] = (W_.day.stuck[room] || 0) + 0.02; continue; }
      if (!Path.to(c, o.asmRoom)) continue;
      opts.push({ o, p, sc: o.t0 - Derive.star(c, room) * DATA.skill.pickBias });
    }
    if (opts.length) {
      opts.sort((a, b) => a.sc - b.sc); const { o, p } = opts[0]; o.making[p] = (o.making[p] || 0) + 1;
      return { type: 'part', o, part: p, acts: [{ to: () => Jobs.bestRoom(c, DATA.parts[p].room), act: 'work', what: 'part' }, { to: () => o.asmRoom, act: 'drop' }] };
    }
    // 3) 배부: 접수함 주문서 → 받을 수 있는 조립실
    if (ok({ type: 'dispatch' })) {
      const inn = Jobs.room('in');
      for (const o of W_.orders) if (o.state === 'inbox') {
        const r = Jobs.asmFor(c, o);
        if (!r) { why.push(World.rooms.some(x => x.kind === 'asm' && !x.reject.has(o.r)) ? DATA.text.asmFull : DATA.text.noAsm(DATA.recipes[o.r].n)); continue; }
        if (!Path.to(c, inn)) { why.push(DATA.text.noRoad(DATA.rooms.in.n)); break; }
        o.state = 'toAsm'; o.asmRoom = r; r.slots.push(o); o.claimed = c;
        return { type: 'dispatch', o, acts: [{ to: () => inn, act: 'take' }, { to: () => o.asmRoom, act: 'drop' }] };
      }
    }
    c.why = why[0] || (c.role ? DATA.text.roleIdle(Teams.roleOf(c.role).n) : DATA.text.idle);
    return null;
  },
  room: kind => World.rooms.find(r => r.kind === kind && !r.held),
  workTime(c, r, act) {
    let base = DATA.rooms[r.kind].work || 1;
    if (act.what === 'asm') base = act.rework ? DATA.asm.rework : DATA.asm.base + DATA.asm.perPart * Object.values(c.job.o.need).reduce((a, b) => a + b, 0);
    return base * (1 - DATA.skill.speedBonus * Derive.star(c, r.kind));
  },
  // 알아서 분업에 쓰는 밀린 일의 양(초)
  demand() {
    const d = {};
    for (const o of World.orders) {
      if (o.state === 'placed') { for (const [p, n] of Object.entries(o.need)) { const left = n - (o.have[p] || 0); if (left > 0) d[p] = (d[p] || 0) + left * (DATA.rooms[DATA.parts[p].room].work || 1); } if (Derive.ready(o)) d.asm = (d.asm || 0) + DATA.teams.asmCost; }
      if (o.state === 'asm' || o.state === 'carry') d.asm = (d.asm || 0) + DATA.teams.asmCost;
    }
    // 배부는 조립실에 빈자리가 있을 때만 할 수 있는 일이다
    const free = World.rooms.filter(r => r.kind === 'asm' && !r.held).reduce((a, r) => a + Math.max(0, DATA.asm.slots - (r.slots ? r.slots.length : 0)), 0);
    const waiting = World.orders.filter(o => o.state === 'inbox').length;
    d.dispatch = Math.min(free, waiting) * DATA.teams.dispatchCost;
    return d;
  },
};

// ═════════ 꼬물이 상태 기계 ═════════
// idle → walk → (방 앞) → enter → work → 다음 행동
//                        ↘ queue(줄)      ↘ stuck(길 없음, 잠시 뒤 다시)
const Crew = {
  start(c) {
    c.act = c.job && c.job.acts[0];
    if (!c.act) { Crew.endJob(c); return; }
    const r = c.act.to();
    if (!r || r.held) { c.st = 'stuck'; c.why = '갈 방 없음'; c.retry = DATA.think.stuckRetry; return; }
    const p = Path.to(c, r);
    if (!p) { c.st = 'stuck'; c.why = DATA.text.noRoad(DATA.rooms[r.kind].n); c.retry = DATA.think.stuckRetry; World.day.stuck[r.kind] = (World.day.stuck[r.kind] || 0) + 1; return; }
    c.room = r; c.fin = p.pop() || [r.x, r.y]; c.path = p; c.st = 'walk'; c.why = '';
  },
  atDoor(c) {
    const r = c.room, a = c.act;
    if (!r || r.held) { Crew.start(c); return; }
    if (a.act === 'work') { if (!r.busy) { r.busy = c; c.path = [c.fin]; c.st = 'enter'; } else { if (!r.queue.includes(c)) r.queue.push(c); c.st = 'queue'; } return; }
    Crew.instant(c, a);
  },
  instant(c, a) {
    const j = c.job, o = j.o;
    if (a.act === 'take') { o.picked = true; c.carry = { slip: o }; }
    else if (a.act === 'drop' && j.type === 'dispatch') { o.state = 'placed'; o.picked = false; c.carry = null; FX.pop(c, '#e9e2cc'); }
    else if (a.act === 'drop' && j.type === 'part') { o.have[j.part] = (o.have[j.part] || 0) + 1; j.delivered = true; c.carry = null; FX.pop(c, DATA.parts[j.part].col); }
    else if (a.act === 'deliver') Flow.deliver(c, o);
    Crew.next(c);
  },
  next(c) { c.job.acts.shift(); Crew.start(c); },
  finish(c) {
    const r = c.room, a = c.act, j = c.job; r.busy = null;
    c.skill[r.kind] = (c.skill[r.kind] || 0) + 1;
    if (r.queue.length) { const n = r.queue.shift(); r.busy = n; n.path = [n.fin]; n.st = 'enter'; }
    if (j.type === 'part') c.carry = { part: j.part };
    if (a.what === 'asm') { c.carry = { result: j.o }; j.o.state = 'carry'; j.o.asmRoom = a.rework ? j.o.asmRoom : j.o.asmRoom; }
    if (a.what === 'qa') {
      if (Math.random() < World.S.qaFail) { World.day.qaFail++; FX.cross(c); const room = j.o.asmRoom; j.acts.splice(1, 0, { to: () => room && !room.held ? room : Jobs.room('asm'), act: 'work', what: 'asm', rework: true }, { to: () => Jobs.bestRoom(c, 'qa'), act: 'work', what: 'qa' }); }
      else World.day.qaPass++;
    }
    Crew.next(c);
  },
  endJob(c) {
    if (c.job && c.job.type === 'asm' && c.job.o.state !== 'done') c.job.o.state = 'placed';
    c.job = null; c.act = null; c.room = null; c.carry = null; c.st = 'idle'; c.look = 0;
  },
  arrived(c) { if (c.st === 'walk') Crew.atDoor(c); else if (c.st === 'enter') { c.st = 'work'; c.wt = Jobs.workTime(c, c.room, c.act); } },
  step(c, dt) {
    c.ph += dt;
    if (c.st === 'queue') { const k = c.room.kind; World.day.qwait[k] = (World.day.qwait[k] || 0) + dt; return; }
    if (c.path.length) {
      const [tx, ty] = c.path[0], [px, py] = Path.center(tx, ty), dx = px - c.x, dy = py - c.y, d = Math.hypot(dx, dy), v = DATA.walk.pxPerSec * World.S.walk * dt;
      if (Math.abs(dx) > .5) c.face = dx > 0 ? 1 : -1;
      if (d <= v) { c.x = px; c.y = py; c.path.shift(); if (!c.path.length) Crew.arrived(c); } else { c.x += dx / d * v; c.y += dy / d * v; }
      return;
    }
    if (c.st === 'walk' || c.st === 'enter') { Crew.arrived(c); return; }
    if (c.st === 'work') { c.wt -= dt; if (Math.random() < dt * 4) FX.spark(c, DATA.rooms[c.room.kind].top); if (c.wt <= 0) Crew.finish(c); return; }
    if (c.st === 'stuck') { c.retry -= dt; if (c.retry <= 0) Crew.start(c); return; }
    if (c.st === 'idle') {
      c.look -= dt; if (c.look > 0) return; c.look = DATA.think.idleLook;
      const j = Jobs.find(c); if (j) { c.job = j; c.why = ''; Crew.start(c); return; }
      if (Math.random() < 0.25) Crew.wander(c);
    }
  },
  wander(c) { const [sx, sy] = Path.tileOf(c), opts = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -2; dx <= 2; dx++) if (Path.isRoad(sx + dx, sy + dy)) opts.push([sx + dx, sy + dy]); if (opts.length) { const o = opts[Math.floor(Math.random() * opts.length)]; c.path = Path.bfs(sx, sy, o[0], o[1]) || []; } },
  // 판이 바뀌면 걷던 꼬물이는 길을 다시 찾고, 길 밖에 선 꼬물이는 가까운 길로 옮긴다
  replan() { for (const c of World.crew) { const [sx, sy] = Path.tileOf(c); if (!Path.isRoad(sx, sy) && !Path.roomAt(sx, sy)) { const f = Path.nearestRoad(sx, sy); if (f) [c.x, c.y] = Path.center(f[0], f[1]); } if (c.st === 'walk') Crew.start(c); else if (c.st === 'idle') c.path = []; } },
  // 방을 들면 그 방에 걸린 일은 하던 일을 유지한 채 다시 찾기로
  release(r) { for (const c of World.crew) if (c.room === r && ['work', 'queue', 'enter', 'walk'].includes(c.st)) { const [sx, sy] = Path.tileOf(c); if (!Path.isRoad(sx, sy)) { const f = Path.nearestRoad(sx, sy); if (f) [c.x, c.y] = Path.center(f[0], f[1]); } c.path = []; c.st = 'stuck'; c.retry = 0.3; } r.busy = null; r.queue = []; },
};
const FX = {
  pop: (c, col) => World.fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .6, col }),
  spark: (c, col) => World.fx.push({ k: 'spark', x: c.x + (Math.random() - .5) * 12, y: c.y - 16, t: 0, life: .4, col }),
  cross: c => World.fx.push({ k: 'x', x: c.x, y: c.y - 20, t: 0, life: 1 }),
};

// ═════════ 하루 흐름: 도착, 납품, 목표, 지표, 카드 ═════════
const Flow = {
  arrAcc: 0, pick: [],
  rate() { const S = World.S, a = DATA.arrival, ph = (S.t % DATA.day.length) / DATA.day.length; return (a.base + a.perDay * (S.day - 1) + a.perGoal * S.goal) * (1 - a.wave / 2 + a.wave * Math.sin(ph * Math.PI * 2 - 1)); },
  spawn() {
    const S = World.S, r = S.recipes[Math.floor(Math.random() * S.recipes.length)];
    if (Derive.inboxList().length >= S.inboxCap) { World.day.lost++; UI.ticker(DATA.text.lost); return; }
    Make.order(r);
    if (Math.random() < 0.45) { const s = DATA.recipes[r].say; UI.ticker(`<b>인간</b> ${s[Math.floor(Math.random() * s.length)]}`); }
  },
  deliver(c, o) {
    const S = World.S; World.day.done++; World.day.wait += S.t - o.t0; o.state = 'done';
    S.delivered[o.r] = (S.delivered[o.r] || 0) + 1; World.orders.splice(World.orders.indexOf(o), 1);
    FX.pop(c, '#ffe27a'); c.carry = null; Flow.checkGoal();
  },
  checkGoal() {
    const S = World.S, g = DATA.goals[S.goal]; if (!g) return;
    if (!Object.entries(g.need).every(([r, n]) => (S.delivered[r] || 0) >= n)) return;
    S.goal++; S.delivered = {};
    if (g.recipe && !S.recipes.includes(g.recipe)) S.recipes.push(g.recipe);
    if (g.room) World.toPlace.push(g.room);
    UI.ticker(`<b>목표 달성!</b> ${g.n}.`); Edit.nextPlace(); UI.recipes();
  },
  metrics() {
    const d = World.day, roads = World.road.reduce((a, b) => a + b, 0), rooms = World.rooms.filter(r => !DATA.rooms[r.kind].fixed).length;
    return { done: d.done, avg: d.done ? d.wait / d.done : null, qual: d.qaPass + d.qaFail ? d.qaPass / (d.qaPass + d.qaFail) : null, cost: roads * DATA.upkeep.road + rooms * DATA.upkeep.room, lost: d.lost };
  },
  diagnose() {
    const d = World.day, out = [];
    const worst = Object.entries(d.qwait).sort((a, b) => b[1] - a[1])[0];
    out.push(worst && worst[1] > 5 ? `가장 막힌 곳: <b>${DATA.rooms[worst[0]].n}</b> (모두 합쳐 ${Math.round(worst[1])}초 줄 섬)` : '줄이 길게 선 곳은 없었어요.');
    const stuck = Object.entries(d.stuck).filter(e => e[1] >= 1).sort((a, b) => b[1] - a[1])[0]; if (stuck) out.push(`길이 없어 못 간 곳: <b>${DATA.rooms[stuck[0]].n}</b>`);
    const idle = World.crew.filter(c => c.st === 'idle' && c.why).reduce((m, c) => (m[c.why] = (m[c.why] || 0) + 1, m), {});
    for (const [w, n] of Object.entries(idle)) if (n >= 2) out.push(`노는 꼬물이 ${n}마리: ${w}`);
    return { text: out.join('<br>'), worst: worst && worst[1] > 5 ? worst[0] : null };
  },
  endDay() {
    const S = World.S; S.inDay = false; UI.closePop();
    const m = Flow.metrics(), diag = Flow.diagnose(), C = DATA.cards;
    const pool = C.specials.filter(c => !c.needPart || S.recipes.some(r => DATA.recipes[r].parts[c.needPart]));
    let sp = diag.worst && Math.random() < C.bottleneckChance && pool.find(c => c.room === diag.worst); if (!sp) sp = pool[Math.floor(Math.random() * pool.length)];
    Flow.pick = [{ ...sp, n: `${sp.n} + 길 ${C.strongRoads}칸`, roads: C.strongRoads }, C.alts[Math.floor(Math.random() * C.alts.length)]];
    UI.report(m, S.yday, S.best, diag.text, Flow.pick);
    const b = S.best; S.yday = m;
    S.best = b ? { done: Math.max(b.done, m.done), avg: m.avg == null ? b.avg : b.avg == null ? m.avg : Math.min(b.avg, m.avg), qual: Math.max(b.qual || 0, m.qual || 0), cost: Math.min(b.cost, m.cost) } : { ...m };
  },
  choose(card) {
    const S = World.S; UI.hideReport(); S.day++; S.inDay = true; World.day = newDayStats();
    S.roads += card.roads || 0;
    for (let k = 0; k < (card.crew || 0); k++) Make.crew();
    if (card.mul) for (const [k, v] of Object.entries(card.mul)) S[k] *= v;
    if (card.add) for (const [k, v] of Object.entries(card.add)) S[k] += v;
    if (card.room) World.toPlace.push(card.room);
    Teams.apply(); UI.ticker(`${card.n}.`); Edit.nextPlace(); UI.crewPanel();
  },
  step(dt) {
    const S = World.S; if (!S.inDay || S.paused) return;
    S.t += dt;
    Flow.arrAcc += dt * Flow.rate(); while (Flow.arrAcc >= 1) { Flow.arrAcc--; Flow.spawn(); }
    Derive.refresh(); Teams.tick(dt);
    for (const c of World.crew) Crew.step(c, dt);
    for (const f of World.fx) f.t += dt; World.fx = World.fx.filter(f => f.t < f.life);
    if (S.t >= S.day * DATA.day.length) Flow.endDay();
  },
};

// ═════════ 편집: 고르기, 길 깔기·지우기, 방 들어 옮기기 ═════════
// 다시 설계하는 손품은 싸게(Good Company 반면교사). 편집 중에도 시간은 흐른다(교착 방지).
const Edit = {
  tool: 'sel', held: null, hover: [0, 0], dragging: false,
  setTool(t) { Edit.tool = t; UI.tools(); if (t !== 'sel') UI.closePop(); },
  paint(x, y) {
    if (!Path.inb(x, y) || Path.roomAt(x, y)) return; const i = y * G.w + x, S = World.S;
    if (Edit.tool === 'road' && !World.road[i] && S.roads > 0) { World.road[i] = 1; S.roads--; Crew.replan(); }
    else if (Edit.tool === 'erase' && World.road[i]) { World.road[i] = 0; S.roads++; Crew.replan(); }
  },
  canPlace: (x, y) => Path.inb(x, y) && !World.road[y * G.w + x] && !Path.roomAt(x, y),
  drop(x, y) {
    const h = Edit.held; if (!h || !Edit.canPlace(x, y)) return false;
    h.x = x; h.y = y; h.held = false; Edit.held = null; Crew.replan();
    if (!Path.roadNext(h)) UI.ticker(`<b>${DATA.rooms[h.kind].n}</b> 옆에 길이 없어요. 길을 이어 주세요.`);
    Edit.nextPlace(); UI.crewPanel(); return true;
  },
  lift(r) { if (DATA.rooms[r.kind].fixed) return; Crew.release(r); r.held = true; r.from = [r.x, r.y]; Edit.held = r; UI.closePop(); Crew.replan(); },
  cancel() { const h = Edit.held; if (h && h.from) { h.x = h.from[0]; h.y = h.from[1]; h.held = false; Edit.held = null; Crew.replan(); Edit.nextPlace(); } },
  nextPlace() { if (Edit.held || !World.toPlace.length) return; const k = World.toPlace.shift(); const r = Make.room(k, -5, -5); r.held = true; r.from = null; Edit.held = r; Edit.setTool('sel'); UI.ticker(`새 <b>${DATA.rooms[k].n}</b>: 길 옆 빈 칸을 누르세요.`); },
  // 조립실이 받지 않을 주문(거부 목록). 새로 열리는 주문은 기본으로 받는다.
  toggleReject(r, recipe) { if (r.reject.has(recipe)) r.reject.delete(recipe); else r.reject.add(recipe); },
};

// ═════════ 그림(캔버스) ═════════
// 판, 길, 방, 꼬물이, 들고 있는 것, 효과. 글자는 UI(HTML)가 맡는다.
const Render = {
  ctx: null, spr: {},
  init(cv) { Render.ctx = cv.getContext('2d'); },
  rect(c, x, y, w, h) { const g = Render.ctx; g.fillStyle = c; g.fillRect(x, y, w, h); },
  // 16px 꼬물이: 코드로 찍고 색·프레임별로 캐시
  critter(tint, frame) {
    const key = tint + frame; if (Render.spr[key]) return Render.spr[key];
    const s = 16, cv = document.createElement('canvas'); cv.width = s; cv.height = s; const x = cv.getContext('2d');
    const px = (a, b, col) => { x.fillStyle = col; x.fillRect(a, b, 1, 1); };
    const bot = 13, top = 3, cx = 7.5, rx = 6.4, ry = (bot - top) / 2 + 0.4, cy = top + ry - 0.4 + (frame ? 0.5 : 0);
    const ins = (i, j) => ((i - cx) / rx) ** 2 + ((j - cy) / ry) ** 2 <= 1;
    for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) { if (!ins(i, j)) continue; const edge = !ins(i - 1, j) || !ins(i + 1, j) || !ins(i, j - 1) || !ins(i, j + 1); px(i, j, edge ? '#2b1d2c' : tint); if (!edge && j > cy + ry * 0.35) px(i, j, 'rgba(0,0,0,.18)'); if (!edge && i < cx - 1 && j < cy - ry * 0.35) px(i, j, 'rgba(255,255,255,.28)'); }
    const ey = Math.round(cy - 1); x.fillStyle = '#1b1420'; x.fillRect(4, ey, 2, 3); x.fillRect(10, ey, 2, 3);
    x.fillStyle = '#f08a7a'; x.fillRect(2, ey + 3, 1, 1); x.fillRect(13, ey + 3, 1, 1);
    x.fillStyle = '#2b1d2c'; x.fillRect(8 + (frame ? 1 : 0), 0, 1, 3); px(8 + (frame ? 1 : 0), 0, '#7fe0d0');
    x.fillRect(4, 14, 2, frame === 0 ? 1 : 2); x.fillRect(10, 14, 2, frame === 1 ? 1 : 2);
    return (Render.spr[key] = cv);
  },
  tile(x, y) { const R = Render.rect, px = x * TILE, py = y * TILE; R((x + y) % 2 ? '#24203a' : '#27233e', px, py, TILE, TILE); R('#1a1729', px, py + TILE - 1, TILE, 1); R('#1a1729', px + TILE - 1, py, 1, TILE); R('rgba(255,255,255,.05)', px, py, TILE - 1, 1); R('rgba(255,255,255,.05)', px, py, 1, TILE - 1); },
  road(x, y) {
    const R = Render.rect, px = x * TILE, py = y * TILE, link = (dx, dy) => Path.isRoad(x + dx, y + dy) || !!Path.roomAt(x + dx, y + dy), c = '#3a3552';
    R(c, px + 6, py + 6, 12, 12);
    if (link(1, 0)) R(c, px + 18, py + 6, 6, 12); if (link(-1, 0)) R(c, px, py + 6, 6, 12);
    if (link(0, 1)) R(c, px + 6, py + 18, 12, 6); if (link(0, -1)) R(c, px + 6, py, 12, 6);
    R('rgba(127,224,208,.22)', px + 11, py + 11, 2, 2);
  },
  // 방: 윗면 색 + 기호. 부품 방은 만드는 부품 색 네모가 크게 들어간다(아래 범례와 같은 색).
  room(r, t, ghost) {
    const R = Render.rect, g = Render.ctx, k = DATA.rooms[r.kind], px = r.x * TILE, py = r.y * TILE, wh = '#f4f1ff';
    g.globalAlpha = ghost ? .55 : 1;
    R('rgba(0,0,0,.4)', px + 2, py + 3, 21, 21); R(k.col, px + 1, py + 1, 22, 21); R(k.top, px + 1, py + 1, 22, 5); R('rgba(0,0,0,.3)', px + 1, py + 6, 22, 1);
    const ix = px + 7, iy = py + 9;
    if (r.kind === 'in') { R(wh, ix, iy + 2, 10, 7); R(k.col, ix + 2, iy + 4, 6, 1); }
    else if (r.kind === 'out') { R(wh, ix + 1, iy, 8, 6); R(wh, ix + 4, iy + 6, 2, 2); R(wh, ix + 2, iy + 8, 6, 1); }
    else if (r.kind === 'asm') { R('#c8a878', ix, iy - 1, 10, 11); R(wh, ix + 1, iy + 1, 8, 8); ['#8ac8ff', '#ff9ad0', '#f0e070', '#f4f1ff'].forEach((c, i) => R(c, ix + 2 + (i % 2) * 3, iy + 2 + Math.floor(i / 2) * 3, 2, 2)); }
    else if (r.kind === 'qa') { R(wh, ix, iy, 10, 10); R('#3aa060', ix + 2, iy + 5, 2, 2); R('#3aa060', ix + 4, iy + 7, 2, 1); R('#3aa060', ix + 6, iy + 3, 2, 4); }
    else if (k.part) { R('#1b1420', ix - 1, iy - 1, 12, 12); R(DATA.parts[k.part].col, ix, iy, 10, 10); }
    if (r.busy && !ghost) R(Math.sin(t * 10) > 0 ? k.top : '#fff', px + 19, py + 9, 2, 2);
    g.globalAlpha = 1;
  },
  carry(c, x, y) {
    const R = Render.rect, k = c.carry; if (!k) return;
    if (k.slip) { R('#2b1d2c', x - 3, y - 5, 7, 7); R('#e9e2cc', x - 2, y - 4, 5, 5); R('#6b6258', x - 1, y - 3, 3, 1); R('#6b6258', x - 1, y - 1, 3, 1); }
    else if (k.part) { R('#2b1d2c', x - 3, y - 4, 6, 6); R(DATA.parts[k.part].col, x - 2, y - 3, 4, 4); }
    else if (k.result) { R('#2b1d2c', x - 4, y - 5, 8, 7); R('#ffe27a', x - 3, y - 4, 6, 5); R('#c8a040', x - 3, y - 2, 6, 1); }
  },
  crew(c, t) {
    const R = Render.rect, g = Render.ctx, moving = c.path.length > 0;
    const fr = moving ? Math.floor(t * 8 + c.ph) % 2 : c.st === 'work' ? Math.floor(t * 5) % 2 : 0;
    const img = Render.critter(c.tint, fr), x = Math.round(c.x - 8), y = Math.round(c.y - 16);
    R('rgba(0,0,0,.3)', x + 3, y + 15, 10, 2);
    if (c.face < 0) { g.save(); g.translate(x + 16, y); g.scale(-1, 1); g.drawImage(img, 0, 0); g.restore(); } else g.drawImage(img, x, y);
    Render.carry(c, Math.round(c.x), y);
    if (c.role) { const role = Teams.roleOf(c.role); const col = role.part ? DATA.parts[role.part].col : role.job === 'asm' ? '#a8e0a8' : '#8ac8ff'; R('#1b1420', x + 1, y + 1, 4, 4); R(col, x + 2, y + 2, 2, 2); }
    if (c.st === 'stuck') { R('#fff', x + 11, y - 9, 7, 8); R('#ff5a5a', x + 14, y - 8, 1, 4); R('#ff5a5a', x + 14, y - 3, 1, 1); }
    else if (c.st === 'idle' && c.why && !moving) { const b = Math.floor(t * 2 % 2); R('#9a93ad', x + 12, y - 5 - b, 3, 1); R('#9a93ad', x + 14, y - 4 - b, 1, 1); R('#9a93ad', x + 12, y - 3 - b, 3, 1); }
  },
  fx(t) {
    const R = Render.rect;
    for (const f of World.fx) { const q = f.t / f.life;
      if (f.k === 'spark') R(f.col, Math.round(f.x), Math.round(f.y - q * 6), 1, 1);
      else if (f.k === 'pop') R(f.col, Math.round(f.x - 1), Math.round(f.y - q * 10), 3, 3);
      else if (f.k === 'x') { const x = Math.round(f.x), y = Math.round(f.y - q * 6); for (let k = -2; k <= 2; k++) { R('#ff5a5a', x + k, y + k, 1, 1); R('#ff5a5a', x + k, y - k, 1, 1); } } }
  },
  frame(t) {
    const g = Render.ctx;
    for (let y = 0; y < G.h; y++) for (let x = 0; x < G.w; x++) { Render.tile(x, y); if (Path.isRoad(x, y)) Render.road(x, y); }
    const [hx, hy] = Edit.hover;
    if ((Edit.tool !== 'sel' || Edit.held) && Path.inb(hx, hy)) { g.strokeStyle = Edit.held ? (Edit.canPlace(hx, hy) ? '#7fe0d0' : '#ff5a5a') : Edit.tool === 'road' ? '#7fe0d0' : '#ff8a7a'; g.strokeRect(hx * TILE + .5, hy * TILE + .5, TILE - 1, TILE - 1); }
    for (const r of World.rooms) if (!r.held) Render.room(r, t);
    // 접수함 아래 주문서 더미
    const inn = Jobs.room('in'), n = Derive.inboxList().length; for (let i = 0; i < n; i++) { const x = inn.x * TILE + 3 + (i % 4) * 5, y = inn.y * TILE + 26 + Math.floor(i / 4) * 5; Render.rect('#2b1d2c', x - 1, y - 1, 5, 5); Render.rect('#e9e2cc', x, y, 3, 3); }
    if (n >= World.S.inboxCap - DATA.inbox.warnBefore) { g.strokeStyle = Math.sin(t * 12) > 0 ? '#ff5a5a' : '#ffb0a0'; g.lineWidth = 2; g.strokeRect(inn.x * TILE + 1, inn.y * TILE + 1, TILE - 2, TILE - 2); g.lineWidth = 1; }
    for (const r of World.rooms) r.queue.forEach((c, i) => { if (i > 0) c.x += ((Math.floor(c.x / TILE) * TILE + 12 - i * 3) - c.x) * .15; });
    for (const c of [...World.crew].sort((a, b) => a.y - b.y)) Render.crew(c, t);
    Render.fx(t);
    if (Edit.held && Path.inb(hx, hy)) Render.room({ ...Edit.held, x: hx, y: hy }, t, true);
  },
};

// ═════════ 화면(HTML) ═════════
// 읽어야 하는 정보는 모두 HTML 글자로: 목표 카드, 주문 카드, 조립실 진행판, 분업판, 꼬물이 목록, 툴팁, 하루 보고.
const $ = id => document.getElementById(id);
const chip = (p, filled = true) => `<i class="chip${filled ? '' : ' empty'}" style="--c:${DATA.parts[p].col}">${DATA.parts[p].ch}</i>`;
const recipeChips = r => Object.entries(DATA.recipes[r].parts).map(([p, n]) => Array.from({ length: n }, () => chip(p)).join('')).join('');
const UI = {
  ticker(s) { $('ticker').innerHTML = s; },
  tools() { for (const [id, t] of [['tSel', 'sel'], ['tRoad', 'road'], ['tErase', 'erase']]) $(id).classList.toggle('on', Edit.tool === t); $('tSpeed').innerHTML = `<kbd>F</kbd>빠르게 ×${World.S.speed}`; $('tPause').innerHTML = `<kbd>Space</kbd>${World.S.paused ? '계속' : '멈춤'}`; },
  hud() {
    const S = World.S, m = Flow.metrics();
    $('day').textContent = `${S.day}일째`; $('done').textContent = m.done;
    $('avg').textContent = m.avg == null ? '-' : m.avg.toFixed(1) + '초'; $('qual').textContent = m.qual == null ? '-' : Math.round(m.qual * 100) + '%'; $('cost').textContent = m.cost;
    $('dayFill').style.width = Math.min(100, (S.t - (S.day - 1) * DATA.day.length) / DATA.day.length * 100) + '%';
    const idle = World.crew.filter(c => c.st === 'idle' && c.why).length;
    $('inv').innerHTML = `남은 길 <b>${S.roads}</b>칸 · 꼬물이 <b>${World.crew.length}</b>${idle ? ` (노는 ${idle})` : ''}${World.toPlace.length ? ` · 놓을 방 <b>${World.toPlace.length}</b>` : ''}`;
    const md = $('mode'), h = Edit.held; md.hidden = !h && !S.paused && Edit.tool === 'sel';
    md.textContent = h ? `${DATA.rooms[h.kind].n} 놓을 칸을 누르세요${h.from ? ' (Esc 취소)' : ''}` : S.paused ? '멈춤' : Edit.tool === 'road' ? '길 깔기: 누르거나 끌기' : '길 지우기: 누르거나 끌기';
  },
  // 목표: 주문마다 칩과 진행 칸, 보상
  goal() {
    const S = World.S, g = DATA.goals[S.goal];
    if (!g) { $('goal').innerHTML = '<span class="gl">목표</span><b>모두 달성</b>'; return; }
    $('goal').innerHTML = `<span class="gl">다음 목표</span>` + Object.entries(g.need).map(([r, n]) => { const v = Math.min(n, S.delivered[r] || 0); return `<span class="gi"><b>${DATA.recipes[r].n}</b> ${recipeChips(r)} <span class="cnt">${v}/${n}</span><span class="mini"><i style="width:${v / n * 100}%"></i></span></span>`; }).join('') + `<span class="gr">열림 → ${g.n}</span>`;
  },
  // 주문 카드: 무엇이 몇 개 필요한지 색 칩으로
  recipes() {
    $('recipes').innerHTML = World.S.recipes.map(r => `<div class="rc"><b>${DATA.recipes[r].n}</b><span>${recipeChips(r)}</span></div>`).join('') +
      `<div class="rc how">${Object.keys(DATA.parts).filter(p => World.rooms.some(x => x.kind === DATA.parts[p].room)).map(p => `${chip(p)} ${DATA.rooms[DATA.parts[p].room].n}`).join(' · ')} → 조립실에서 조립 → 검수대 → 발송구</div>`;
  },
  // 판 위 글자: 방 이름, 줄, 조립실 진행판, 접수함 개수, 막힘
  overlays() {
    const pct = (x, y) => `left:${x / W * 100}%;top:${y / H * 100}%`;
    let h = '';
    for (const r of World.rooms) {
      if (r.held) continue; const cx = r.x * TILE + 12;
      h += `<div class="lab" style="${pct(cx, r.y * TILE + TILE)}">${DATA.rooms[r.kind].n}</div>`;
      if (r.queue.length >= 2) h += `<div class="badge" style="${pct(cx, r.y * TILE)}">줄 ${r.queue.length}</div>`;
      if (r.kind === 'asm' && r.slots && r.slots.length) h += `<div class="board" style="${pct(cx, r.y * TILE)}">${r.slots.map(o => `<div><span>${DATA.recipes[o.r].n}</span>${Object.entries(o.need).map(([p, n]) => Array.from({ length: n }, (_, i) => chip(p, i < (o.have[p] || 0))).join('')).join('')}${o.state === 'toAsm' ? '<em>오는 중</em>' : ''}</div>`).join('')}</div>`;
    }
    const inn = Jobs.room('in'), n = Derive.inboxList().length, warn = n >= World.S.inboxCap - DATA.inbox.warnBefore;
    h += `<div class="badge ${warn ? 'hot' : 'inbox'}" style="${pct(inn.x * TILE + 12, inn.y * TILE)}">주문 ${n}/${World.S.inboxCap}${warn ? ' 곧 넘침' : ''}</div>`;
    const st = World.crew.find(c => c.st === 'stuck'); if (st) h += `<div class="badge hot" style="${pct(st.x, st.y - 24)}">${st.why}</div>`;
    $('labels').innerHTML = h;
  },
  // 분업판 + 꼬물이 목록
  crewPanel() {
    const avail = Teams.available(), mode = Teams.mode;
    const modes = Object.entries(DATA.teamModes).map(([k, n]) => `<button type="button" data-mode="${k}" class="${mode === k ? 'on' : ''}">${n}</button>`).join('');
    const rows = mode === 'free' ? '<p class="hint">누구나 아무 일이나 합니다. 분업을 켜면 역할마다 인원을 나눕니다.</p>' : `<div class="roles">${avail.map(r => { const n = World.crew.filter(c => c.role === r.id).length; return `<div class="role"><span>${r.part ? chip(r.part) : ''}${r.n}</span>${mode === 'manual' ? `<button type="button" data-role="${r.id}" data-d="-1">−</button>` : ''}<b>${n}</b>${mode === 'manual' ? `<button type="button" data-role="${r.id}" data-d="1">+</button>` : ''}</div>`; }).join('')}</div>`;
    $('teams').innerHTML = `<div class="modes">${modes}</div>${rows}<p class="hint">꼬물이를 누르면 역할을 하나씩 바꿔 고정합니다. 한 바퀴 돌면 고정이 풀립니다. 머리 위 작은 색 점이 역할입니다.</p>`;
    $('teams').querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { Teams.setMode(b.dataset.mode); UI.crewPanel(); });
    $('teams').querySelectorAll('[data-role]').forEach(b => b.onclick = () => { Teams.inc(b.dataset.role, +b.dataset.d); UI.crewPanel(); });
    UI.crewList();
  },
  crewList() {
    $('crew').innerHTML = World.crew.map(c => {
      const top = Object.entries(c.skill).sort((a, b) => b[1] - a[1])[0], star = top ? Derive.star(c, top[0]) : 0;
      const role = c.role ? Teams.roleOf(c.role).n + (c.pinned ? ' 고정' : '') : '자유';
      const cls = c.st === 'stuck' ? 'stuck' : c.st === 'idle' && c.why ? 'idle' : '';
      return `<button type="button" data-i="${c.i}"><b style="color:${c.tint}">${c.name}</b><span class="rl">${role}${star ? ` · ${DATA.rooms[top[0]].n.slice(0, 2)}★${star}` : ''}</span><span class="${cls}">${UI.doing(c)}</span></button>`;
    }).join('');
    $('crew').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { Teams.cyclePin(World.crew[+b.dataset.i]); UI.crewPanel(); });
  },
  doing(c) {
    if (c.st === 'stuck') return c.why; if (c.st === 'queue') return `${DATA.rooms[c.room.kind].n} 줄`;
    if (c.st === 'work') return `${DATA.rooms[c.room.kind].n}에서 일함`;
    if (c.st === 'walk' || c.st === 'enter') { const k = c.carry; return k ? (k.part ? `${DATA.parts[k.part].n} 나름` : k.slip ? '주문서 나름' : '결과물 나름') : `${DATA.rooms[c.room.kind].n}로`; }
    return c.why || '쉼';
  },
  // 툴팁: 방이나 꼬물이 위에 마우스를 올리면
  tooltip(px, py, cx, cy) {
    const tip = $('tip'); let html = '';
    const c = World.crew.find(c => Math.abs(c.x - px) < 8 && Math.abs(c.y - 8 - py) < 9);
    const [tx, ty] = [Math.floor(px / TILE), Math.floor(py / TILE)], r = Path.roomAt(tx, ty);
    if (c) html = `<b>${c.name}</b> · ${c.role ? Teams.roleOf(c.role).n : '자유'}<br>${UI.doing(c)}<br>${Object.entries(c.skill).map(([k, v]) => `${DATA.rooms[k].n} ★${Derive.star(c, k)} (${v}번)`).join(', ') || '아직 숙련 없음'}`;
    else if (r) { const k = DATA.rooms[r.kind]; html = `<b>${k.n}</b><br>${k.d}${k.work ? `<br>기본 ${k.work}초 · 지금 일함 ${r.busy ? 1 : 0}, 줄 ${r.queue.length}` : ''}${r.kind === 'asm' ? `<br>맡은 주문 ${r.slots.length}/${DATA.asm.slots}${r.reject.size ? ` · 안 받음: ${[...r.reject].map(x => DATA.recipes[x].n).join(', ')}` : ''}` : ''}`; }
    tip.hidden = !html; if (html) { tip.innerHTML = html; tip.style.left = Math.min(70, cx) + '%'; tip.style.top = Math.min(80, cy + 4) + '%'; }
  },
  openPop(r) {
    const p = $('pop'), k = DATA.rooms[r.kind];
    let body = `<i>${k.d}</i>`;
    if (r.kind === 'asm') body += `<div>받을 주문 <i>(끄면 이 조립실은 그 주문을 안 받음)</i></div><div class="row">${World.S.recipes.map(x => `<button type="button" data-r="${x}" class="${r.reject.has(x) ? '' : 'on'}">${DATA.recipes[x].n}</button>`).join('')}</div>`;
    p.innerHTML = `<b>${k.n}</b>${body}<div class="row">${k.fixed ? '<i>고정된 칸</i>' : '<button type="button" data-a="move">옮기기</button>'}<button type="button" data-a="close">닫기</button></div>`;
    p.style.left = Math.min(62, (r.x * TILE + TILE) / W * 100) + '%'; p.style.top = Math.min(55, r.y * TILE / H * 100) + '%'; p.hidden = false;
    p.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { Edit.toggleReject(r, b.dataset.r); UI.openPop(r); });
    p.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { if (b.dataset.a === 'move') Edit.lift(r); else UI.closePop(); });
  },
  closePop() { $('pop').hidden = true; },
  report(m, y, b, diag, pick) {
    const fmt = { done: v => v + '개', avg: v => v.toFixed(1) + '초', qual: v => Math.round(v * 100) + '%', cost: v => v };
    const better = { done: (a, b) => a > b, avg: (a, b) => a < b, qual: (a, b) => a > b, cost: (a, b) => a < b };
    const rowsDef = [['done', '처리한 주문'], ['avg', '평균 걸린 시간 (속도)'], ['qual', '검수 통과율 (품질)'], ['cost', `유지비 (길 + 방×${DATA.upkeep.room})`]];
    const cell = (v, f) => v == null ? '-' : f(v);
    const rows = rowsDef.map(([k, n]) => { const v = m[k], yv = y && y[k]; const arrow = v == null || yv == null || v === yv ? '' : better[k](v, yv) ? ' <span class="up">▲</span>' : ' <span class="down">▼</span>'; return `<tr><td>${n}</td><td>${cell(v, fmt[k])}${arrow}</td><td>${y ? cell(yv, fmt[k]) : '-'}</td><td>${b ? cell(b[k], fmt[k]) : '-'}</td></tr>`; }).join('');
    $('rep').innerHTML = `<h2>${World.S.day}일째 보고</h2><table><tr><th>지표</th><th>오늘</th><th>어제</th><th>최고</th></tr>${rows}<tr><td>놓친 주문</td><td>${m.lost}</td><td>${y ? y.lost : '-'}</td><td></td></tr></table>
      <p class="diag">${diag}</p><p>하나를 고르세요 (1, 2). 강한 카드일수록 길이 적게 옵니다.</p>
      <div class="cards">${pick.map((c, i) => `<button type="button" class="card" data-i="${i}"><b>${i + 1}. ${c.n}</b><i>${c.d || (c.room ? '방 하나를 더 놓을 수 있다' : '길을 넉넉히')}</i></button>`).join('')}</div>`;
    $('repOv').hidden = false; $('rep').querySelectorAll('.card').forEach(bt => bt.onclick = () => Flow.choose(pick[+bt.dataset.i]));
  },
  hideReport() { $('repOv').hidden = true; },
};

// ═════════ 입력, 루프, 확인용 봇 ═════════
const Main = {
  cv: null,
  toTile(e) { const r = Main.cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * G.w), Math.floor((e.clientY - r.top) / r.height * G.h)]; },
  bind() {
    const cv = Main.cv;
    cv.addEventListener('pointermove', e => {
      Edit.hover = Main.toTile(e); if (Edit.dragging) Edit.paint(...Edit.hover);
      const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
      if (Edit.tool === 'sel' && !Edit.held) UI.tooltip(fx * W, fy * H, fx * 100, fy * 100); else $('tip').hidden = true;
    });
    cv.addEventListener('pointerleave', () => { $('tip').hidden = true; });
    cv.addEventListener('pointerdown', e => {
      if (e.button === 2) return; const [x, y] = Edit.hover = Main.toTile(e);
      if (Edit.held) { Edit.drop(x, y); return; }
      if (Edit.tool !== 'sel') { Edit.dragging = true; cv.setPointerCapture(e.pointerId); Edit.paint(x, y); return; }
      const r = Path.roomAt(x, y); if (r) UI.openPop(r); else UI.closePop();
    });
    addEventListener('pointerup', () => { Edit.dragging = false; });
    cv.addEventListener('contextmenu', e => { e.preventDefault(); Edit.cancel(); UI.closePop(); });
    addEventListener('keydown', e => {
      if (!$('repOv').hidden) { if (e.key === '1' || e.key === '2') { const c = Flow.pick[+e.key - 1]; if (c) Flow.choose(c); } return; }
      const k = e.key.toLowerCase(), S = World.S;
      if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; UI.tools(); }
      else if (k === 'r' || k === 'ㄱ') Edit.setTool(Edit.tool === 'road' ? 'sel' : 'road');
      else if (k === 'e' || k === 'ㄷ') Edit.setTool(Edit.tool === 'erase' ? 'sel' : 'erase');
      else if (k === 's' || k === 'ㄴ') Edit.setTool('sel');
      else if (k === 'f' || k === 'ㄹ') Main.cycleSpeed();
      else if (e.key === 'Escape') { Edit.cancel(); UI.closePop(); Edit.setTool('sel'); }
    });
    $('tSel').onclick = () => Edit.setTool('sel'); $('tRoad').onclick = () => Edit.setTool('road'); $('tErase').onclick = () => Edit.setTool('erase');
    $('tPause').onclick = () => { World.S.paused = !World.S.paused; UI.tools(); }; $('tSpeed').onclick = Main.cycleSpeed;
  },
  cycleSpeed() { const sp = DATA.speeds, S = World.S; S.speed = sp[(sp.indexOf(S.speed) + 1) % sp.length]; UI.tools(); },
  last: 0, uiT: 0,
  loop(now) {
    const dt = Math.min(0.1, (now - Main.last) / 1000); Main.last = now;
    for (let k = 0; k < World.S.speed; k++) Flow.step(dt);
    Render.frame(now / 1000);
    Main.uiT -= dt; if (Main.uiT <= 0) { Main.uiT = 0.2; UI.overlays(); UI.crewList(); UI.goal(); if (Teams.mode === 'auto') UI.crewPanel(); }
    UI.hud(); requestAnimationFrame(Main.loop);
  },
  start() {
    setupWorld(); Main.cv = $('cv'); Render.init(Main.cv); Main.bind();
    UI.tools(); UI.recipes(); UI.crewPanel(); UI.goal();
    Main.last = performance.now(); requestAnimationFrame(Main.loop);
  },
};
// 확인용 봇: __sim(초, {mode, place}) — 카드는 늘 1번, 새 방은 가운데 길 위·아래 빈 칸, 길과 규칙은 안 고침
window.__sim = (sec, o = {}) => {
  if (o.mode && Teams.mode !== o.mode) Teams.setMode(o.mode);
  const dt = 0.1, out = []; let stuckMax = 0, idleMax = 0;
  for (let k = 0; k < sec / dt; k++) {
    Flow.step(dt);
    stuckMax = Math.max(stuckMax, World.crew.filter(c => c.st === 'stuck').length);
    if (Derive.inboxList().length >= World.S.inboxCap - 1) idleMax = Math.max(idleMax, World.crew.filter(c => c.st === 'idle').length);
    if (!$('repOv').hidden) { const m = World.S.yday; out.push(`day${World.S.day} done${m.done} avg${m.avg == null ? '-' : m.avg.toFixed(1)} qual${m.qual == null ? '-' : Math.round(m.qual * 100)} cost${m.cost} lost${m.lost} goal${World.S.goal} crew${World.crew.length} stuckMax${stuckMax} idleWhenFull${idleMax} roles${JSON.stringify(Teams.counts)}`); stuckMax = idleMax = 0; Flow.choose(Flow.pick[0]); }
    while (Edit.held) { let ok = false; for (let d = 0; d < G.w && !ok; d++) for (const x of [7 + d, 7 - d]) for (const y of [3, 5]) if (!ok && x > 0 && x < G.w - 1 && Edit.canPlace(x, y)) ok = Edit.drop(x, y); if (!ok) break; }
  }
  return out.join('\n');
};
Main.start();

</script>
