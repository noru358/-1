<title>꼬물이 에이전트 회사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: "Galmuri11"; src: url(data:font/woff2;base64,__FONT__) format("woff2"); font-display: block; }
/* 위에서 본 사무실 바닥 한 장 + 위 줄 상태, 아래 방송 띠와 하루 보고. 방 이름은 캔버스 위 HTML 글자로. */
:root {
  --bg: #12101a; --panel: #1c1928; --line: #363049; --fg: #ece6f5; --dim: #9a93ad;
  --acc: #7fe0d0; --warm: #f2b46d; --hot: #ff6a5a; --paper: #e9e2cc; --ink: #2a2338; --inkdim: #6b6258;
  --f: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--f); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 400; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--dim); }
.stats b { color: var(--acc); font-weight: 400; }
.stats .mood { color: var(--warm); }
.screen { position: relative; border: 2px solid var(--line); background: #000; aspect-ratio: 384 / 208; max-width: 100%; }
.screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, -50%); font-size: 11px; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000; white-space: nowrap; text-align: center; line-height: 1.2; }
.lab small { display: block; font-size: 10px; color: var(--hot); }
.mode { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); background: var(--warm); color: var(--ink); padding: 1px 10px; font-size: 12px; pointer-events: none; }
.ticker { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; white-space: nowrap; overflow: hidden; color: var(--dim); }
.ticker b { color: var(--fg); font-weight: 400; }
.acts { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--dim); font-size: 12px; align-items: center; }
.acts button { background: var(--panel); border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; color: var(--fg); }
.acts kbd { font: inherit; color: var(--fg); border: 1px solid var(--line); padding: 0 4px; margin-right: 4px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; border: 1px solid #000; }
.ov { position: fixed; inset: 0; background: rgba(10,8,18,.8); display: grid; place-items: center; z-index: 20; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.report { background: var(--paper); color: var(--ink); width: min(560px, 100%); padding: 16px 18px; display: grid; gap: 8px; max-height: 100%; overflow: auto; }
.report h2 { margin: 0; font-size: 18px; font-weight: 400; }
.report .row { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--inkdim); font-variant-numeric: tabular-nums; }
.report p { margin: 0; color: var(--inkdim); }
.report .diag { color: var(--ink); background: #fff3d0; padding: 6px 8px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.card { text-align: left; background: #d9d0b4; border: 2px solid var(--ink); padding: 8px 10px; cursor: pointer; color: var(--ink); display: grid; gap: 2px; }
.card:hover { background: #fff6dc; }
.card b { font-weight: 400; font-size: 14px; }
.card i { font-style: normal; font-size: 12px; color: var(--inkdim); }
.help { font-size: 12px; color: var(--dim); margin: 0; max-width: 80ch; }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <h1>꼬물이 에이전트 회사</h1>
    <div class="stats"><span id="day">1일째</span><span id="left"></span><span>처리 <b id="done">0</b></span><span class="mood" id="mood">인간 기분 70</span></div>
  </header>
  <div class="screen"><canvas id="cv" width="384" height="208"></canvas><div class="labels" id="labels"></div><div class="mode" id="mode" hidden></div></div>
  <div class="ticker" id="ticker"><b>인간</b> 컴퓨터 앞에 앉았다.</div>
  <div class="acts">
    <button type="button" id="pause"><kbd>Space</kbd>멈춤</button>
    <span>방을 누르면 들어서 옮길 수 있습니다(옮기는 동안 시간이 멈춤). 다시 누르면 내려놓습니다. 우클릭이나 Esc는 취소.</span>
  </div>
  <div class="legend" id="legend"></div>
  <p class="help">인간의 요청이 왼쪽 접수함에 쌓입니다. 꼬물이가 요청을 하나 들고, 그 요청에 필요한 방을 차례로 돌며 일한 뒤 오른쪽 발송구로 보냅니다. 검수대에서 틀린 게 나오면 앞 단계로 되돌아갑니다. 방이 멀거나 한 방에 일이 몰리면 줄이 섭니다. 하루가 끝나면 가장 막힌 곳을 알려 주고, 카드 두 장 중 하나를 고릅니다.</p>
</div>
<div class="ov" id="repOv" hidden><div class="report" role="dialog" aria-label="하루 보고" id="rep"></div></div>

<script>
'use strict';
// ───────── 표 ─────────
const T = 16, GW = 24, GH = 13, W = GW * T, H = GH * T;
const KINDS = {
  in:     { n: '접수함', col: '#4a6a8a', top: '#8ac8ff', work: 0 },
  out:    { n: '발송구', col: '#3a6a5a', top: '#7fe0d0', work: 0 },
  search: { n: '검색실', col: '#3e4a7a', top: '#9ab0ff', work: 2.4 },
  write:  { n: '작성실', col: '#6a5a3a', top: '#ffd38a', work: 3.0 },
  draw:   { n: '그림실', col: '#6a3a5a', top: '#ff9ad0', work: 4.0 },
  calc:   { n: '계산실', col: '#5a5a2a', top: '#f0e070', work: 2.4 },
  qa:     { n: '검수대', col: '#5a3a3a', top: '#ff8a7a', work: 1.4 },
};
// 요청: 실제 일의 순서(찾기 → 만들기 → 확인)를 그대로
const REQ = {
  ask:    { n: '질문', col: '#8ac8ff', route: ['search', 'write', 'qa'], day: 1, say: ['"이거 왜 안 돼?"', '"점심 뭐 먹지"', '"이메일 좀 다듬어 줘"', '"이 단어 뜻이 뭐야"'] },
  pic:    { n: '그림', col: '#ff9ad0', route: ['search', 'draw', 'qa'], day: 2, say: ['"고양이 그려 줘"', '"발표 표지 만들어 줘"', '"이 사진 배경 지워 줘"'] },
  num:    { n: '계산', col: '#f0e070', route: ['calc', 'qa'], day: 3, say: ['"이번 달 가계부 정리"', '"더치페이 계산해 줘"', '"이 표 합계 내 줘"'] },
  report: { n: '보고서', col: '#8fe0a0', route: ['search', 'calc', 'write', 'qa'], day: 4, say: ['"내일까지 보고서..."', '"시장 조사 좀 해 줘"', '"회의 자료 만들어 줘"'] },
};
const DAY = 150;           // 하루 = 2분 30초(시제품)
const NAMES = ['꼬미', '물이', '삑이', '도리', '콩이', '비트', '바이', '클로', '모리', '찌리', '토리', '나노'];
const TINTS = ['#f2b46d', '#9fd88a', '#8ac8ff', '#f2a0c8', '#e8d870', '#c8a8ff', '#ff9a6a', '#7fe0d0', '#f4f1ff', '#d8b890', '#b0e0ff', '#ffc0a0'];

// ───────── 상태 ─────────
let mods = [], crew = [], inbox = [], tickets = [], fx = [];
let S = { day: 1, t: 0, done: 0, mood: 70, qaFail: 0.22, walk: 1, inboxCap: 10, paused: false, inDay: true };
let dayStat;
function newDayStat() { return { done: 0, wait: 0, fails: 0, overflow: 0, qwait: {} }; }
dayStat = newDayStat();
let uid = 0;
function addMod(kind, x, y) { const m = { id: uid++, kind, x, y, busy: null, queue: [], fixed: kind === 'in' || kind === 'out' }; mods.push(m); return m; }
addMod('in', 0, 5); addMod('out', 22, 5);
addMod('search', 6, 2); addMod('write', 12, 6); addMod('qa', 17, 3);
function addCrew() { const i = crew.length; const d = door(mods[0]); crew.push({ i, name: NAMES[i % NAMES.length], tint: TINTS[i % TINTS.length], x: (d[0] + 1) * T + 8, y: (d[1]) * T + 10, tx: 0, ty: 0, path: [], st: 'idle', tk: null, mod: null, wt: 0, face: 1, ph: Math.random() * 6, idleT: 0 }); }

// ───────── 격자와 길 ─────────
const door = m => [m.x, m.y + 2];                    // 방(2×2) 왼쪽 아래 바로 밑 칸
let block;
function rebuildBlock() { block = new Uint8Array(GW * GH); for (const m of mods) if (!m.lifted) for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) block[(m.y + dy) * GW + m.x + dx] = 1; }
rebuildBlock();
for (let k = 0; k < 6; k++) addCrew();
function bfs(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const prev = new Int16Array(GW * GH).fill(-1), q = [sy * GW + sx]; prev[q[0]] = q[0];
  for (let h = 0; h < q.length; h++) {
    const c = q[h], cx = c % GW, cy = (c / GW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy; if (nx < 0 || ny < 0 || nx >= GW || ny >= GH) continue; const n = ny * GW + nx;
      if (prev[n] >= 0 || (block[n] && n !== ty * GW + tx)) continue; prev[n] = c;
      if (nx === tx && ny === ty) { const out = []; let k = n; while (k !== sy * GW + sx) { out.push([k % GW, (k / GW) | 0]); k = prev[k]; } return out.reverse(); }
      q.push(n);
    }
  }
  return null;
}
const tileOf = c => [Math.max(0, Math.min(GW - 1, Math.floor(c.x / T))), Math.max(0, Math.min(GH - 1, Math.floor((c.y - 2) / T)))];
function goTo(c, m) {
  const [sx, sy] = tileOf(c), [tx, ty] = door(m), p = bfs(sx, sy, tx, ty);
  c.mod = m; c.path = p || []; if (!p) c.path = [[tx, ty]];
}
function pathLen(c, m) { const [sx, sy] = tileOf(c), [tx, ty] = door(m); const p = bfs(sx, sy, tx, ty); return p ? p.length : 999; }

// ───────── 일의 흐름 ─────────
function pickMod(c, kind) {
  let best = null, bs = 1e9;
  for (const m of mods) if (m.kind === kind && !m.lifted) { const s = pathLen(c, m) / (3 * S.walk) + (m.queue.length + (m.busy ? 1 : 0)) * KINDS[kind].work; if (s < bs) { bs = s; best = m; } }
  return best;
}
function nextStep(c) {
  const tk = c.tk, route = REQ[tk.type].route;
  const kind = tk.step < route.length ? route[tk.step] : 'out';
  const m = pickMod(c, kind);
  if (!m) { c.st = 'stuck'; c.need = kind; return; }
  c.st = 'walk'; goTo(c, m);
}
function arrive(c) {
  const m = c.mod;
  if (m.kind === 'in') { const tk = inbox.find(t => t.by === c); if (!tk) { c.st = 'idle'; return; } inbox.splice(inbox.indexOf(tk), 1); c.tk = tk; tk.carried = true; nextStep(c); return; }
  if (m.kind === 'out') { deliver(c); return; }
  if (!m.busy) { m.busy = c; c.st = 'work'; c.wt = KINDS[m.kind].work; }
  else { if (!m.queue.includes(c)) m.queue.push(c); c.st = 'queue'; c.qT = 0; }
}
function finishWork(c) {
  const m = c.mod, tk = c.tk; m.busy = null;
  if (m.kind === 'qa' && Math.random() < S.qaFail) { tk.step = Math.max(0, tk.step - 1); tk.fails++; dayStat.fails++; fx.push({ k: 'x', x: c.x, y: c.y - 18, t: 0, life: 1 }); if (Math.random() < 0.5) ticker(`<b>${c.name}</b> 검수에서 틀린 걸 찾았다. ${KINDS[REQ[tk.type].route[tk.step]].n}로 되돌아간다.`); }
  else tk.step++;
  if (m.queue.length) { const n = m.queue.shift(); m.busy = n; n.st = 'work'; n.wt = KINDS[m.kind].work; }
  nextStep(c);
}
function deliver(c) {
  const tk = c.tk, wait = S.t - tk.t0;
  S.done++; dayStat.done++; dayStat.wait += wait;
  S.mood = Math.max(0, Math.min(100, S.mood + (wait < 25 ? 1.2 : wait < 45 ? 0.2 : -1.5)));
  fx.push({ k: 'ok', x: c.x, y: c.y - 18, t: 0, life: 0.8, col: REQ[tk.type].col });
  c.tk = null; c.st = 'idle'; c.idleT = 0;
}
function stepCrew(c, dt) {
  c.ph += dt;
  if (c.path.length) {
    const [tx, ty] = c.path[0], px = tx * T + 8, py = ty * T + 12, dx = px - c.x, dy = py - c.y, d = Math.hypot(dx, dy), v = 48 * S.walk * dt;
    if (Math.abs(dx) > 0.5) c.face = dx > 0 ? 1 : -1;
    if (d <= v) { c.x = px; c.y = py; c.path.shift(); if (!c.path.length && c.st === 'walk') arrive(c); } else { c.x += dx / d * v; c.y += dy / d * v; }
    return;
  }
  if (c.st === 'walk') { arrive(c); return; }
  if (c.st === 'work') { c.wt -= dt; if (Math.random() < dt * 4) fx.push({ k: 'spark', x: c.x + (Math.random() - .5) * 10, y: c.y - 14, t: 0, life: .4, col: KINDS[c.mod.kind].top }); if (c.wt <= 0) finishWork(c); return; }
  if (c.st === 'queue') { c.qT += dt; dayStat.qwait[c.mod.kind] = (dayStat.qwait[c.mod.kind] || 0) + dt; return; }
  if (c.st === 'stuck') { const m = pickMod(c, c.need); if (m) { c.st = 'walk'; goTo(c, m); } return; }
  if (c.st === 'idle') {
    const tk = inbox.find(t => !t.by);
    if (tk) { tk.by = c; c.st = 'walk'; goTo(c, mods.find(m => m.kind === 'in')); return; }
    c.idleT -= dt; if (c.idleT <= 0) { c.idleT = 2 + Math.random() * 3; const [sx, sy] = tileOf(c); for (let k = 0; k < 10; k++) { const nx = sx + Math.round((Math.random() - .5) * 6), ny = sy + Math.round((Math.random() - .5) * 4); if (nx >= 0 && ny >= 0 && nx < GW && ny < GH && !block[ny * GW + nx]) { c.path = bfs(sx, sy, nx, ny) || []; break; } } }
  }
}
// 방이 옮겨지면 그 방으로 가던 꼬물이는 길을 다시 찾는다
function rerouteAll() { for (const c of crew) { if (c.st === 'walk' && c.mod) goTo(c, c.mod); else if (c.st === 'idle') c.path = []; const [sx, sy] = tileOf(c); if (block[sy * GW + sx]) { const f = nearestFree(sx, sy); c.x = f[0] * T + 8; c.y = f[1] * T + 12; } } }
function nearestFree(x, y) { for (let r = 1; r < 10; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < GW && ny < GH && !block[ny * GW + nx]) return [nx, ny]; } return [x, y]; }
// 옮긴 방에서 일하거나 줄 서던 꼬물이는 새 자리로 따라간다
function detach(m) { for (const c of crew) if (c.mod === m && (c.st === 'work' || c.st === 'queue')) { if (c.st === 'work') c.wt = KINDS[m.kind].work; c.st = 'walk'; } m.busy = null; m.queue = []; }

// 도착
let arrAcc = 0;
const typesNow = () => Object.keys(REQ).filter(k => REQ[k].day <= S.day);
function rate() { const ph = (S.t % DAY) / DAY, wave = 0.75 + 0.5 * Math.sin(ph * Math.PI * 2 - 1); return (0.17 + 0.05 * (S.day - 1)) * wave; }
function spawnReq() {
  const ty = typesNow(), type = ty[Math.floor(Math.random() * ty.length)];
  if (inbox.length >= S.inboxCap) { S.mood = Math.max(0, S.mood - 2); dayStat.overflow++; if (Math.random() < 0.5) ticker('<b>인간</b> 대답이 없자 다른 탭을 열었다.'); return; }
  const tk = { type, t0: S.t, step: 0, by: null, fails: 0 }; inbox.push(tk); tickets.push(tk);
  if (Math.random() < 0.4) { const s = REQ[type].say; ticker(`<b>인간</b> ${s[Math.floor(Math.random() * s.length)]}`); }
}

// ───────── 하루 끝: 진단 + 카드 두 장 ─────────
const CARDS = [
  { id: 'm-search', n: '검색실 하나 더', d: '찾기 일을 나눠 맡는다.', mod: 'search' },
  { id: 'm-write', n: '작성실 하나 더', d: '쓰기 일을 나눠 맡는다.', mod: 'write' },
  { id: 'm-qa', n: '검수대 하나 더', d: '확인 줄이 짧아진다.', mod: 'qa' },
  { id: 'm-draw', n: '그림실 하나 더', d: '그리기 일을 나눠 맡는다.', mod: 'draw', need: 'draw' },
  { id: 'm-calc', n: '계산실 하나 더', d: '계산 일을 나눠 맡는다.', mod: 'calc', need: 'calc' },
  { id: 'crew', n: '꼬물이 둘', d: '일손이 늘어난다. 대신 길이 붐빈다.', f: () => { addCrew(); addCrew(); } },
  { id: 'qa-train', n: '검수 교육', d: '검수에서 틀리는 일이 40% 줄어든다.', f: () => { S.qaFail *= 0.6; } },
  { id: 'shoes', n: '작은 운동화', d: '모두 30% 빨리 걷는다.', f: () => { S.walk *= 1.3; } },
  { id: 'inbox', n: '큰 접수함', d: '요청을 6개 더 쌓아 둘 수 있다.', f: () => { S.inboxCap += 6; } },
];
const NEWROOM = { 2: 'draw', 3: 'calc' };
function endDay() {
  S.inDay = false;
  const avg = dayStat.done ? dayStat.wait / dayStat.done : 0;
  const worst = Object.entries(dayStat.qwait).sort((a, b) => b[1] - a[1])[0];
  const diag = worst && worst[1] > 8 ? `오늘 가장 막힌 곳은 <b>${KINDS[worst[0]].n}</b>입니다. 꼬물이들이 거기서 모두 ${Math.round(worst[1])}초를 줄 서서 기다렸어요.` : '오늘은 크게 막힌 곳이 없었어요.';
  const nextDay = S.day + 1, newType = Object.keys(REQ).find(k => REQ[k].day === nextDay);
  // 카드 두 장: 내일 새 일감이 오면 그 방은 반드시 하나
  let pool = CARDS.filter(c => !c.need || typesNow().some(t => REQ[t].route.includes(c.need)) || NEWROOM[nextDay] === c.need);
  let pick = [];
  if (NEWROOM[nextDay]) pick.push(CARDS.find(c => c.mod === NEWROOM[nextDay]));
  if (worst && worst[1] > 8 && Math.random() < 0.6) { const c = CARDS.find(c => c.mod === worst[0]); if (c && !pick.includes(c)) pick.push(c); }
  while (pick.length < 2) { const c = pool[Math.floor(Math.random() * pool.length)]; if (!pick.includes(c)) pick.push(c); }
  $('rep').innerHTML = `<h2>${S.day}일째 보고</h2>
    <div class="row"><span>처리한 요청</span><span>${dayStat.done}개</span></div>
    <div class="row"><span>평균 걸린 시간</span><span>${avg.toFixed(1)}초</span></div>
    <div class="row"><span>검수에서 되돌아감</span><span>${dayStat.fails}번</span></div>
    <div class="row"><span>접수함이 넘쳐 놓친 요청</span><span>${dayStat.overflow}개</span></div>
    <p class="diag">${diag}</p>
    ${newType ? `<p>내일부터 인간이 <b>${REQ[newType].n}</b>도 부탁합니다. 순서: ${REQ[newType].route.map(k => KINDS[k].n).join(' → ')} → 발송구</p>` : ''}
    <p>하나를 고르세요. (1, 2)</p>
    <div class="cards">${pick.map((c, i) => `<button type="button" class="card" data-i="${i}"><b>${i + 1}. ${c.n}</b><i>${c.d}</i></button>`).join('')}</div>`;
  $('repOv').hidden = false;
  $('rep').querySelectorAll('.card').forEach(b => b.addEventListener('click', () => choose(pick[+b.dataset.i])));
  window.__pick = pick;
}
function choose(c) {
  $('repOv').hidden = true; S.day++; S.inDay = true; dayStat = newDayStat();
  if (c.mod) { const m = addMod(c.mod, -10, -10); m.lifted = true; held = m; held.from = null; ticker(`<b>${KINDS[c.mod].n}</b>을 놓을 자리를 누르세요.`); }
  else { c.f(); ticker(`${c.n}.`); }
  buildLegend();
}

// ───────── 방 옮기기 ─────────
let held = null, hover = [0, 0];
function canPlace(m, x, y) {
  if (x < 0 || y < 0 || x + 2 > GW || y + 3 > GH) return false;
  for (const o of mods) if (o !== m && !o.lifted) { if (x < o.x + 2 && x + 2 > o.x && y < o.y + 2 && y + 2 > o.y) return false; const [dx, dy] = door(o); if (dx >= x && dx < x + 2 && dy >= y && dy < y + 2) return false; if (x === dx && y + 2 === dy) return false; const [mdx, mdy] = [x, y + 2]; if (mdx >= o.x && mdx < o.x + 2 && mdy >= o.y && mdy < o.y + 2) return false; }
  // 놓은 뒤에도 접수함에서 모든 방 문까지 길이 있어야 한다
  const save = [m.x, m.y, m.lifted]; m.x = x; m.y = y; m.lifted = false; rebuildBlock();
  const inn = mods.find(o => o.kind === 'in'), [sx, sy] = door(inn); let ok = true;
  for (const o of mods) if (!o.lifted && o !== inn) { const [tx, ty] = door(o); if (!bfs(sx, sy, tx, ty)) { ok = false; break; } }
  [m.x, m.y, m.lifted] = save; rebuildBlock(); return ok;
}
function lift(m) { if (m.fixed) return; detach(m); held = m; held.from = [m.x, m.y]; m.lifted = true; rebuildBlock(); rerouteAll(); }
function drop() { const [x, y] = hover; if (!canPlace(held, x, y)) return; held.x = x; held.y = y; held.lifted = false; held = null; rebuildBlock(); rerouteAll(); }
function cancelHold() { if (!held) return; if (held.from) { held.x = held.from[0]; held.y = held.from[1]; held.lifted = false; held = null; rebuildBlock(); rerouteAll(); } }

// ───────── 한 틱 ─────────
function step(dt) {
  if (!S.inDay || held || S.paused) return;
  S.t += dt;
  arrAcc += dt * rate(); while (arrAcc >= 1) { arrAcc--; spawnReq(); }
  for (const c of crew) stepCrew(c, dt);
  for (const f of fx) f.t += dt; fx = fx.filter(f => f.t < f.life);
  if (S.t >= S.day * DAY) endDay();
}

// ───────── 그림 ─────────
const sprCache = {};
function critter(tint, frame) {
  const key = tint + frame; if (sprCache[key]) return sprCache[key];
  const s = 16, c = document.createElement('canvas'); c.width = s; c.height = s; const x = c.getContext('2d');
  const px = (a, b, col) => { x.fillStyle = col; x.fillRect(a, b, 1, 1); };
  const bot = 13, top = 3, cx = 7.5, rx = 6.4, ry = (bot - top) / 2 + 0.4, cy = top + ry - 0.4 + (frame ? 0.5 : 0);
  const inside = (i, j) => ((i - cx) / rx) ** 2 + ((j - cy) / ry) ** 2 <= 1;
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) { if (!inside(i, j)) continue; const edge = !inside(i - 1, j) || !inside(i + 1, j) || !inside(i, j - 1) || !inside(i, j + 1); px(i, j, edge ? '#2b1d2c' : tint); if (!edge && j > cy + ry * 0.35) px(i, j, 'rgba(0,0,0,.18)'); if (!edge && i < cx - 1 && j < cy - ry * 0.35) px(i, j, 'rgba(255,255,255,.28)'); }
  const ey = Math.round(cy - 1); x.fillStyle = '#1b1420'; x.fillRect(4, ey, 2, 3); x.fillRect(10, ey, 2, 3);
  x.fillStyle = '#f08a7a'; x.fillRect(2, ey + 3, 1, 1); x.fillRect(13, ey + 3, 1, 1);
  x.fillStyle = '#2b1d2c'; x.fillRect(8 + (frame ? 1 : 0), 0, 1, 3); px(8 + (frame ? 1 : 0), 0, '#7fe0d0');
  x.fillRect(4, 14, 2, frame === 0 ? 1 : 2); x.fillRect(10, 14, 2, frame === 1 ? 1 : 2);
  return (sprCache[key] = c);
}
let FLOOR;
function buildFloor() {
  FLOOR = document.createElement('canvas'); FLOOR.width = W; FLOOR.height = H; const x = FLOOR.getContext('2d');
  for (let y = 0; y < GH; y++) for (let i = 0; i < GW; i++) { x.fillStyle = (i + y) % 2 ? '#262236' : '#2a263c'; x.fillRect(i * T, y * T, T, T); }
  x.fillStyle = 'rgba(127,224,208,.06)'; for (let k = 0; k < 40; k++) { const yy = (k * 37) % H, xx = (k * 71) % W; x.fillRect(xx, yy, 20, 1); x.fillRect(xx + 20, yy, 1, 8); }
}
function drawMod(ctx, m, t, ghost) {
  const k = KINDS[m.kind], px = m.x * T, py = m.y * T;
  ctx.globalAlpha = ghost ? 0.55 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(px + 2, py + 4, 30, 30);
  ctx.fillStyle = k.col; ctx.fillRect(px + 1, py + 6, 30, 25);          // 앞면
  ctx.fillStyle = k.top; ctx.fillRect(px + 1, py + 1, 30, 7);            // 윗면(살짝 내려다본 탑뷰)
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(px + 1, py + 8, 30, 1);
  // 방 종류마다 작은 표시
  ctx.fillStyle = '#1b1828';
  if (m.kind === 'in' || m.kind === 'out') { ctx.fillRect(px + 6, py + 12, 20, 14); ctx.fillStyle = k.top; ctx.fillRect(px + 8, py + 14, 16, 2); }
  else if (m.kind === 'search') { ctx.fillRect(px + 8, py + 12, 10, 10); ctx.fillStyle = k.top; ctx.fillRect(px + 10, py + 14, 6, 6); ctx.fillStyle = '#1b1828'; ctx.fillRect(px + 18, py + 22, 6, 2); }
  else if (m.kind === 'write') { ctx.fillStyle = '#f4f1ff'; ctx.fillRect(px + 8, py + 11, 14, 16); ctx.fillStyle = '#6a5a3a'; for (let r = 0; r < 4; r++) ctx.fillRect(px + 10, py + 14 + r * 3, 10, 1); }
  else if (m.kind === 'draw') { ctx.fillStyle = '#f4f1ff'; ctx.fillRect(px + 8, py + 11, 16, 13); const cs = ['#ff9ad0', '#8ac8ff', '#ffe27a']; cs.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(px + 10 + i * 4, py + 14 + (i % 2) * 4, 4, 4); }); }
  else if (m.kind === 'calc') { ctx.fillRect(px + 8, py + 11, 16, 16); ctx.fillStyle = k.top; for (let r = 0; r < 3; r++) for (let q = 0; q < 3; q++) ctx.fillRect(px + 10 + q * 4, py + 13 + r * 4, 3, 3); }
  else if (m.kind === 'qa') { ctx.fillStyle = '#f4f1ff'; ctx.fillRect(px + 8, py + 11, 14, 14); ctx.fillStyle = '#3aa060'; ctx.fillRect(px + 11, py + 18, 2, 2); ctx.fillRect(px + 13, py + 20, 2, 2); ctx.fillRect(px + 15, py + 16, 2, 4); ctx.fillRect(px + 17, py + 14, 2, 2); }
  if (m.busy && !ghost) { ctx.fillStyle = Math.sin(t * 10) > 0 ? k.top : '#ffffff'; ctx.fillRect(px + 26, py + 10, 3, 3); }
  // 문
  const [dx, dy] = door(m); ctx.fillStyle = 'rgba(255,255,255,.08)'; ctx.fillRect(dx * T + 2, dy * T + 2, 12, 12); ctx.fillStyle = k.top; ctx.globalAlpha = (ghost ? .4 : .5); ctx.fillRect(dx * T + 4, dy * T + 1, 8, 1);
  ctx.globalAlpha = 1;
}
function drawTicket(ctx, type, x, y) { ctx.fillStyle = '#2b1d2c'; ctx.fillRect(x - 3, y - 4, 7, 6); ctx.fillStyle = REQ[type].col; ctx.fillRect(x - 2, y - 3, 5, 4); }
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function draw(t) {
  ctx.drawImage(FLOOR, 0, 0);
  for (const m of mods) if (!m.lifted) drawMod(ctx, m, t);
  // 접수함 위에 쌓인 요청
  const inn = mods.find(m => m.kind === 'in'); inbox.forEach((tk, i) => drawTicket(ctx, tk.type, inn.x * T + 6 + (i % 5) * 5, inn.y * T + 30 + 6 + Math.floor(i / 5) * 5 + 4));
  // 줄 위치: 문 옆으로 늘어선다
  for (const m of mods) m.queue.forEach((c, i) => { if (!c.path.length) { const [dx, dy] = door(m); c.x += ((dx * T + 8 + (i + 1) * 9) - c.x) * 0.2; c.y += ((dy * T + 12 + 3) - c.y) * 0.2; } });
  const order = [...crew].sort((a, b) => a.y - b.y);
  for (const c of order) {
    const moving = c.path.length > 0, fr = moving ? Math.floor(t * 8 + c.ph) % 2 : c.st === 'work' ? Math.floor(t * 5) % 2 : 0;
    const img = critter(c.tint, fr), x = Math.round(c.x - 8), y = Math.round(c.y - 14);
    ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(x + 3, y + 15, 10, 2);
    if (c.face < 0) { ctx.save(); ctx.translate(x + 16, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore(); } else ctx.drawImage(img, x, y);
    if (c.tk) drawTicket(ctx, c.tk.type, Math.round(c.x), y - 1);
  }
  for (const f of fx) { const q = f.t / f.life; if (f.k === 'spark') { ctx.fillStyle = f.col; ctx.fillRect(Math.round(f.x), Math.round(f.y - q * 6), 1, 1); } else if (f.k === 'x') { ctx.fillStyle = '#ff5a5a'; const x = Math.round(f.x), y = Math.round(f.y - q * 6); for (let k = -2; k <= 2; k++) { ctx.fillRect(x + k, y + k, 1, 1); ctx.fillRect(x + k, y - k, 1, 1); } } else if (f.k === 'ok') { ctx.fillStyle = f.col; ctx.fillRect(Math.round(f.x - 1), Math.round(f.y - q * 10), 3, 3); } }
  if (held) { const ok = canPlace(held, hover[0], hover[1]); const g = { ...held, x: hover[0], y: hover[1] }; drawMod(ctx, g, t, true); ctx.strokeStyle = ok ? '#7fe0d0' : '#ff5a5a'; ctx.lineWidth = 1; ctx.strokeRect(hover[0] * T + .5, hover[1] * T + .5, 32, 48); }
}

// ───────── HTML 글자 ─────────
const $ = id => document.getElementById(id);
function ticker(s) { $('ticker').innerHTML = s; }
function buildLegend() { $('legend').innerHTML = typesNow().map(k => `<span><i style="background:${REQ[k].col}"></i>${REQ[k].n}: ${REQ[k].route.map(r => KINDS[r].n).join(' → ')} → 발송구</span>`).join(''); }
function renderLabels() {
  const box = $('labels'); let html = '';
  for (const m of mods) {
    if (m.lifted) continue; const q = m.queue.length;
    html += `<div class="lab" style="left:${(m.x * T + 16) / W * 100}%;top:${(m.y * T + 4) / H * 100}%">${KINDS[m.kind].n}${q >= 2 ? `<small>줄 ${q}</small>` : ''}</div>`;
  }
  box.innerHTML = html;
}
function renderHud() {
  const left = Math.max(0, S.day * DAY - S.t);
  $('day').textContent = `${S.day}일째`; $('left').textContent = `하루 끝까지 ${Math.ceil(left)}초`;
  $('done').textContent = S.done; $('mood').textContent = `인간 기분 ${Math.round(S.mood)} · 접수함 ${inbox.length}/${S.inboxCap}`;
  const md = $('mode'); md.hidden = !held && !S.paused; md.textContent = held ? `${KINDS[held.kind].n} 옮기는 중 · 멈춤` : '멈춤';
  $('pause').innerHTML = `<kbd>Space</kbd>${S.paused ? '계속' : '멈춤'}`;
}

// ───────── 입력 ─────────
function toTile(e) { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * GW), Math.floor((e.clientY - r.top) / r.height * GH)]; }
cv.addEventListener('mousemove', e => { const [x, y] = toTile(e); hover = [Math.max(0, Math.min(GW - 2, x)), Math.max(0, Math.min(GH - 3, y))]; });
cv.addEventListener('click', e => {
  const [x, y] = toTile(e);
  if (held) { hover = [Math.max(0, Math.min(GW - 2, x)), Math.max(0, Math.min(GH - 3, y))]; drop(); return; }
  const m = mods.find(m => !m.lifted && x >= m.x && x < m.x + 2 && y >= m.y && y < m.y + 2); if (m) { lift(m); hover = [m.x, m.y]; }
});
cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelHold(); });
addEventListener('keydown', e => {
  if (!$('repOv').hidden) { if (e.key === '1' || e.key === '2') { const c = window.__pick[+e.key - 1]; if (c) choose(c); } return; }
  if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; }
  else if (e.key === 'Escape') cancelHold();
});
$('pause').onclick = () => { S.paused = !S.paused; };

// 확인용 봇: 카드 첫 장, 새 방은 빈자리 아무 데나
window.__sim = sec => { const dt = 0.1, out = []; for (let k = 0; k < sec / dt; k++) { step(dt); if (!$('repOv').hidden) { out.push(`day${S.day} done${dayStat.done} fails${dayStat.fails} over${dayStat.overflow} mood${Math.round(S.mood)} crew${crew.length} worst:${(Object.entries(dayStat.qwait).sort((a, b) => b[1] - a[1])[0] || ['-'])[0]}`); choose(window.__pick[0]); } if (held) { outer: for (let y = 0; y < GH; y++) for (let x = 2; x < GW - 2; x++) if (canPlace(held, x, y)) { hover = [x, y]; drop(); break outer; } } } return out.join('\n'); };

buildFloor(); buildLegend();
let last = performance.now(), labT = 0;
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; step(dt); draw(now / 1000); labT -= dt; if (labT <= 0) { labT = 0.2; renderLabels(); } renderHud(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
