<title>을지로 관제실</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: "Galmuri11"; src: url(data:font/woff2;base64,__FONT__) format("woff2"); font-display: block; }
/* 밤 책상 위 관제 모니터: 왼쪽 큰 채널 + 작은 채널 다섯, 아래 무전 로그(어두움)와 종이 전표(밝음). 네온은 켜진 것에만. */
:root {
  --desk: #14101f; --panel: #1d1830; --line: #3b3352; --dim: #8f8aa0; --fg: #ece6f5;
  --paper: #e9e2cc; --paper2: #d9d0b4; --ink: #2a2338; --inkdim: #6b6258;
  --cyan: #41e0c8; --pink: #ff3cac; --amber: #f2b84b;
  --f: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--desk); color: var(--fg); font: 13px/1.5 var(--f); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 20px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }

/* 머리 */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
h1 { margin: 0; font-size: 22px; font-weight: 400; letter-spacing: .02em; }
h1 small { font-size: 12px; color: var(--dim); margin-left: 8px; }
.money { text-align: right; font-variant-numeric: tabular-nums; }
.money b { font-size: 24px; font-weight: 400; color: var(--amber); }
.money span { color: var(--dim); font-size: 12px; display: block; }
.rent { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--dim); }
.rent .bar { flex: 1; height: 6px; background: var(--panel); border: 1px solid var(--line); min-width: 80px; }
.rent .bar i { display: block; height: 100%; background: var(--amber); width: 0; }

/* 채널 */
.wall { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; grid-auto-flow: dense; }
.feed { position: relative; background: #000; border: 2px solid var(--line); cursor: pointer; padding: 0; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; display: block; }
.feed.sel { border-color: var(--cyan); box-shadow: 0 0 0 1px var(--cyan), 0 0 14px rgba(65,224,200,.35); grid-column: span 2; grid-row: span 2; }
.feed.hot { border-color: var(--pink); }
.feed.sel.hot { box-shadow: 0 0 0 1px var(--pink), 0 0 16px rgba(255,60,172,.45); }
.feed canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
.osd { position: absolute; inset: 0; pointer-events: none; font-size: 11px; color: #fff; text-shadow: 1px 1px 0 #000; }
.osd .tl { position: absolute; left: 6px; top: 4px; }
.osd .tr { position: absolute; right: 6px; top: 4px; font-variant-numeric: tabular-nums; }
.osd .bl { position: absolute; left: 6px; bottom: 4px; }
.osd .rec { color: #ff5a5a; }
.osd .alarm { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); background: var(--pink); color: #fff; padding: 1px 8px; font-size: 12px; text-shadow: none; white-space: nowrap; animation: blink 1s steps(2) infinite; }
.feed.sel .osd { font-size: 13px; }
.feed.sel .osd .alarm { font-size: 15px; }
.fl { position: absolute; transform: translate(-50%, -50%); color: #fff8d8; font-size: 11px; text-shadow: 1px 1px 0 #000; white-space: nowrap; animation: up .9s ease-out forwards; }
.feed.sel .fl { font-size: 13px; }
.fl.boss { color: var(--pink); font-size: 14px; }
.lockcap { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--dim); font-size: 12px; pointer-events: none; text-shadow: 1px 1px 0 #000; }
.lockcap b { display: block; color: var(--fg); font-weight: 400; font-size: 14px; }
@keyframes up { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -22px; } }
@keyframes blink { 50% { opacity: .35; } }

/* 아래 줄 */
.low { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.log { background: var(--panel); border: 1px solid var(--line); padding: 8px 10px; height: 176px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; font-size: 12px; }
.log p { margin: 0; color: var(--dim); }
.log p b { font-weight: 400; color: var(--fg); }
.log p.new { color: var(--fg); }
.log p.pk { color: var(--pink); }
.log p.cy { color: var(--cyan); }
.log p.sms { color: var(--amber); }
.slip { background: var(--paper); color: var(--ink); padding: 10px 12px; display: grid; gap: 6px; align-content: start; }
.slip h2 { margin: 0; font-size: 13px; font-weight: 400; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--inkdim); padding-bottom: 4px; }
.slip h2 button { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; font-size: 12px; }
.qb { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; text-align: left; background: var(--paper2); border: 1px solid var(--inkdim); padding: 5px 8px; cursor: pointer; color: var(--ink); }
.qb:hover { background: #fff6dc; }
.qb.first { border: 2px solid var(--ink); }
.qb b { font-weight: 400; }
.qb em { font-style: normal; font-variant-numeric: tabular-nums; }
.qb i { grid-column: 1 / -1; font-style: normal; font-size: 11px; color: var(--inkdim); }
.qempty { font-size: 12px; color: var(--inkdim); }
.keys { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--dim); }
.keys button { background: none; border: 0; padding: 2px 0; cursor: pointer; color: var(--dim); }
.keys button:hover { color: var(--fg); }
.keys kbd { font: inherit; color: var(--fg); border: 1px solid var(--line); background: var(--panel); padding: 0 5px; margin-right: 4px; }
.units { font-size: 12px; color: var(--dim); }

/* 대책도 = 업그레이드 표 */
.ov { position: fixed; inset: 0; background: rgba(10,8,18,.82); display: grid; place-items: center; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); z-index: 20; }
.sheet { background: var(--paper); color: var(--ink); width: min(980px, 100%); max-height: 100%; overflow: auto; padding: 14px 16px; }
.sheet h2 { margin: 0 0 4px; font-size: 18px; font-weight: 400; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sheet h2 small { font-size: 12px; color: var(--inkdim); }
.cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
.col h3 { margin: 0 0 6px; font-size: 13px; font-weight: 400; border-bottom: 1px solid var(--ink); }
.node { position: relative; display: block; width: 100%; text-align: left; background: var(--paper2); border: 1px solid var(--inkdim); padding: 5px 7px; margin-bottom: 10px; cursor: pointer; color: var(--ink); }
.node::after { content: ""; position: absolute; left: 14px; bottom: -11px; width: 2px; height: 10px; background: var(--inkdim); }
.node:last-child::after { display: none; }
.node b { font-weight: 400; display: block; }
.node i { font-style: normal; font-size: 11px; color: var(--inkdim); display: block; }
.node em { font-style: normal; font-size: 12px; font-variant-numeric: tabular-nums; }
.node.own { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.node.own i { color: #b9b0c9; }
.node.can { border: 2px solid var(--ink); background: #fff6dc; }
.node.lock { opacity: .55; cursor: default; }
.node.hid { opacity: .4; cursor: default; }
.stamp { display: inline-block; border: 1.5px solid currentColor; border-radius: 50%; padding: 0 5px; font-size: 11px; transform: rotate(-6deg); }

/* 아침 보고 */
.report { background: var(--paper); color: var(--ink); width: min(420px, 100%); padding: 16px 18px; display: grid; gap: 8px; }
.report h2 { margin: 0; font-size: 18px; font-weight: 400; }
.report p { margin: 0; }
.report .row { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--inkdim); padding: 2px 0; font-variant-numeric: tabular-nums; }
.report .say { color: var(--inkdim); }
.report button { background: var(--ink); color: var(--paper); border: 0; padding: 8px; cursor: pointer; }

@media (max-width: 760px) {
  .wall { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .feed.sel { grid-row: span 1; }
  .feed:not(.sel) .osd .tr, .feed:not(.sel) .osd .bl { display: none; }
  .low { grid-template-columns: minmax(0, 1fr); }
  .cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .log { height: 140px; }
}
@media (prefers-reduced-motion: reduce) { .fl, .osd .alarm { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>을지로 관제실<small>서울나이트워치 · 밤 근무</small></h1>
    <div class="money"><b id="money">₩0</b><span id="rate">초당 ₩0</span></div>

      <div class="units" id="units"></div>

</div>

<div class="ov" id="treeOv" hidden>
  <div class="sheet" role="dialog" aria-label="대책 장부">

</div>
<div class="ov" id="repOv" hidden>

</div>

<script>
'use strict';
// ───────── 데이터 ─────────
const W = 160, H = 90;
const DIST = [
  { id: 'alley', n: '노포 골목', pool: ['virgin', 'egg'], m: 1 },
  { id: 'print', n: '인쇄소 골목', pool: ['egg', 'virgin'], m: 5 },
  { id: 'arcade', n: '을지로 지하상가', pool: ['virgin', 'subway'], m: 25 },
  { id: 'station', n: '을지로3가역', pool: ['subway', 'egg'], m: 125 },
  { id: 'motel', n: '폐모텔', pool: ['virgin', 'egg', 'subway'], m: 625 },
  { id: 'roof', n: '옥탑 달동네', pool: ['egg', 'virgin', 'subway'], m: 3125 },
];
const GT = {
  wisp:   { n: '도깨비불', hp: 3, r: 1, c: 0.6, sp: 14 },
  egg:    { n: '달걀귀신', hp: 14, r: 6, c: 2, sp: 6 },
  virgin: { n: '처녀귀신', hp: 18, r: 8, c: 2.5, sp: 5 },
  subway: { n: '지하철 망령', hp: 12, r: 6, c: 2, sp: 34 },
  boss:   { n: '구미호', hp: 160, r: 120, c: 0, sp: 4 },
};
const UT = {
  dir:  { n: '소장', dmg: 3, cd: 0.55, sp: 26 },
  appr: { n: '견습', dmg: 1.2, cd: 0.7, sp: 22 },
  cat:  { n: '뚱고양이', dmg: 0.6, cd: 1.2, sp: 12 },
};
// 노드: col 0 대원 · 1 장비 · 2 사무소 · 3 관제. 같은 열은 위에서부터 차례로.
const COLS = ['대원', '장비', '사무소', '관제'];
const NODES = [
  ['a1', 0, '견습 퇴마사 1호', '인쇄소 2층 사는 대학원생. 시급만 맞으면 귀신도 본다.', 15, { hire: 'appr' }],
  ['a2', 0, '뚱고양이', '힘이 봉인된 백 년 묵은 영물. 일은 안 하는데 옆에 있으면 영력이 더 나온다.', 140, { hire: 'cat', inc: 1.3 }],
  ['a3', 0, '견습 2호', '편의점 야간 알바와 투잡. 계산대 앞에서 단련된 반사신경.', 450, { hire: 'appr' }],
  ['a4', 0, '견습 3호', '노포 둘째 아들. 국자로 귀신을 때려 본 적 있다.', 1800, { hire: 'appr' }],
  ['a5', 0, '견습 4호', '퇴사한 은행원. 귀신에게도 번호표를 뽑게 한다.', 7000, { hire: 'appr' }],
  ['a6', 0, '견습 5호', '막차 놓친 회사원. 어차피 첫차까지 시간이 남는다.', 28000, { hire: 'appr' }],
  ['a7', 0, '견습 6호', '인쇄소 사장님. 부적을 4도 인쇄로 뽑는다.', 110000, { hire: 'appr' }],
  ['a8', 0, '견습 7호', '점집 딸. 엄마 몰래 나왔다.', 450000, { hire: 'appr' }],
  ['a9', 0, '견습 8호', '택시 기사님. 귀신도 손님이다.', 1.8e6, { hire: 'appr' }],
  ['a10', 0, '견습 9호', '경리의 스터디 친구. 경리가 데려왔다.', 7e6, { hire: 'appr' }],
  ['b1', 1, '신문지 새로 감기', '어제 신문으로 다시 쌌다. 오늘의 운세: 대길.', 25, { dmg: 1.6 }],
  ['b2', 1, '숫돌', '을지로 철물점에서 샀다. 영수증은 경리가 가져갔다.', 220, { dmg: 2 }],
  ['b3', 1, '팥 주머니', '팥은 언제나 듣는다. 남으면 팥죽.', 900, { dmg: 2 }],
  ['b4', 1, '경면주사 부적', '붉은 글씨가 진할수록 잘 듣는다고 믿는다.', 3500, { dmg: 2.2 }],
  ['b5', 1, '복숭아나무 칼집', '귀신이 싫어하는 나무. 소장은 냄새가 좋다고 한다.', 15000, { dmg: 2.4 }],
  ['b6', 1, '오방색 매듭', '손잡이에 다섯 색 실을 감았다. 손에 덜 미끄럽다.', 60000, { dmg: 2.5 }],
  ['b7', 1, '사인검 손잡이 수리', '흔들리던 손잡이를 고쳤다. 이제야 칼 같다.', 250000, { dmg: 2.6 }],
  ['b8', 1, '별자리 각인 다시 새기기', '칼날의 스물여덟 별자리를 다시 팠다.', 1e6, { dmg: 2.8 }],
  ['b9', 1, '진심 모드', '평소엔 대충. 지금은 진심.', 4e6, { dmg: 3 }],
  ['b10', 1, '신문지 벗기기', '칼날이 처음으로 보인다.', 1.6e7, { dmg: 3.5 }],
  ['c1', 2, 'CCTV · 인쇄소 골목', '2번 채널이 켜진다. 밤새 인쇄기가 혼자 돈다는 곳.', 60, { unlock: 1 }],
  ['c2', 2, '경리 장부', '영수증 정리부터 시작했다. 새던 돈이 막힌다.', 320, { inc: 1.5 }],
  ['c3', 2, 'CCTV · 을지로 지하상가', '3번 채널. 셔터가 내려간 뒤 마네킹이 한 칸씩 옮겨진다.', 1300, { unlock: 2 }],
  ['c4', 2, '김밥 야식', '라면 대신 김밥. 경리가 사 왔다. 다들 손이 빨라진다.', 5000, { spd: 1.35 }],
  ['c5', 2, 'CCTV · 을지로3가역', '4번 채널. 막차가 지나간 뒤 승강장에 발소리가 난다.', 14000, { unlock: 3 }],
  ['c6', 2, '자동 배치표', '경리가 화이트보드에 이름표를 붙였다 뗐다 한다. 일손이 알아서 몰린다.', 35000, { auto: 1 }],
  ['c7', 2, 'CCTV · 폐모텔', '5번 채널. 304호 TV가 또 켜졌다.', 130000, { unlock: 4 }],
  ['c8', 2, '집주인 할머니 문자', '"월세 날짜 알지?" 읽고 나면 다들 일을 더 한다. 자리를 비운 동안 버는 돈 ×2.', 420000, { offline: 2, inc: 1.2 }],
  ['c9', 2, 'CCTV · 옥탑 달동네', '6번 채널. 옥상 물탱크에서 노랫소리가 난다.', 1.3e6, { unlock: 5 }],
  ['c10', 2, '밀린 월세 완납', '을지로의 밤이 조용해진다. 할머니가 처음으로 이모티콘을 보낸다.', 6e7, { end: 1 }],
  ['d1', 3, '부적 묶음', '부적을 한 번에 세 장씩 던진다.', 30, { tap: 3 }],
  ['d2', 3, '무전기', '현장 잡담이 더 자주 들린다. 들으면서 일하면 손이 덜 논다.', 160, { inc: 1.15, chat: 1 }],
  ['d3', 3, '비 오는 밤', '비 오는 밤엔 귀신도 많고 영력도 많다.', 750, { rain: 1, inc: 1.3 }],
  ['d4', 3, '간판 네온 수리', '꺼져 가던 간판에 불이 들어온다. 골목이 밝으면 귀신이 빨리 나온다.', 2800, { inc: 1.3, neon: 1 }],
  ['d5', 3, '시티팝 라디오', '사무소 라디오에서 80년대 노래가 흐른다. 칼질에 박자가 붙는다.', 10000, { inc: 1.3, spd: 1.2 }],
  ['d6', 3, '확대 렌즈', '부적이 귀신 정수리에 정확히 붙는다. 부적 ×4.', 32000, { tap: 4 }],
  ['d7', 3, '구미호 추적', '긴급이 더 일찍 울리고, 구미호 꼬리 값이 세 배.', 110000, { boss: 3, early: 1 }],
  ['d8', 3, '야간 무전 개방', '을지로 상인 단톡방과 무전을 잇는다. 제보가 쏟아진다.', 450000, { inc: 1.6 }],
  ['d9', 3, '을지로 작전 지도', '옛 인쇄 지도에 압정을 꽂았다. 다음 지역이 보이기 시작한다.', 2.5e6, { inc: 1.8, dmg: 1.5 }],
];
const COSTK = 1.45; // 열 안에서 아래로 갈수록 값이 더 가파르게
const NODE = {}; NODES.forEach((r, i) => { const k = NODES.filter((x, j) => j < i && x[1] === r[1]).length; NODE[r[0]] = { id: r[0], col: r[1], n: r[2], d: r[3], cost: Math.round(r[4] * Math.pow(COSTK, k) / 5) * 5 || r[4], e: r[5], k }; });
const NLIST = NODES.map(r => NODE[r[0]]);

    <div class="row"><span>정산</span><span>₩${fmt(amt)}</span></div>
    <p class="say">${D.offline > 1 ? '할머니 문자 덕분에 다들 열심히 했어요.' : '사람이 없으니 반만 했대요. 할머니 문자를 받으면 다들 더 해요.'}</p>
    <button type="button" id="repOk">Enter · 다시 관제</button>`;
  $('repOv').hidden = false; $('repOk').focus(); $('repOk').addEventListener('click', () => $('repOv').hidden = true);
}

// ───────── 입력 ─────────
function toggleTree(v) { const ov = $('treeOv'); ov.hidden = v === undefined ? !ov.hidden : !v; if (!ov.hidden) renderTree(); }
addEventListener('keydown', e => {
  if (!$('repOv').hidden) { if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') { $('repOv').hidden = true; e.preventDefault(); } return; }
  if (e.key >= '1' && e.key <= '6') { S.sel = +e.key - 1; renderSel(); renderUnits(); }
  else if (e.code === 'Space') { e.preventDefault(); tap(); }
  else if (e.key === 'q' || e.key === 'Q' || e.key === 'ㅂ') { buyBest(); if (!$('treeOv').hidden) renderTree(); }
  else if (e.key === 'e' || e.key === 'E' || e.key === 'ㄷ') sendHere();
  else if (e.key === 't' || e.key === 'T' || e.key === 'ㅅ' || e.key === 'Tab') { e.preventDefault(); toggleTree(); }
  else if (e.key === 'Escape') toggleTree(false);
});
$('openTree').addEventListener('click', () => toggleTree(true));
$('kTap').addEventListener('click', tap); $('kBuy').addEventListener('click', buyBest); $('kSend').addEventListener('click', sendHere); $('kTree').addEventListener('click', () => toggleTree(true));
$('treeOv').addEventListener('click', e => { if (e.target === $('treeOv')) toggleTree(false); });
$('repOv').addEventListener('click', e => { if (e.target === $('repOv')) $('repOv').hidden = true; });
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => { if (document.hidden) { hiddenAt = Date.now(); S.lastRate = rate(); save(); } else if (hiddenAt) { awayReport((Date.now() - hiddenAt) / 1000, '잠깐 자리 비우셨죠? 그동안 대원들이 알아서 했어요.'); hiddenAt = 0; } });

// ───────── 돌리기 ─────────
let SIM = false;
let last = performance.now(), noiseT = 0;
function frame(now) {
  let dt = Math.min(0.1, (now - last) / 1000); last = now;
  step(dt);
  const t = now / 1000; noiseT -= dt;
  feeds.forEach((f, i) => {
    const r = R[i];
    if (!D.open[i]) { if (noiseT <= 0) drawNoise(f.ctx); const n = NLIST.find(n => n.e.unlock === i); f.lk.innerHTML = `<span><b>NO SIGNAL</b>${n ? n.n.replace('CCTV · ', 'CCTV 설치 ') + ' · ₩' + fmt(n.cost) : ''}</span>`; f.tr.textContent = ''; f.bl.textContent = ''; return; }
    f.lk.innerHTML = ''; drawFeed(r, f.ctx, t);
    f.tr.innerHTML = `<span class="rec">●</span> ${clockStr(S.clock)}`;
    const boss = r.ghosts.some(g => g.t === 'boss'), nu = UNITS.filter(u => u.d === i).length;
    f.bl.textContent = `괴이 ${r.ghosts.length} · 대원 ${nu}`;
    f.b.classList.toggle('hot', boss);
    if (boss && !f.alarm) { f.alarm = document.createElement('span'); f.alarm.className = 'alarm'; f.alarm.textContent = '긴급 · 구미호'; f.osd.append(f.alarm); }
    if (!boss && f.alarm) { f.alarm.remove(); f.alarm = null; }
  });
  if (noiseT <= 0) noiseT = 0.08;
  renderMoney(); renderQuick();
  if (S.clock > S.nights * 600) { S.nights++; log(`<b>경리</b> ${S.nights}일째 밤이에요. 오늘도 월세 생각하면서 일해요.`, ''); }
  requestAnimationFrame(frame);
}
// 시뮬레이션(밸런스 확인용): window.__sim(초, {tapsPerSec})
window.__dbg = () => R.filter(r => D.open[r.i]).map(r => `${r.i}:u${UNITS.filter(u => u.d === r.i).map(u => u.k[0]).join('')} g${r.ghosts.length} c${Math.round(r.c)} b${r.ghosts.some(g => g.t === 'boss') ? 1 : 0}`).join(' ') + ' dmg' + Math.round(D.dmg) + ' inc' + D.inc.toFixed(1);
window.__sim = (sec, o = {}) => { SIM = true; const marks = []; let tapAcc = 0; const dt = 0.1; for (let k = 0; k < sec / dt; k++) { step(dt); tapAcc += dt * (o.tps || 0); while (tapAcc >= 1) { tapAcc--; tap(); } if (k % 10 === 0) { const before = Object.keys(S.owned).length; buyBest(); if (o.send && k % 50 === 0) { const open = R.filter(r => D.open[r.i]); const empty = open.find(r => !UNITS.some(u => u.d === r.i)); if (empty) { S.sel = empty.i; sendHere(); } } if (Object.keys(S.owned).length > before) marks.push([Math.round(k * dt), NLIST.find(n => S.owned[n.id] && !marks.some(m => m[2] === n.id) && true)?.id]); } if (S.ended) break; } SIM = false; return { t: S.clock, owned: Object.keys(S.owned).length, money: S.money, ended: S.ended, order: Object.keys(S.owned), rate: rate() }; };

buildWall(); renderAll();
{ const away = (Date.now() - (S.saved || Date.now())) / 1000; if (S.total > 0 && away > 60) awayReport(away, '어젯밤 기록이에요. 소장님 없는 동안도 다들 나왔어요.'); }
log('<b>경리</b> 오늘 밤 관제 시작해요. 화면은 알아서 돌아가니까 밥 드시면서 보세요.', '');
log('<b>소장</b> ...밥 먹고 할게.', '');
requestAnimationFrame(frame);
</script>
