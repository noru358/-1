/* 타일 회로판(16×9) + 위 목표·지표 줄 + 아래 도구, 꼬물이 목록, 방송 띠. 하루 보고는 종이. */
:root {
  --bg: #12101a; --panel: #1c1928; --line: #363049; --fg: #ece6f5; --dim: #9a93ad;
  --acc: #7fe0d0; --warm: #f2b46d; --hot: #ff6a5a; --paper: #e9e2cc; --ink: #2a2338; --inkdim: #6b6258;
  --f: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--f); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 8px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 400; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--dim); }
.stats b { color: var(--acc); font-weight: 400; }
.goal { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.goal b { font-weight: 400; color: var(--warm); }
.goal .bar { flex: 1; min-width: 80px; height: 5px; background: #2a2538; }
.goal .bar i { display: block; height: 100%; background: var(--warm); }
.daybar { height: 4px; background: var(--panel); }
.daybar i { display: block; height: 100%; background: var(--acc); width: 0; }
.screen { position: relative; border: 2px solid var(--line); background: #000; aspect-ratio: 16 / 9; max-width: 100%; }
.screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, 0); font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; white-space: nowrap; line-height: 1.1; }
.badge { position: absolute; transform: translate(-50%, -100%); background: var(--warm); color: var(--ink); font-size: 10px; padding: 0 4px; white-space: nowrap; }
.badge.hot { background: var(--hot); color: #fff; animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .4; } }
.mode { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); background: var(--warm); color: var(--ink); padding: 0 10px; font-size: 12px; pointer-events: none; white-space: nowrap; }
.pop { position: absolute; background: var(--paper); color: var(--ink); padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; z-index: 5; min-width: 170px; max-width: 260px; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.pop b { font-weight: 400; font-size: 13px; }
.pop .row { display: flex; flex-wrap: wrap; gap: 4px; }
.pop button { background: #d9d0b4; border: 1px solid var(--inkdim); padding: 1px 6px; cursor: pointer; color: var(--ink); }
.pop button.on { background: var(--ink); color: var(--paper); }
.pop i { font-style: normal; color: var(--inkdim); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools button { background: var(--panel); border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; color: var(--dim); }
.tools button.on { border-color: var(--acc); color: var(--fg); }
.tools kbd { font: inherit; color: var(--fg); border: 1px solid var(--line); padding: 0 4px; margin-right: 4px; }
.tools .inv { color: var(--dim); font-size: 12px; margin-left: auto; }
.tools .inv b { color: var(--fg); font-weight: 400; }
.low { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 8px; }
.ticker { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; color: var(--dim); min-height: 2.2em; }
.ticker b { color: var(--fg); font-weight: 400; }
.crew { background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; font-size: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px 12px; align-content: start; }
.crew div { display: flex; justify-content: space-between; gap: 6px; white-space: nowrap; overflow: hidden; }
.crew span { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.crew span.idle { color: var(--warm); }
.crew span.stuck { color: var(--hot); }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 8px; height: 8px; margin-right: 2px; vertical-align: 0; border: 1px solid #000; }
.ov { position: fixed; inset: 0; background: rgba(10,8,18,.8); display: grid; place-items: center; z-index: 20; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.report { background: var(--paper); color: var(--ink); width: min(580px, 100%); padding: 14px 18px; display: grid; gap: 6px; max-height: 100%; overflow: auto; }
.report h2 { margin: 0; font-size: 18px; font-weight: 400; }
.report table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
.report td, .report th { border-bottom: 1px dashed var(--inkdim); padding: 2px 4px; text-align: right; font-weight: 400; }
.report td:first-child, .report th:first-child { text-align: left; }
.report .up { color: #2a7a4a; } .report .down { color: #a83a3a; }
.report p { margin: 0; color: var(--inkdim); }
.report .diag { color: var(--ink); background: #fff3d0; padding: 6px 8px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.card { text-align: left; background: #d9d0b4; border: 2px solid var(--ink); padding: 8px 10px; cursor: pointer; color: var(--ink); display: grid; gap: 2px; }
.card:hover { background: #fff6dc; }
.card b { font-weight: 400; font-size: 14px; }
.card i { font-style: normal; font-size: 12px; color: var(--inkdim); }
.help { font-size: 12px; color: var(--dim); margin: 0; max-width: 90ch; }
@media (max-width: 640px) { .cards, .low { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .badge.hot { animation: none; } }
</style>

    <div class="stats"><span id="day">1일째</span><span>오늘 처리 <b id="done">0</b></span><span id="avg">평균 -</span><span id="qual">검수 통과 -</span><span id="cost">유지비 -</span></div>
  </header>
  <div class="goal" id="goal"></div>
  <div class="daybar"><i id="dayFill"></i></div>
  <div class="screen" id="screen"><canvas id="cv" width="384" height="216"></canvas><div class="labels" id="labels"></div><div class="mode" id="mode" hidden></div><div class="pop" id="pop" hidden></div></div>
  <div class="tools">
    <button type="button" id="tSel" class="on"><kbd>S</kbd>고르기</button>
    <button type="button" id="tRoad"><kbd>R</kbd>길 깔기</button>
    <button type="button" id="tErase"><kbd>E</kbd>길 지우기</button>
    <button type="button" id="tPause"><kbd>Space</kbd>멈춤</button>
    <span class="inv" id="inv"></span>
  </div>
  <div class="low"><div class="ticker" id="ticker"><b>인간</b> 컴퓨터 앞에 앉았다.</div><div class="crew" id="crew"></div></div>
  <div class="legend" id="legend"></div>
  <p class="help">인간의 주문서가 왼쪽 <b>접수함</b>에 쌓입니다. 꼬물이가 주문서를 <b>편집실</b>로 옮기면, 다른 꼬물이들이 그 주문에 필요한 <b>부품</b>(자료·글·그림·표)을 각 방에서 만들어 편집실로 가져옵니다. 부품이 다 모이면 편집실에서 합치고, <b>검수대</b>를 거쳐 <b>발송구</b>로 보냅니다. 꼬물이는 깔아 둔 <b>길</b>로만 다닙니다. 방을 누르면 옮기거나 받을 주문을 고를 수 있습니다.</p>
</div>
<div class="ov" id="repOv" hidden><div class="report" role="dialog" aria-label="하루 보고" id="rep"></div></div>

<script>
'use strict';
// ═════════ 표: 숫자와 글은 모두 여기 ═════════
const T = 24, GW = 16, GH = 9, W = GW * T, H = GH * T;
const DAY = 60, INBOX_CAP = 8, EDIT_SLOTS = 3, QA_FAIL = 0.18, ROOM_UPKEEP = 3;
// 부품: 어느 방에서 만들어지나
const PARTS = {
  doc:  { n: '자료', col: '#8ac8ff', room: 'search' },
  text: { n: '글',   col: '#f4f1ff', room: 'write' },
  pic:  { n: '그림', col: '#ff9ad0', room: 'draw' },
  tab:  { n: '표',   col: '#f0e070', room: 'calc' },
};
// 방: work = 기본 일하는 시간(초)
const KINDS = {
  in:     { n: '접수함', col: '#3e5878', top: '#8ac8ff' },
  out:    { n: '발송구', col: '#335a4c', top: '#7fe0d0' },
  search: { n: '검색실', col: '#34406a', top: '#9ab0ff', work: 2.0, part: 'doc' },
  write:  { n: '작성실', col: '#5e5032', top: '#ffd38a', work: 2.4, part: 'text' },
  draw:   { n: '그림실', col: '#5e3450', top: '#ff9ad0', work: 3.0, part: 'pic' },
  calc:   { n: '계산실', col: '#545228', top: '#f0e070', work: 2.0, part: 'tab' },
  edit:   { n: '편집실', col: '#3a4a3a', top: '#a8e0a8', work: 1.0 },   // + 부품 하나당 0.4초
  qa:     { n: '검수대', col: '#583434', top: '#ff8a7a', work: 1.0 },
};
// 주문 = 부품 조립식 (shapez의 모양, Little Big Workshop의 제품)
const RECIPES = {
  answer: { n: '질문 답변', parts: { doc: 1, text: 1 }, say: ['"이거 왜 안 돼?"', '"이메일 좀 다듬어 줘"', '"점심 뭐 먹지"'] },
  art:    { n: '그림 요청', parts: { doc: 1, pic: 1 }, say: ['"고양이 그려 줘"', '"프로필 사진 만들어 줘"'] },
  budget: { n: '가계부',   parts: { tab: 2 }, say: ['"이번 달 가계부 정리"', '"더치페이 계산해 줘"'] },
  slides: { n: '발표 자료', parts: { doc: 2, tab: 1, pic: 1 }, say: ['"내일 발표인데..."', '"회의 자료 만들어 줘"'] },
  report: { n: '보고서',   parts: { doc: 2, tab: 1, text: 1 }, say: ['"시장 조사 좀 해 줘"', '"내일까지 보고서..."'] },
  blog:   { n: '블로그 글', parts: { text: 2, pic: 1 }, say: ['"여행 후기 써 줘"', '"맛집 리뷰 올려 줘"'] },
};
// 목표 = 해금 (shapez의 허브 목표)
const GOALS = [
  { need: { answer: 8 },  gives: { room: 'draw', recipe: 'art' },     n: '그림실이 열리고 그림 요청이 들어온다' },
  { need: { art: 6 },     gives: { room: 'calc', recipe: 'budget' },  n: '계산실이 열리고 가계부 주문이 들어온다' },
  { need: { budget: 6 },  gives: { room: 'edit', recipe: 'slides' },  n: '편집실 하나 더, 발표 자료 주문' },
  { need: { slides: 5 },  gives: { room: 'search', recipe: 'report' }, n: '검색실 하나 더, 보고서 주문' },
  { need: { report: 5 },  gives: { room: 'write', recipe: 'blog' },    n: '작성실 하나 더, 블로그 글 주문' },
  { need: { blog: 8, slides: 8, report: 8 }, gives: {}, n: '이 컴퓨터의 마지막 목표' },
];
const NAMES = ['꼬미', '물이', '삑이', '도리', '콩이', '비트', '바이', '클로', '모리', '찌리', '토리', '나노', '포포', '두두'];
const TINTS = ['#f2b46d', '#9fd88a', '#8ac8ff', '#f2a0c8', '#e8d870', '#c8a8ff', '#ff9a6a', '#7fe0d0', '#f4f1ff', '#d8b890', '#b0e0ff', '#ffc0a0', '#a0f0c0', '#ffb0d8'];

// ═════════ 상태 ═════════
const S = { day: 1, t: 0, walk: 1, qaFail: QA_FAIL, inboxCap: INBOX_CAP, roads: 0, paused: false, inDay: true, goal: 0, recipes: ['answer'], delivered: {}, best: null, yday: null };
const road = new Uint8Array(GW * GH);
let sts = [], crew = [], orders = [], inbox = [], fx = [], uid = 0, D = newDay();
function newDay() { return { done: 0, wait: 0, qaPass: 0, qaFail: 0, lost: 0, qwait: {}, stuck: {} }; }
const at = (x, y) => sts.find(s => !s.held && s.x === x && s.y === y);
const inb = (x, y) => x >= 0 && y >= 0 && x < GW && y < GH;
function addSt(kind, x, y) { const s = { id: uid++, kind, x, y, busy: null, queue: [], accept: null, orders: [], fixed: kind === 'in' || kind === 'out' }; sts.push(s); return s; }
addSt('in', 0, 4); addSt('out', 15, 4);
for (let x = 1; x <= 14; x++) road[4 * GW + x] = 1;
addSt('search', 3, 3); addSt('write', 6, 5); addSt('edit', 9, 3); addSt('qa', 12, 5);
S.roads = 30 - 14;
function addCrew() { const i = crew.length; crew.push({ i, name: NAMES[i % NAMES.length], tint: TINTS[i % TINTS.length], x: (2 + i % 10) * T + 12, y: 4 * T + 18, path: [], fin: null, acts: [], job: null, st: 'idle', s: null, wt: 0, carry: null, face: 1, ph: Math.random() * 6, look: 0, why: '', skill: {}, retry: 0 }); }
for (let k = 0; k < 5; k++) addCrew();

// ═════════ 길 찾기: 길 칸만 지나고 마지막 한 칸(방)에만 들어간다 ═════════
function bfs(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const prev = new Int16Array(GW * GH).fill(-1), s0 = sy * GW + sx, goal = ty * GW + tx, q = [s0]; prev[s0] = s0;
  for (let h = 0; h < q.length; h++) {
    const c = q[h], cx = c % GW, cy = (c / GW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy; if (!inb(nx, ny)) continue; const n = ny * GW + nx;
      if (prev[n] >= 0 || (n !== goal && !road[n])) continue; prev[n] = c;
      if (n === goal) { const out = []; let k = n; while (k !== s0) { out.push([k % GW, (k / GW) | 0]); k = prev[k]; } return out.reverse(); }
      q.push(n);
    }
  }
  return null;
}
const tileOf = c => [Math.max(0, Math.min(GW - 1, Math.floor(c.x / T))), Math.max(0, Math.min(GH - 1, Math.floor((c.y - 6) / T)))];
const center = (x, y) => [x * T + 12, y * T + 18];
const reach = (c, s) => { const [x, y] = tileOf(c); return bfs(x, y, s.x, s.y); };
const lvl = (c, kind) => Math.min(3, Math.floor((c.skill[kind] || 0) / 5));
function bestRoom(c, kind) { // 가까움 + 줄 길이 (Two Point Hospital: 방을 모으면 덜 걷는다)
  let best = null, bs = 1e9;
  for (const s of sts) if (!s.held && s.kind === kind) { const p = reach(c, s); if (!p) continue; const sc = p.length / (2.6 * S.walk) + (s.queue.length + (s.busy ? 1 : 0)) * (KINDS[kind].work || 1); if (sc < bs) { bs = sc; best = s; } }
  return best;
}

// ═════════ 일감: 고르는 순서 = 합치기 > 부품 > 주문서 옮기기 (끝낼 것부터) ═════════
const partsLeft = o => Object.entries(o.need).filter(([p, n]) => n - (o.have[p] || 0) - (o.making[p] || 0) > 0).map(([p]) => p);
const isReady = o => o.edit && Object.entries(o.need).every(([p, n]) => (o.have[p] || 0) >= n);
function editFor(c, o) { let best = null, bl = 1e9; for (const s of sts) if (!s.held && s.kind === 'edit' && s.orders.length < EDIT_SLOTS && (!s.accept || s.accept.has(o.r))) { const p = reach(c, s); if (p && p.length < bl) { bl = p.length; best = s; } } return best; }
function findJob(c) {
  // 1) 부품이 다 모인 주문 합치기
  for (const o of orders) if (o.state === 'placed' && !o.asm && isReady(o) && reach(c, o.edit)) { o.asm = c; o.state = 'asm'; return { kind: 'asm', o, acts: [{ to: () => o.edit, act: 'work' }, { to: () => bestRoom(c, 'qa'), act: 'qa' }, { to: () => sts.find(s => s.kind === 'out'), act: 'deliver' }] }; }
  // 2) 부품 만들기: 그 꼬물이가 잘하는 부품을 먼저
  const opts = [];
  for (const o of orders) if (o.state === 'placed') for (const p of partsLeft(o)) { const r = bestRoom(c, PARTS[p].room); if (r && reach(c, o.edit)) opts.push({ o, p, sc: o.t0 - lvl(c, PARTS[p].room) * 6 }); else noteStuck(PARTS[p].room); }
  if (opts.length) { opts.sort((a, b) => a.sc - b.sc); const { o, p } = opts[0]; o.making[p] = (o.making[p] || 0) + 1; return { kind: 'part', o, p, acts: [{ to: () => bestRoom(c, PARTS[p].room), act: 'work' }, { to: () => o.edit, act: 'drop' }] }; }
  // 3) 주문서를 편집실로 (배부)
  const inn = sts.find(s => s.kind === 'in');
  for (const o of inbox) if (!o.by) { const e = editFor(c, o); if (!e) continue; if (!reach(c, inn)) { noteStuck('in'); break; } o.by = c; o.edit = e; e.orders.push(o); return { kind: 'disp', o, acts: [{ to: () => inn, act: 'take' }, { to: () => o.edit, act: 'drop' }] }; }
  return null;
}
function noteStuck(kind) { D.stuck[kind] = (D.stuck[kind] || 0) + 0.02; }

// ═════════ 꼬물이 한 걸음 ═════════
function startAct(c) {
  const a = c.acts[0]; if (!a) { endJob(c); return; }
  const s = a.to();
  if (!s || s.held) { c.st = 'stuck'; c.why = '갈 방 없음'; c.retry = 0.5; return; }
  const p = reach(c, s); if (!p) { c.st = 'stuck'; c.why = `${KINDS[s.kind].n} 가는 길 없음`; c.retry = 0.5; D.stuck[s.kind] = (D.stuck[s.kind] || 0) + 1; return; }
  c.s = s; c.fin = p.pop() || [s.x, s.y]; c.path = p; c.st = 'walk'; c.why = '';
}
function atDoor(c) {
  const a = c.acts[0], s = c.s;
  if (!s || s.held) { startAct(c); return; }
  if (a.act === 'work' || a.act === 'qa') { if (!s.busy) { s.busy = c; c.path = [c.fin]; c.st = 'enter'; } else { if (!s.queue.includes(c)) s.queue.push(c); c.st = 'queue'; } return; }
  doInstant(c, a);
}
function doInstant(c, a) {
  const j = c.job, o = j.o;
  if (a.act === 'take') { inbox.splice(inbox.indexOf(o), 1); c.carry = { slip: o }; }
  else if (a.act === 'drop' && j.kind === 'disp') { o.state = 'placed'; c.carry = null; fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .5, col: '#e9e2cc' }); }
  else if (a.act === 'drop' && j.kind === 'part') { o.making[j.p]--; o.have[j.p] = (o.have[j.p] || 0) + 1; c.carry = null; fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .5, col: PARTS[j.p].col }); }
  else if (a.act === 'deliver') { deliver(c, o); }
  c.acts.shift(); startAct(c);
}
function workTime(c, s) { const base = s.kind === 'edit' ? KINDS.edit.work + 0.4 * Object.values(c.job.o.need).reduce((a, b) => a + b, 0) : KINDS[s.kind].work; return base * (1 - 0.12 * lvl(c, s.kind)); }
function finishWork(c) {
  const s = c.s, a = c.acts[0], j = c.job; s.busy = null;
  c.skill[s.kind] = (c.skill[s.kind] || 0) + 1;
  if (s.queue.length) { const n = s.queue.shift(); s.busy = n; n.path = [n.fin]; n.st = 'enter'; }
  if (j.kind === 'part') c.carry = { part: j.p };
  if (j.kind === 'asm' && s.kind === 'edit') { c.carry = { result: j.o }; j.o.edit.orders = j.o.edit.orders.filter(x => x !== j.o); j.o.state = 'carry'; }
  if (a.act === 'qa') {
    if (Math.random() < S.qaFail) { D.qaFail++; fx.push({ k: 'x', x: c.x, y: c.y - 20, t: 0, life: 1 }); c.acts.shift(); c.acts.unshift({ to: () => bestRoom(c, 'edit'), act: 'rework' }, { to: () => bestRoom(c, 'qa'), act: 'qa' }); startAct(c); return; }
    D.qaPass++;
  }
  c.acts.shift(); startAct(c);
}
function deliver(c, o) {
  const wait = S.t - o.t0; D.done++; D.wait += wait; o.state = 'done';
  S.delivered[o.r] = (S.delivered[o.r] || 0) + 1; orders.splice(orders.indexOf(o), 1);
  fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .8, col: '#ffe27a' }); c.carry = null; checkGoal();
}
function endJob(c) { c.job = null; c.acts = []; c.s = null; c.st = 'idle'; c.look = 0; }
function stepCrew(c, dt) {
  c.ph += dt;
  if (c.st === 'queue') { D.qwait[c.s.kind] = (D.qwait[c.s.kind] || 0) + dt; return; }
  if (c.path.length) {
    const [tx, ty] = c.path[0], [px, py] = center(tx, ty), dx = px - c.x, dy = py - c.y, d = Math.hypot(dx, dy), v = 62 * S.walk * dt;
    if (Math.abs(dx) > .5) c.face = dx > 0 ? 1 : -1;
    if (d <= v) { c.x = px; c.y = py; c.path.shift(); if (!c.path.length) arrived(c); } else { c.x += dx / d * v; c.y += dy / d * v; }
    return;
  }
  if (c.st === 'walk' || c.st === 'enter') { arrived(c); return; }
  if (c.st === 'work') { c.wt -= dt; if (Math.random() < dt * 4) fx.push({ k: 'spark', x: c.x + (Math.random() - .5) * 12, y: c.y - 16, t: 0, life: .4, col: KINDS[c.s.kind].top }); if (c.wt <= 0) finishWork(c); return; }
  if (c.st === 'stuck') { c.retry -= dt; if (c.retry <= 0) startAct(c); return; }
  if (c.st === 'idle') {
    c.look -= dt; if (c.look > 0) return; c.look = 0.3;
    const j = findJob(c); if (j) { c.job = j; c.acts = j.acts; c.why = ''; startAct(c); return; }
    c.why = '일 없음';
    if (Math.random() < 0.25) { const [sx, sy] = tileOf(c), opts = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -2; dx <= 2; dx++) if (inb(sx + dx, sy + dy) && road[(sy + dy) * GW + sx + dx]) opts.push([sx + dx, sy + dy]); if (opts.length) { const o = opts[Math.floor(Math.random() * opts.length)]; c.path = bfs(sx, sy, o[0], o[1]) || []; } }
  }
}
function arrived(c) { if (c.st === 'walk') atDoor(c); else if (c.st === 'enter') { c.st = 'work'; c.wt = workTime(c, c.s); } }

// 판이 바뀌면 길을 다시 찾는다. 방을 들면 그 방에 걸린 일은 되돌린다(교착 방지)
function nearestRoad(x, y) { for (let r = 1; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (inb(x + dx, y + dy) && road[(y + dy) * GW + x + dx]) return [x + dx, y + dy]; return null; }
function replan() {
  for (const c of crew) {
    const [sx, sy] = tileOf(c);
    if (!road[sy * GW + sx] && !at(sx, sy)) { const f = nearestRoad(sx, sy); if (f) [c.x, c.y] = center(f[0], f[1]); }
    if (c.st === 'walk') startAct(c); else if (c.st === 'idle') c.path = [];
  }
}
function release(s) {
  for (const c of crew) if (c.s === s && ['work', 'queue', 'enter', 'walk'].includes(c.st)) { const [sx, sy] = tileOf(c); const f = nearestRoad(sx, sy); if (f && !road[sy * GW + sx]) [c.x, c.y] = center(f[0], f[1]); c.path = []; c.st = 'stuck'; c.retry = 0.3; }
  s.busy = null; s.queue = [];
}

// ═════════ 주문 도착과 넘침 경고 ═════════
let arrAcc = 0;
function rate() { const ph = (S.t % DAY) / DAY; return (0.13 + 0.025 * (S.day - 1) + 0.02 * S.goal) * (0.85 + 0.3 * Math.sin(ph * Math.PI * 2 - 1)); }
function spawn() {
  const r = S.recipes[Math.floor(Math.random() * S.recipes.length)];
  if (inbox.length >= S.inboxCap) { D.lost++; ticker('<b>인간</b> 대답이 없자 다른 AI를 열었다.'); return; }
  const o = { id: uid++, r, need: RECIPES[r].parts, have: {}, making: {}, t0: S.t, state: 'inbox', edit: null, by: null, asm: null };
  inbox.push(o); orders.push(o);
  if (Math.random() < 0.45) { const s = RECIPES[r].say; ticker(`<b>인간</b> ${s[Math.floor(Math.random() * s.length)]}`); }
}

// ═════════ 목표 = 해금 ═════════
let toPlace = [];
function checkGoal() {
  const g = GOALS[S.goal]; if (!g) return;
  if (!Object.entries(g.need).every(([r, n]) => (S.delivered[r] || 0) >= n)) return;
  S.goal++; S.delivered = {};
  if (g.gives.recipe && !S.recipes.includes(g.gives.recipe)) S.recipes.push(g.gives.recipe);
  if (g.gives.room) toPlace.push(g.gives.room);
  ticker(`<b>목표 달성!</b> ${g.n}.`); nextPlace(); buildLegend();
}

// ═════════ 하루 끝: 다중 지표 + 대가 있는 카드 두 장 ═════════
const roadsUsed = () => road.reduce((a, b) => a + b, 0);
function metrics() { return { done: D.done, avg: D.done ? D.wait / D.done : null, qual: D.qaPass + D.qaFail ? D.qaPass / (D.qaPass + D.qaFail) : null, cost: roadsUsed() + ROOM_UPKEEP * sts.filter(s => !s.fixed).length, lost: D.lost }; }
const SPECIAL = [
  { n: '검색실', st: 'search' }, { n: '작성실', st: 'write' }, { n: '편집실', st: 'edit' }, { n: '검수대', st: 'qa' },
  { n: '그림실', st: 'draw', need: 'draw' }, { n: '계산실', st: 'calc', need: 'calc' },

function renderHud() {
  const m = metrics();
  $('day').textContent = `${S.day}일째`; $('done').textContent = m.done; $('avg').textContent = `평균 ${m.avg == null ? '-' : m.avg.toFixed(1) + '초'}`; $('qual').textContent = `검수 통과 ${m.qual == null ? '-' : Math.round(m.qual * 100) + '%'}`; $('cost').textContent = `유지비 ${m.cost}`;
  $('dayFill').style.width = Math.min(100, (S.t - (S.day - 1) * DAY) / DAY * 100) + '%';
  const idle = crew.filter(c => c.st === 'idle' && c.why === '일 없음').length;
  $('inv').innerHTML = `남은 길 <b>${S.roads}</b>칸 · 꼬물이 <b>${crew.length}</b>${idle ? ` (놀음 ${idle})` : ''} · 접수함 <b>${inbox.length}/${S.inboxCap}</b>${toPlace.length ? ` · 놓을 방 <b>${toPlace.length}</b>` : ''}`;
  const md = $('mode'); md.hidden = !held && !S.paused && tool === 'sel'; md.textContent = held ? `${KINDS[held.kind].n} 놓을 칸을 누르세요${held.from ? ' (Esc 취소)' : ''}` : S.paused ? '멈춤' : tool === 'road' ? '길 깔기: 누르거나 끌기' : '길 지우기: 누르거나 끌기';
  $('tPause').innerHTML = `<kbd>Space</kbd>${S.paused ? '계속' : '멈춤'}`;
}

// ═════════ 입력 ═════════
function toTile(e) { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * GW), Math.floor((e.clientY - r.top) / r.height * GH)]; }
cv.addEventListener('pointermove', e => { hover = toTile(e); if (dragging) paint(...hover); });
cv.addEventListener('pointerdown', e => {
  if (e.button === 2) return; const [x, y] = hover = toTile(e);
  if (held) { drop(x, y); return; }
  if (tool !== 'sel') { dragging = true; cv.setPointerCapture(e.pointerId); paint(x, y); return; }
  const s = at(x, y); if (s) openPop(s); else closePop();
});
addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelHold(); closePop(); });
addEventListener('keydown', e => {
  if (!$('repOv').hidden) { if (e.key === '1' || e.key === '2') { const c = pick[+e.key - 1]; if (c) choose(c); } return; }
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; }
  else if (k === 'r' || k === 'ㄱ') setTool(tool === 'road' ? 'sel' : 'road');
  else if (k === 'e' || k === 'ㄷ') setTool(tool === 'erase' ? 'sel' : 'erase');
  else if (k === 's' || k === 'ㄴ') setTool('sel');
  else if (e.key === 'Escape') { cancelHold(); closePop(); setTool('sel'); }
});
$('tSel').onclick = () => setTool('sel'); $('tRoad').onclick = () => setTool('road'); $('tErase').onclick = () => setTool('erase'); $('tPause').onclick = () => { S.paused = !S.paused; };

// ═════════ 확인용 봇 ═════════
// 카드는 늘 1번, 새 방은 가운데 길 바로 위·아래 빈 칸에. 길·규칙은 안 고침. 교착이 있으면 stuckAll로 드러난다.
window.__sim = sec => { const dt = 0.1, out = []; let stuckMax = 0; for (let k = 0; k < sec / dt; k++) { step(dt); stuckMax = Math.max(stuckMax, crew.filter(c => c.st === 'stuck').length); if (!$('repOv').hidden) { const m = S.yday; out.push(`day${S.day} done${m.done} avg${m.avg == null ? '-' : m.avg.toFixed(1)} qual${m.qual == null ? '-' : Math.round(m.qual * 100)} cost${m.cost} lost${m.lost} goal${S.goal} crew${crew.length} stuckMax${stuckMax} orders${orders.length}`); stuckMax = 0; choose(pick[0]); } while (held) { let ok = false; for (let d = 0; d < GW && !ok; d++) for (const x of [7 + d, 7 - d]) for (const y of [3, 5]) if (!ok && x > 0 && x < GW - 1 && canPlace(x, y)) ok = drop(x, y); if (!ok) break; } } return out.join('\n'); };

buildLegend();
let last = performance.now(), uiT = 0;
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; step(dt); draw(now / 1000); uiT -= dt; if (uiT <= 0) { uiT = 0.15; renderLabels(); renderCrew(); renderGoal(); } renderHud(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
