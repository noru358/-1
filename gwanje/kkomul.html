/* 컴퓨터 본체 단면 한 화면 + 아래 띠(방송), 버튼, 전표. 어두운 기판 위에 켜진 것만 밝게. */
:root {
  --bg: #12101a; --panel: #1c1928; --line: #363049; --fg: #ece6f5; --dim: #9a93ad;
  --bit: #7fe0d0; --warm: #f2b46d; --hot: #ff6a5a; --paper: #e9e2cc; --ink: #2a2338; --inkdim: #6b6258;
  --f: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--f); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--bit); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 10px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 400; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; align-items: baseline; }
.stats b { font-weight: 400; color: var(--bit); font-size: 20px; }
.stats span { color: var(--dim); }
.stats .mood { color: var(--warm); }
.screen { position: relative; border: 2px solid var(--line); background: #000; aspect-ratio: 16 / 9; max-width: 100%; }
.screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: pointer; }
.osd { position: absolute; left: 8px; top: 6px; font-size: 12px; text-shadow: 1px 1px 0 #000; pointer-events: none; }
.osd2 { position: absolute; right: 8px; top: 6px; font-size: 12px; text-shadow: 1px 1px 0 #000; pointer-events: none; text-align: right; }
.ticker { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; white-space: nowrap; overflow: hidden; color: var(--dim); }
.ticker b { color: var(--fg); font-weight: 400; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; }
.acts button { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; cursor: pointer; color: var(--dim); }
.acts button:hover { color: var(--fg); }
.acts button.ready { border-color: var(--bit); color: var(--fg); }
.acts button.on { border-color: var(--warm); color: var(--warm); }
.acts kbd { font: inherit; color: var(--fg); border: 1px solid var(--line); padding: 0 4px; margin-right: 4px; }
.low { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.slip { background: var(--paper); color: var(--ink); padding: 8px 10px; display: grid; gap: 5px; align-content: start; }
.slip h2 { margin: 0; font-size: 13px; font-weight: 400; display: flex; justify-content: space-between; border-bottom: 1px dashed var(--inkdim); padding-bottom: 3px; }
.slip h2 button { background: none; border: 0; padding: 0; color: var(--ink); text-decoration: underline; cursor: pointer; font-size: 12px; }
.qb { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; text-align: left; background: #d9d0b4; border: 1px solid var(--inkdim); padding: 4px 8px; cursor: pointer; color: var(--ink); }
.qb:hover { background: #fff6dc; }
.qb.first { border: 2px solid var(--ink); }
.qb b { font-weight: 400; }
.qb em { font-style: normal; font-variant-numeric: tabular-nums; }
.qb i { grid-column: 1 / -1; font-style: normal; font-size: 11px; color: var(--inkdim); }
.qempty { font-size: 12px; color: var(--inkdim); }

<script>
'use strict';
// ───────── 표 ─────────
const W = 384, H = 216, FH = 52, TOP = 6, SHAFT = [8, 376];
const floorY = f => TOP + (f + 1) * FH - 3;            // 그 층 바닥(발 높이)
// 방: 위에서부터 0층. 데이터는 아래(3층)에서 들어와 위(0층)로 나간다.
const ROOMS = {

  cpu: { n: 'CPU 주방',   f: 1, x0: 16,  x1: 236, col: '#3e3024', lit: '#ffb36a' },
  rest:{ n: '휴게실',     f: 1, x0: 236, x1: 368, col: '#2c2a40', lit: '#c8b8ff' },
  sto: { n: '저장 창고',  f: 2, x0: 16,  x1: 204, col: '#26382c', lit: '#8fe0a0' },
  pwr: { n: '전원부',     f: 2, x0: 204, x1: 368, col: '#2e2a22', lit: '#ffe27a' },

  inp: { n: '입구 포트',  f: 3, x0: 280, x1: 368, col: '#22303a', lit: '#7fe0d0' },
};
const TYPES = {
  text:  { n: '글',   route: ['cpu', 'out'],               bits: 5,  col: '#f4f1ff', work: { cpu: 3 } },
  photo: { n: '사진', route: ['sto', 'gpu', 'out'],        bits: 14, col: '#8ac8ff', work: { sto: 2.5, gpu: 4 } },
  video: { n: '영상', route: ['sto', 'cpu', 'gpu', 'out'], bits: 36, col: '#ff6a7a', work: { sto: 3, cpu: 3.5, gpu: 5 } },
};
const TOPICS = {
  text: ['"라면 맛있게 끓이는 법" 검색', '메일 답장 쓰는 중', '"월요병 극복" 검색', '회의록 정리', '"고양이 왜 박스 좋아함" 검색', '새벽 감성 일기 작성', '"탕수육 부먹 찍먹" 검색'],
  photo: ['고양이 사진 넘기는 중', '점심 메뉴 사진 찾는 중', '여행 사진 보는 중', '밈 이미지 저장', '옛날 사진 정리'],
  video: ['고양이 영상 몰아 보는 중', '요리 영상 틀어 둠', '드라마 정주행', '음악 영상 반복 재생', '먹방 보면서 밥 먹는 중'],
};
const NAMES = ['꼬미', '물이', '삑이', '도리', '콩이', '비트', '바이', '클로', '모리', '찌리'];
const TINTS = ['#f2b46d', '#9fd88a', '#8ac8ff', '#f2a0c8', '#e8d870', '#c8a8ff', '#ff9a6a', '#7fe0d0', '#f4f1ff', '#d8b890'];
const COLS = ['부품', '꼬물이', '요청'];
const NODES = [
  // id, col, 이름, 설명, 값, 효과, 앞 노드
  ['mem1', 0, '메모리 선반 +4', '꾸러미를 더 많이 쌓아 둘 수 있다. 인간이 새로고침을 덜 누른다.', 30, { mem: 4 }],
  ['cpu2', 0, 'CPU 책상 +1', 'CPU 주방에 화구가 하나 더 생긴다. 줄이 짧아진다.', 45, { desk: 'cpu' }, 'mem1'],
  ['fan1', 0, '팬 강화', '팬이 더 세게 돈다. 꼬물이와 방이 빨리 식는다.', 70, { cool: 1.6 }, 'cpu2'],
  ['sto2', 0, '저장 책상 +1', '창고 서랍이 하나 더 열린다.', 140, { desk: 'sto' }, 'fan1'],
  ['gpu2', 0, 'GPU 책상 +1', '화실에 이젤이 하나 더 선다.', 260, { desk: 'gpu' }, 'sto2'],
  ['sink', 0, '방열판', '방이 덜 뜨거워진다.', 480, { sink: 0.65 }, 'gpu2'],
  ['cpu3', 0, 'CPU 책상 +1', '화구 세 개. 주방이 북적인다.', 900, { desk: 'cpu' }, 'sink'],
  ['mem2', 0, '메모리 선반 +6', '선반을 한 칸 더 올렸다.', 1500, { mem: 6 }, 'cpu3'],
  ['gpu3', 0, 'GPU 책상 +1', '이젤 세 개. 영상도 거뜬하다.', 2600, { desk: 'gpu' }, 'mem2'],
  ['hire2', 1, '꼬물이 +1', '전원부 틈에서 한 마리 더 기어 나왔다.', 20, { hire: 1 }],
  ['shoe', 1, '작은 운동화', '모두 더 빨리 걷고 사다리를 오른다.', 90, { walk: 1.3 }, 'hire2'],
  ['hire3', 1, '꼬물이 +1', '휴게실이 조금 붐빈다.', 160, { hire: 1 }, 'shoe'],
  ['cool', 1, '냉각 숨결 (F)', '누르면 모두의 몸과 방이 한 번에 식는다. 60초마다.', 300, { skill: 'cool' }, 'hire3'],
  ['hire4', 1, '꼬물이 +1', '새로 온 애는 아직 길을 헤맨다.', 600, { hire: 1 }, 'cool'],
  ['coffee', 1, '정전기 커피', '모두 일하는 속도 +25%.', 1000, { work: 1.25 }, 'hire4'],
  ['hire5', 1, '꼬물이 +1', '이름은 다들 알아서 지었다.', 1800, { hire: 1 }, 'coffee'],
  ['hire6', 1, '꼬물이 +1', '이제 휴게실 소파가 모자라다.', 3200, { hire: 1 }, 'hire5'],
  ['photo', 2, '사진 열기', '인간이 사진을 보기 시작한다. 저장 창고와 GPU 화실이 일한다.', 35, { type: 'photo' }],
  ['video', 2, '영상 열기', '인간이 영상을 본다. 창고, 주방, 화실을 모두 거치는 큰 일감.', 700, { type: 'video' }, 'photo'],
  ['game', 2, '게임 (다음 컴퓨터에서)', '이 컴퓨터로는 무리다. 다음 시즌에.', 1e12, { none: 1 }, 'video'],
];
const NODE = {}; const NLIST = NODES.map(r => (NODE[r[0]] = { id: r[0], col: r[1], n: r[2], d: r[3], cost: Math.max(10, Math.round(r[4] * 0.6 / 5) * 5), e: r[5], prev: r[6] }));

// ───────── 상태 ─────────
const KEY = 'kkomul.v0';
let S;
function fresh() { return { bits: 0, total: 0, owned: {}, t: 0, day: 1, mood: 70, crew: [0, 1].map(i => ({ i, xp: 0, lvl: 1 })), today: newToday(), boostCd: 0, coolCd: 0 }; }
function newToday() { return { text: 0, photo: 0, video: 0, bits: 0, refresh: 0, topics: [] }; }
function load() { try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s && s.crew) return Object.assign(fresh(), s); } catch (e) {} return fresh(); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
S = load();
let D;
function derive() {
  const d = { mem: 6, desk: { cpu: 1, sto: 1, gpu: 1, out: 2, fan: 3 }, cool: 1, sink: 1, walk: 1, work: 1, skills: { boost: 1 }, types: ['text'] };
  for (const n of NLIST) if (S.owned[n.id]) { const e = n.e; if (e.mem) d.mem += e.mem; if (e.desk) d.desk[e.desk]++; if (e.cool) d.cool *= e.cool; if (e.sink) d.sink *= e.sink; if (e.walk) d.walk *= e.walk; if (e.work) d.work *= e.work; if (e.skill) d.skills[e.skill] = 1; if (e.type) d.types.push(e.type); }
  return d;
}
D = derive();

// ───────── 런타임 ─────────
const DAY = 600;                       // 하루 = 10분(시제품)
const hourOf = t => (7 + (t % DAY) / DAY * 24) % 24;
let packets = [], shelf = [], deliveredFx = [], fx = [], heat = { cpu: 0, gpu: 0, sto: 0 }, desks = {}, queues = {};
const crew = [];
function deskXs(room, n) { const r = ROOMS[room], pad = 22, span = r.x1 - r.x0 - pad * 2, out = []; for (let k = 0; k < n; k++) out.push(Math.round(r.x0 + pad + (n === 1 ? span / 2 : span * k / (n - 1)))); return out; }
// 책상 객체는 그대로 두고 자리만 옮긴다(앉아 있는 꼬물이가 같은 책상을 계속 가리키도록)
function rebuildDesks() { for (const k of ['cpu', 'sto', 'gpu', 'out', 'fan']) { const xs = deskXs(k, D.desk[k]), arr = desks[k] || (desks[k] = []); xs.forEach((x, i) => { if (arr[i]) arr[i].x = x; else arr.push({ x, by: null }); }); queues[k] = queues[k] || []; } }
function addCrew(c) { const r = ROOMS.rest; crew.push({ ...c, name: NAMES[c.i % NAMES.length], tint: TINTS[c.i % TINTS.length], f: r.f, x: r.x0 + 20 + Math.random() * 80, y: floorY(r.f), wps: [], st: 'idle', pk: null, heat: 0, face: 1, ph: Math.random() * 6, wt: 0, wx: r.x0 + 30, desk: null, room: null, say: '', sayT: 0 }); }
S.crew.forEach(addCrew); rebuildDesks();

// 길: 같은 층이면 걷고, 아니면 가까운 사다리로 가서 오르내린다
function moveTo(c, f, x) {
  c.wps = [];
  if (c.f !== f) { const sx = SHAFT.reduce((a, b) => Math.abs(c.x - b) + Math.abs(x - b) < Math.abs(c.x - a) + Math.abs(x - a) ? b : a); c.wps.push({ f: c.f, x: sx }, { f, x: sx }); }
  c.wps.push({ f, x });
}
const speedOf = c => (1 + (c.lvl - 1) * 0.08) * (boostT > 0 ? 2 : 1);
let boostT = 0;
function stepCrew(c, dt) {
  c.ph += dt; c.sayT = Math.max(0, c.sayT - dt);
  if (c.wps.length) {
    const w = c.wps[0];
    if (w.f !== c.f) { const ty = floorY(w.f), dy = ty - c.y, v = 34 * D.walk * speedOf(c) * dt; if (Math.abs(dy) <= v) { c.y = ty; c.f = w.f; c.wps.shift(); } else c.y += Math.sign(dy) * v; c.climb = true; return; }
    c.climb = false; c.y = floorY(c.f);
    const dx = w.x - c.x, v = 30 * D.walk * speedOf(c) * dt; c.face = dx >= 0 ? 1 : -1;
    if (Math.abs(dx) <= v) { c.x = w.x; c.wps.shift(); } else c.x += Math.sign(dx) * v;
    return;
  }
  c.climb = false;
  switch (c.st) {
    case 'idle': {
      if (c.heat > 40) { goCool(c); break; }
      const p = shelf.find(p => !p.by); if (p) { p.by = c; c.pk = p; c.st = 'fetch'; moveTo(c, ROOMS.mem.f, p.sx); break; }
      c.wt -= dt; if (c.wt <= 0) { c.wt = 2 + Math.random() * 4; const r = ROOMS.rest; if (c.f === r.f && c.x >= r.x0 && c.x <= r.x1) { c.wx = r.x0 + 14 + Math.random() * (r.x1 - r.x0 - 28); moveTo(c, r.f, c.wx); } else moveTo(c, r.f, r.x0 + 20 + Math.random() * 80); }
      break;
    }
    case 'fetch': { const p = c.pk; shelf.splice(shelf.indexOf(p), 1); p.carried = true; c.st = 'go'; nextStation(c); break; }
    case 'go': { // 도착: 책상이 비면 앉고, 아니면 줄
      const room = c.room, d = desks[room].find(d => !d.by);
      if (d && (queues[room][0] === c || !queues[room].length)) { if (queues[room][0] === c) queues[room].shift(); d.by = c; c.desk = d; c.st = 'walkDesk'; moveTo(c, ROOMS[room].f, d.x); }
      else { if (!queues[room].includes(c)) queues[room].push(c); const qi = queues[room].indexOf(c), r = ROOMS[room]; const qx = r.x0 + 8 + qi * 9; if (Math.abs(c.x - qx) > 1) moveTo(c, r.f, qx); c.st = 'go'; c.face = 1; }
      break;
    }
    case 'walkDesk': c.st = 'work'; c.wt = (TYPES[c.pk.type].work[c.room] || 1); break;
    case 'work': {
      const hot = c.room === 'out' ? 1 : 1 / (1 + Math.max(0, heat[c.room] - 55) / 45);
      const tired = c.heat > 85 ? 0.7 : 1;
      c.wt -= dt * D.work * speedOf(c) * hot * tired;
      const hk = c.room === 'out' ? 0 : c.room === 'sto' ? 2.5 : 6;
      c.heat = Math.min(100, c.heat + hk * dt * (boostT > 0 ? 1.6 : 1));
      if (heat[c.room] !== undefined) heat[c.room] = Math.min(100, heat[c.room] + (c.room === 'sto' ? 1.2 : 3.2) * dt * D.sink * (boostT > 0 ? 1.4 : 1));
      if (Math.random() < dt * 3) fx.push({ k: 'spark', x: c.x + c.face * 6, y: c.y - 10, t: 0, life: .35, col: ROOMS[c.room].lit });
      if (c.wt <= 0) { c.desk.by = null; c.desk = null; if (c.room === 'out') deliver(c); else { c.pk.step++; c.st = 'go'; nextStation(c); } }
      break;
    }
    case 'cool': { c.heat = Math.max(0, c.heat - 22 * D.cool * dt); if (c.heat <= 5) { c.desk.by = null; c.desk = null; c.st = 'idle'; c.wt = 0; } break; }
    case 'goCool': c.st = 'cool'; break;
    case 'waitCool': { const d = desks.fan.find(d => !d.by); if (d) { d.by = c; c.desk = d; c.st = 'goCool'; moveTo(c, ROOMS.fan.f, d.x); } break; }
  }
}
function nextStation(c) { const room = TYPES[c.pk.type].route[c.pk.step]; c.room = room; const r = ROOMS[room]; moveTo(c, r.f, r.x0 + 10); }
function goCool(c) { c.st = 'waitCool'; c.room = 'fan'; moveTo(c, ROOMS.fan.f, ROOMS.fan.x1 - 10); say(c, '더워...'); }
function say(c, s) { c.say = s; c.sayT = 2.2; }
function deliver(c) {
  const p = c.pk, ty = TYPES[p.type], wait = S.t - p.t0;
  S.mood = Math.max(0, Math.min(100, S.mood + (wait < 30 ? 1.5 : wait < 60 ? 0.3 : -1)));
  const amt = ty.bits * (0.5 + S.mood / 100);
  S.bits += amt; S.total += amt; S.today.bits += amt; S.today[p.type]++;
  const sc = S.crew[c.i]; sc.xp++; c.xp = sc.xp;
  if (sc.xp >= sc.lvl * 6) { sc.xp = 0; sc.lvl++; c.lvl = sc.lvl; say(c, `레벨 ${sc.lvl}!`); fx.push({ k: 'lvl', x: c.x, y: c.y - 18, t: 0, life: 1.2 }); log(`<b>${c.name}</b> 레벨 ${sc.lvl}. 조금 더 빨라졌다.`); }
  deliveredFx.push({ col: ty.col, t: 0 }); if (deliveredFx.length > 12) deliveredFx.shift();
  fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .9, s: '+' + Math.round(amt) });
  c.pk = null; c.room = null; c.st = 'idle'; c.wt = 0;
  if (c.heat > 70) goCool(c);
}

  list.forEach((n, k) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'qb' + (k ? '' : ' first'); b.innerHTML = `<b></b><em>${fmt(n.cost)} 비트</em><i></i>`; b.querySelector('b').textContent = (k ? '' : 'Q · ') + n.n; b.querySelector('i').textContent = n.d; b.onclick = () => buy(n); box.append(b); });
  if (next && next.cost < 1e11) { const p = document.createElement('div'); p.className = 'qempty'; p.textContent = `${list.length ? '그다음' : '다음'}: ${next.n} · ${fmt(next.cost)} 비트`; box.append(p); }
}
function renderTree() {
  const cols = $('cols'); cols.innerHTML = '';
  COLS.forEach((nm, ci) => { const col = document.createElement('div'); col.className = 'col'; col.innerHTML = `<h3>${nm}</h3>`; NLIST.filter(n => n.col === ci).forEach(n => { const b = document.createElement('button'); b.type = 'button'; const own = S.owned[n.id]; b.className = 'node ' + (own ? 'own' : ready(n) ? 'can' : 'lock'); b.innerHTML = '<b></b><i></i><em></em>'; b.querySelector('b').textContent = n.n; b.querySelector('i').textContent = n.d; b.querySelector('em').textContent = own ? '갖춤' : n.cost >= 1e11 ? '다음 시즌' : fmt(n.cost) + ' 비트' + (avail(n) ? '' : ' · 위 먼저'); b.onclick = () => { if (buy(n)) renderTree(); }; col.append(b); }); cols.append(col); });
  $('treeInfo').textContent = `지금 ${fmt(S.bits)} 비트 · T/Esc 닫기`;
}
function buy(n) {
  if (!ready(n) || n.cost >= 1e11) return false;
  S.bits -= n.cost; S.owned[n.id] = 1; D = derive(); rebuildDesks();
  if (n.e.hire) { const c = { i: S.crew.length, xp: 0, lvl: 1 }; S.crew.push(c); addCrew(c); renderCrew(); ticker(`새 꼬물이 <b>${crew[crew.length - 1].name}</b>가 전원부 틈에서 기어 나왔다.`); }
  else if (n.e.type) ticker(`인간이 ${TYPES[n.e.type].n}${n.e.type === 'photo' ? '을' : '을'} 보기 시작했다.`);
  else ticker(`${n.n} 갖춤.`);
  quickKey = ''; renderQuick(); save(); return true;
}
function buyBest() { const n = NLIST.filter(ready).sort((a, b) => a.cost - b.cost)[0]; if (n) buy(n); if (!$('treeOv').hidden) renderTree(); }
function boost() { if (S.boostCd > 0) return; boostT = 15; S.boostCd = 45; ticker('클럭 부스트! 다들 두 배로 빨라진다. 대신 더 뜨거워진다.'); }
function coolAll() { if (!D.skills.cool || S.coolCd > 0) return; S.coolCd = 60; for (const k in heat) heat[k] = 0; for (const c of crew) c.heat = Math.min(c.heat, 10); ticker('냉각 숨결. 컴퓨터 안에 시원한 바람이 분다.'); for (let k = 0; k < 30; k++) fx.push({ k: 'spark', x: Math.random() * W, y: Math.random() * H, t: 0, life: .6, col: '#7fe0d0' }); }
function toggleTree(v) { const o = $('treeOv'); o.hidden = v === undefined ? !o.hidden : !v; if (!o.hidden) renderTree(); }
function nextFollow() { followIdx = (followIdx + 1) % crew.length; zoom = true; }

addEventListener('keydown', e => {
  if (!$('repOv').hidden) { if (['Enter', ' ', 'Escape'].includes(e.key)) { e.preventDefault(); closeRep(); } return; }
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); boost(); }
  else if (k === 'f' || k === 'ㄹ') coolAll();
  else if (k === 'q' || k === 'ㅂ') buyBest();
  else if (k === 'z' || k === 'ㅋ') { zoom = !zoom; if (zoom && followIdx < 0) followIdx = 0; }
  else if (k === 'c' || k === 'ㅊ') nextFollow();
  else if (k === 't' || k === 'ㅅ' || e.key === 'Tab') { e.preventDefault(); toggleTree(); }
  else if (e.key === 'Escape') { if (!$('treeOv').hidden) toggleTree(false); else zoom = false; }
});
$('aBoost').onclick = boost; $('aCool').onclick = coolAll; $('aZoom').onclick = () => { zoom = !zoom; if (zoom && followIdx < 0) followIdx = 0; }; $('aNext').onclick = nextFollow; $('aBuy').onclick = buyBest; $('aTree').onclick = () => toggleTree(true); $('openTree').onclick = () => toggleTree(true);
$('treeOv').onclick = e => { if (e.target === $('treeOv')) toggleTree(false); };
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect(); let x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
  if (zoom) { zoom = false; return; }
  let best = -1, bd = 400; crew.forEach((c, i) => { const d = (c.x - x) ** 2 + (c.y - 8 - y) ** 2; if (d < bd) { bd = d; best = i; } });
  if (best >= 0) { followIdx = best; zoom = true; }
});

// 밸런스 확인용: window.__sim(초, 매초 Q)
let SIM = false;
window.__sim = sec => { SIM = true; const dt = 0.1, out = []; for (let k = 0; k < sec / dt; k++) { step(dt); if (k % 10 === 0) { buyBest(); if (S.boostCd <= 0) boost(); coolAll(); } if (k % 600 === 0) out.push(`${Math.round(S.t / 60)}m bits${Math.round(S.bits)} owned${Object.keys(S.owned).length} mood${Math.round(S.mood)} shelf${shelf.length} crew${crew.length}`); } SIM = false; $('repOv').hidden = true; return out.join('\n'); };

buildBg(); renderCrew();
ticker('인간이 컴퓨터를 켰다. 꼬물이들이 기지개를 켠다.');
let last = performance.now(), crewT = 0;
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; if ($('repOv').hidden) step(dt); present(now / 1000); renderHud(); renderQuick(); crewT -= dt; if (crewT <= 0) { crewT = 0.25; tickCrew(); } requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
