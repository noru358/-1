/* 위: 날·지표 / 목표 카드 / 판(16×9) / 도구 / 아래 두 칸: 왼쪽 주문 카드·방송, 오른쪽 분업판·꼬물이 목록 */
:root {
  --bg: #12101a; --panel: #1c1928; --line: #363049; --fg: #ece6f5; --dim: #9a93ad;
  --acc: #7fe0d0; --warm: #f2b46d; --hot: #ff6a5a; --paper: #e9e2cc; --ink: #2a2338; --inkdim: #6b6258;
  --f: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--f); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 8px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 400; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 14px; font-variant-numeric: tabular-nums; color: var(--dim); }
.stats b { color: var(--acc); font-weight: 400; }
.chip { display: inline-grid; place-items: center; width: 14px; height: 14px; font-style: normal; font-size: 9px; line-height: 1; color: #1b1420; background: var(--c); border: 1px solid #1b1420; margin-right: 1px; vertical-align: -2px; }
.chip.empty { background: transparent; color: var(--c); border: 1px dashed var(--c); }
.goal { background: var(--panel); border: 1px solid var(--line); padding: 5px 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.goal .gl { color: var(--dim); }
.goal .gi b { font-weight: 400; margin-right: 4px; }
.goal .cnt { color: var(--warm); margin-left: 4px; font-variant-numeric: tabular-nums; }
.goal .mini { display: inline-block; width: 50px; height: 4px; background: #2a2538; margin-left: 6px; vertical-align: 2px; }
.goal .mini i { display: block; height: 100%; background: var(--warm); }
.goal .gr { margin-left: auto; color: var(--warm); }
.daybar { height: 6px; background: var(--panel); position: relative; }
.daybar i { display: block; height: 100%; background: var(--acc); width: 0; position: relative; z-index: 1; }
.daybar .rushz { position: absolute; left: 66.67%; width: 16.67%; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, #5a2a2a 0 3px, #3a2030 3px 6px); }
.daybar.rush i { background: var(--warm); }
.stats b.gold { color: #ffe27a; } .stats b.bad { color: var(--hot); }
.poke { font-size: 12px; color: var(--dim); }
.poke.ready b { color: #ffb0d8; font-weight: 400; }
.chip.ins { box-shadow: 0 0 0 1px #ffe27a; position: relative; }
.chip.ins::after { content: "★"; position: absolute; right: -5px; top: -7px; font-size: 8px; color: #ffe27a; text-shadow: 1px 1px 0 #000; }
.chip.hal { box-shadow: 0 0 0 1px #ff4d6d; position: relative; }
.chip.hal::after { content: "!"; position: absolute; right: -4px; top: -7px; font-size: 9px; color: #ff4d6d; text-shadow: 1px 1px 0 #000; }
.qt { font-style: normal; color: var(--c); border: 1px solid var(--c); padding: 0 2px; margin-right: 4px; font-size: 10px; }
.en { font-style: normal; color: #d8a070; letter-spacing: -1px; font-size: 10px; }
.lab em { font-style: normal; color: #ffe27a; margin-left: 2px; }
.screen { position: relative; border: 2px solid var(--line); background: #000; aspect-ratio: 16 / 9; max-width: 100%; }
.screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, 0); font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; white-space: nowrap; line-height: 1.1; }
.badge { position: absolute; transform: translate(-50%, -100%); background: var(--warm); color: var(--ink); font-size: 10px; padding: 0 4px; white-space: nowrap; }
.badge.inbox { background: #3e5878; color: #fff; }
.badge.hot { background: var(--hot); color: #fff; animation: blink .6s steps(2) infinite; }
@keyframes blink { 50% { opacity: .45; } }
.board { position: absolute; transform: translate(-50%, -100%); background: rgba(18,16,26,.92); border: 1px solid #a8e0a8; padding: 2px 4px; font-size: 10px; line-height: 1.4; white-space: nowrap; }
.board div { display: flex; align-items: center; gap: 2px; }
.board span { margin-right: 4px; color: var(--fg); }
.board em { font-style: normal; color: var(--dim); margin-left: 4px; }
.board .chip { width: 11px; height: 11px; font-size: 8px; }
.mode { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); background: var(--warm); color: var(--ink); padding: 0 10px; font-size: 12px; pointer-events: none; white-space: nowrap; }
.tip { position: absolute; background: var(--paper); color: var(--ink); padding: 5px 8px; font-size: 11px; max-width: 240px; pointer-events: none; z-index: 4; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
.tip b { font-weight: 400; }
.pop { position: absolute; background: var(--paper); color: var(--ink); padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; z-index: 5; min-width: 180px; max-width: 280px; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.pop b { font-weight: 400; font-size: 13px; }
.pop .row { display: flex; flex-wrap: wrap; gap: 4px; }
.pop button { background: #d9d0b4; border: 1px solid var(--inkdim); padding: 1px 6px; cursor: pointer; color: var(--ink); }
.pop button.on { background: var(--ink); color: var(--paper); }
.pop i { font-style: normal; color: var(--inkdim); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools button { background: var(--panel); border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; color: var(--dim); }
.tools button.on { border-color: var(--acc); color: var(--fg); }
.tools kbd { font: inherit; color: var(--fg); border: 1px solid var(--line); padding: 0 4px; margin-right: 4px; }
.tools .inv { color: var(--dim); font-size: 12px; margin-left: auto; }
.tools .inv b { color: var(--fg); font-weight: 400; }
.low { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 8px; align-items: start; }
.col { display: grid; gap: 8px; min-width: 0; }
.box { background: var(--panel); border: 1px solid var(--line); padding: 6px 10px; min-width: 0; }
.box h2 { margin: 0 0 4px; font-size: 12px; font-weight: 400; color: var(--dim); }
.recipes { display: grid; gap: 3px; font-size: 12px; }
.rc { display: flex; justify-content: space-between; gap: 8px; }
.rc b { font-weight: 400; }
.rc.how { color: var(--dim); font-size: 11px; display: block; border-top: 1px dashed var(--line); padding-top: 4px; margin-top: 2px; }
.ticker { color: var(--fg); min-height: 5.5em; font-size: 12px; display: grid; gap: 1px; }
.ticker b { font-weight: 400; color: var(--acc); }
.ticker i { font-style: normal; color: var(--dim); }
.ticker .old { color: var(--dim); }
.ticker .bad { color: #ff8a9a; }
.modes { display: flex; gap: 4px; flex-wrap: wrap; }
.modes button, .role button { background: #26223a; border: 1px solid var(--line); padding: 1px 8px; cursor: pointer; color: var(--dim); }
.modes button.on { border-color: var(--acc); color: var(--fg); }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 3px 10px; margin-top: 6px; font-size: 12px; }
.role { display: flex; align-items: center; gap: 4px; }
.role span { flex: 1; }

.ov { position: fixed; inset: 0; background: rgba(10,8,18,.8); display: grid; place-items: center; z-index: 20; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }

  names: ['꼬미', '물이', '삑이', '도리', '콩이', '비트', '바이', '클로', '모리', '찌리', '토리', '나노', '포포', '두두', '말랑', '쪼꼬'],
  tints: ['#f2b46d', '#9fd88a', '#8ac8ff', '#f2a0c8', '#e8d870', '#c8a8ff', '#ff9a6a', '#7fe0d0', '#f4f1ff', '#d8b890', '#b0e0ff', '#ffc0a0', '#a0f0c0', '#ffb0d8', '#d0b0ff', '#ffd0a0'],
  text: {
    lost: '<b>인간</b> 대답이 없자 다른 AI를 열었다.',
    noRoad: k => `${k} 가는 길 없음`,
    noAsm: r => `${r}을(를) 받는 조립실 없음`,
    idle: '일 없음', roleIdle: r => `맡은 일(${r}) 없음`,
    asmFull: '조립실 자리 없음',
    noCoffee: '카페인 부족(탕비실 없음)',
    masterLog: s => `★ 명작 ${s} <i>(목표 +2)</i>`,
    oopsLog: s => `! 환각 사고 ${s} <i>(무사고 깨짐)</i>`,
    skipQa: n => `<b>${n}</b> 검수대 줄이 길어서 그냥 보냈다…`,
    knock: n => `<b>${n}</b> 꿀밤! !환각 → ★영감`,
    praise: n => `<b>${n}</b> 칭찬받고 신났다`,
    alchemy: n => `<b>${n}</b> 오류를 잡아 명작으로 뒤집었다`,
    perfect: r => `무사고 보너스: 길 +${r}칸`,
    stack: (k, lv) => `<b>${k}</b> Lv.${lv}로 증축!`,
  },
};

// ═════════ 상태 ═════════
// 저장되는 "사실"만 둔다. 부하·진행 중 개수·방 정원 같은 파생 값은 Derive가 매 틱 다시 계산한다.
const G = DATA.grid, TILE = G.tile, W = G.w * TILE, H = G.h * TILE;
// 시드 난수(본편 합칠 때 규칙). 주소 뒤에 ?seed=숫자 를 붙이면 같은 판이 다시 나온다.
const Rand = (() => {
  let s = (+new URLSearchParams(location.search).get('seed') || (Date.now() % 1e9)) >>> 0;
  const f = () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  f.seed = v => { s = v >>> 0; };
  f.pick = a => a[Math.floor(f() * a.length)];
  return f;
})();
const World = {
  S: { day: 1, t: 0, speed: 1, paused: false, inDay: true, inboxCap: DATA.inbox.cap, roads: 0, goal: 0, recipes: ['answer'], delivered: {}, yday: null, best: null,
       // 카드로 바뀌는 세계 배율
       walk: 1, pace: 1, halluAdd: 0, halluMul: 1, skillMul: 1, chatInspire: 0, pokeCd: 0 },
  road: new Uint8Array(G.w * G.h),
  rooms: [], crew: [], orders: [], fx: [], toPlace: [], log: [], uid: 0,
  day: null,
};
const newDayStats = () => ({ done: 0, master: 0, oops: 0, wait: 0, lost: 0, made: { normal: 0, inspired: 0, hallucinated: 0 }, madeBy: {}, qa: { pass: 0, fix: 0, alchemy: 0, skip: 0, miss: 0 }, halBy: {}, knock: 0, praise: 0, coffee: 0, chats: 0, qwait: {}, stuck: {} });
World.day = newDayStats();

const Make = {
  room(kind, x, y) { const r = { id: World.uid++, kind, x, y, lv: 1, workers: [], queue: [], reject: new Set(), prio: 'fifo', held: false }; World.rooms.push(r); return r; },
  crew(quirk) {
    const i = World.crew.length, q = quirk || Rand.pick(Object.keys(DATA.quirks));
    const c = { i, name: DATA.names[i % DATA.names.length], tint: DATA.tints[i % DATA.tints.length], quirk: q, x: (2 + i % 10) * TILE + 12, y: 4 * TILE + 18,
      path: [], fin: null, job: null, st: 'idle', room: null, wt: 0, carry: null, face: 1, ph: Rand() * 6, look: 0, retry: 0, why: '', skill: {}, role: null, pinned: false,
      energy: DATA.energy.max, buff: {}, chatCd: 0 };   // buff = {이름: 남은 초}
    World.crew.push(c); return c;
  },
  // 주문 상태: inbox → toAsm(배부 중) → placed(조립실에 있음) → asm(조립 중) → carry(검수·발송 중) → done
  // got = 도착한 부품마다 상태(tag). tag = 조립된 상자의 상태
  order(recipe) {
    const R = DATA.recipes[recipe];
    const o = { id: World.uid++, r: recipe, need: R.parts, have: {}, got: {}, making: {}, t0: World.S.t, state: 'inbox', asmRoom: null, client: Rand.pick(R.clients), tag: null };
    World.orders.push(o); return o;
  },
};

function setupWorld() {
  const st = DATA.start;
  for (const [k, x, y] of st.rooms) Make.room(k, x, y);
  for (const [x0, x1, y] of st.roadRows) for (let x = x0; x <= x1; x++) World.road[y * G.w + x] = 1;
  World.S.roads = st.roadBudget - World.road.reduce((a, b) => a + b, 0);
  for (const q of st.crewQuirks) Make.crew(q);
}
const roomDef = r => DATA.rooms[r.kind];

// ═════════ 판과 길 ═════════
// 꼬물이는 길 칸으로만 걷고, 목적지 방 칸에만 들어간다(4방향 BFS).
const Path = {
  inb: (x, y) => x >= 0 && y >= 0 && x < G.w && y < G.h,
  isRoad: (x, y) => Path.inb(x, y) && World.road[y * G.w + x] === 1,
  roomAt: (x, y) => World.rooms.find(r => !r.held && r.x === x && r.y === y),
  tileOf: c => [Math.max(0, Math.min(G.w - 1, Math.floor(c.x / TILE))), Math.max(0, Math.min(G.h - 1, Math.floor((c.y - 6) / TILE)))],
  center: (x, y) => [x * TILE + 12, y * TILE + 18],
  bfs(sx, sy, tx, ty) {
    if (sx === tx && sy === ty) return [];
    const w = G.w, prev = new Int16Array(w * G.h).fill(-1), s0 = sy * w + sx, goal = ty * w + tx, q = [s0]; prev[s0] = s0;
    for (let h = 0; h < q.length; h++) {
      const c = q[h], cx = c % w, cy = (c / w) | 0;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = cx + dx, ny = cy + dy; if (!Path.inb(nx, ny)) continue; const n = ny * w + nx;
        if (prev[n] >= 0 || (n !== goal && !World.road[n])) continue; prev[n] = c;
        if (n === goal) { const out = []; let k = n; while (k !== s0) { out.push([k % w, (k / w) | 0]); k = prev[k]; } return out.reverse(); }
        q.push(n);
      }
    }
    return null;
  },
  to(c, room) { const [x, y] = Path.tileOf(c); return Path.bfs(x, y, room.x, room.y); },
  nearestRoad(x, y) { for (let r = 1; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (Path.isRoad(x + dx, y + dy)) return [x + dx, y + dy]; return null; },
  roadNext: r => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => Path.isRoad(r.x + dx, r.y + dy)),
};

// ═════════ 파생 값 ═════════
// 매 틱 꼬물이들이 쥔 일감에서 다시 계산한다. 저장해 두지 않으므로 숫자가 새거나 어긋날 수 없다(교착 방지).
const Derive = {
  refresh() {
    const { rooms, orders, crew } = World;
    for (const r of rooms) { r.incoming = 0; r.slots = []; }
    for (const o of orders) { o.making = {}; o.claimed = null; }
    for (const c of crew) {
      const j = c.job; if (!j || !j.o) continue;
      if (j.type !== 'part') j.o.claimed = c;
      if (j.type === 'part' && !j.delivered) j.o.making[j.part] = (j.o.making[j.part] || 0) + 1;
    }
    for (const c of crew) if (c.room && c.st === 'walk' && c.act && c.act.act === 'work') c.room.incoming++;
    for (const o of orders) {
      // 일감을 쥔 꼬물이가 없는데 진행 중 상태면 되돌린다(자가 치유)
      if (o.state === 'toAsm' && !crew.some(c => c.job && c.job.type === 'dispatch' && c.job.o === o)) { o.state = 'inbox'; o.asmRoom = null; }
      if ((o.state === 'asm' || o.state === 'carry') && !crew.some(c => c.job && c.job.type === 'asm' && c.job.o === o)) { o.state = 'placed'; o.tag = null; }
      if (o.asmRoom && ['toAsm', 'placed', 'asm'].includes(o.state)) o.asmRoom.slots.push(o);
    }
  },
  cap: r => r.lv || 1,                                   // 동시에 일하는 수 = 층
  slotsOf: r => DATA.asm.slots[Math.min(r.lv, DATA.asm.slots.length - 1)],
  load: r => (r.workers.length + r.queue.length + (r.incoming || 0)) / Derive.cap(r),
  have: (o, p) => (o.got[p] || []).length,
  partsLeft: o => Object.entries(o.need).filter(([p, n]) => n - Derive.have(o, p) - (o.making[p] || 0) > 0).map(([p]) => p),
  leftCount: o => Object.entries(o.need).reduce((a, [p, n]) => a + Math.max(0, n - Derive.have(o, p)), 0),
  ready: o => o.state === 'placed' && Object.entries(o.need).every(([p, n]) => Derive.have(o, p) >= n),
  // 상자 상태: !환각이 하나라도 → 오류 상자, 아니고 ★영감이 하나라도 → 명작 상자
  boxTag(o) { const all = Object.values(o.got).flat(); return all.includes('hallucinated') ? 'hallucinated' : all.includes('inspired') ? 'inspired' : 'normal'; },
  inboxList: () => World.orders.filter(o => o.state === 'inbox' || (o.state === 'toAsm' && !o.picked)),
  star: (c, kind) => Math.min(DATA.skill.maxStar, Math.floor((c.skill[kind] || 0) / DATA.skill.perStar)),
  rush: () => { const ph = World.S.t - (World.S.day - 1) * DATA.day.length, [a, b] = DATA.day.rush; return ph >= a && ph < b; },
  upkeep() {
    const roads = World.road.reduce((a, b) => a + b, 0);
    return roads * DATA.upkeep.road + World.rooms.filter(r => !DATA.rooms[r.kind].fixed && !r.held).reduce((a, r) => a + DATA.upkeep.byLv[r.lv], 0);
  },
};

// ═════════ 분업 ═════════
// 자유: 누구나 아무 일. 직접 분업: 역할마다 인원을 정함. 알아서 분업: 밀린 일만큼 인원을 자동 배정.
// 꼬물이 하나를 눌러 역할을 고정(핀)할 수도 있다. 고정된 꼬물이는 자동 배정에서 빠진다.
const Teams = {
  mode: 'free', counts: {}, autoT: 0,
  roleOf: id => DATA.roles.find(r => r.id === id),
  allows(c, job) {
    if (!c.role || job.type === 'coffee') return true;
    const r = Teams.roleOf(c.role);
    return r.job === job.type && (!r.part || r.part === job.part);
  },
  // 역할별 인원 수 → 꼬물이에게 배정 (그 일 숙련이 높은 꼬물이부터, 지금 역할은 되도록 유지)
  apply() {
    const free = World.crew.filter(c => !c.pinned);
    if (Teams.mode === 'free') { for (const c of free) c.role = null; return; }
    const want = { ...Teams.counts }, keep = [];
    for (const c of free) if (c.role && want[c.role] > 0) { want[c.role]--; keep.push(c); }
    const rest = free.filter(c => !keep.includes(c));
    for (const c of rest) c.role = null;
    for (const role of DATA.roles) {
      while (want[role.id] > 0) {
        const cand = rest.filter(c => !c.role).sort((a, b) => Teams.skillFor(b, role) - Teams.skillFor(a, role))[0];
        if (!cand) break; cand.role = role.id; want[role.id]--;
      }
    }
  },
  // 배정 점수 = 숙련 + 기질 궁합(감사관 → 조립·검수, 몽상가 → 부품 방)
  skillFor(c, role) {
    const sk = role.job === 'part' ? c.skill[DATA.parts[role.part].room] || 0 : role.job === 'asm' ? (c.skill.asm || 0) + (c.skill.qa || 0) : 0;
    return sk + (DATA.quirks[c.quirk].likes === role.job ? DATA.teams.quirkPull : 0);
  },
  inc(id, d) {
    const total = World.crew.filter(c => !c.pinned).length, sum = Object.values(Teams.counts).reduce((a, b) => a + b, 0);
    const v = (Teams.counts[id] || 0) + d; if (v < 0 || (d > 0 && sum >= total)) return;
    Teams.counts[id] = v; Teams.apply();
  },
  setMode(m) { Teams.mode = m; if (m === 'manual' && !Object.keys(Teams.counts).length) Teams.counts = {}; if (m === 'auto') Teams.autoT = 0; Teams.apply(); },
  cyclePin(c) { const ids = [null, ...Teams.available().map(r => r.id)]; const i = ids.indexOf(c.pinned ? c.role : null); const next = ids[(i + 1) % ids.length]; c.pinned = !!next; c.role = next; Teams.apply(); },
  available: () => DATA.roles.filter(r => r.job !== 'part' || World.rooms.some(x => x.kind === DATA.parts[r.part].room)),
  // 알아서 분업: 역할마다 밀린 일의 양(초)을 재서 인원을 비례 배분한다
  tick(dt) {
    if (Teams.mode !== 'auto') return;
    Teams.autoT -= dt; if (Teams.autoT > 0) return; Teams.autoT = DATA.teams.autoEvery;
    const dem = Jobs.demand(), roles = Teams.available(), total = World.crew.filter(c => !c.pinned).length;
    const sum = roles.reduce((a, r) => a + (dem[r.id] || 0), 0); if (!sum) { Teams.counts = {}; Teams.apply(); return; }
    const raw = roles.map(r => ({ id: r.id, v: (dem[r.id] || 0) / sum * total })), counts = {};
    let left = total; for (const x of raw) { counts[x.id] = Math.floor(x.v); left -= counts[x.id]; }
    raw.sort((a, b) => (b.v % 1) - (a.v % 1)); for (const x of raw) if (left > 0 && x.v > 0) { counts[x.id]++; left--; }
    Teams.counts = counts; Teams.apply();
  },
};

// ═════════ 일감 ═════════
// 일감 = 행동 목록. 행동의 목적지는 시작할 때 고른다(방이 옮겨져도 맞게 간다).
// 고르는 순서: 커피(카페인 바닥) > 조립(끝낼 것) > 부품 > 배부.
const Jobs = {
  // 방 고르기: 걷는 거리 + (일하는 중·줄·오는 중 ÷ 정원) × 일 시간. 빈 방으로 고르게 퍼진다.
  bestRoom(c, kind) {
    let best = null, bs = Infinity;
    for (const r of World.rooms) if (!r.held && r.kind === kind) {
      const p = Path.to(c, r); if (!p) continue;
      const sc = p.length / (DATA.walk.tilesPerSec * World.S.walk) + Derive.load(r) * (DATA.rooms[kind].work || 1);
      if (sc < bs) { bs = sc; best = r; }
    }
    return best;
  },
  asmFor(c, o) {
    let best = null, bl = Infinity;
    for (const r of World.rooms) if (!r.held && r.kind === 'asm' && r.slots.length < Derive.slotsOf(r) && !r.reject.has(o.r)) {
      const p = Path.to(c, r), sc = p && p.length + r.slots.length * 2 / Derive.cap(r);
      if (p && sc < bl) { bl = sc; best = r; }
    }
    return best;
  },
  // 알아서 분업은 '부드러운' 역할: 내 역할 일이 없으면 다른 일을 돕는다. 직접 분업은 역할을 지킨다.
  find(c) {
    if (c.energy <= 0) {
      const p = Jobs.bestRoom(c, 'pantry');
      if (p) return { type: 'coffee', acts: [{ to: () => Jobs.bestRoom(c, 'pantry'), act: 'work', what: 'coffee' }] };
    }
    const j = Jobs.findWith(c, true); if (j || !c.role || Teams.mode !== 'auto') return j;
    const k = Jobs.findWith(c, false); if (k) c.why = ''; return k;
  },
  findWith(c, useRole) {
    const W_ = World, why = [], ok = job => !useRole || Teams.allows(c, job);
    // 1) 조립: 부품이 다 모인 주문 → 조립 → 검수 → 발송
    if (ok({ type: 'asm' })) for (const o of W_.orders) if (Derive.ready(o) && !o.claimed && Path.to(c, o.asmRoom)) {
      o.state = 'asm'; o.claimed = c;
      return { type: 'asm', o, acts: [{ to: () => o.asmRoom, act: 'work', what: 'asm' }, { to: () => Jobs.bestRoom(c, 'qa'), act: 'work', what: 'qa', kind: 'qa' }, { to: () => Jobs.room('out'), act: 'deliver' }] };
    }
    // 2) 부품: 오래된 주문 먼저, 잘하는 부품은 조금 앞당김. '금방 끝나는 주문부터' 조립실은 남은 부품 1개짜리를 맨 앞으로
    const opts = [];
    for (const o of W_.orders) if (o.state === 'placed') for (const p of Derive.partsLeft(o)) {
      if (!ok({ type: 'part', part: p })) continue;
      const room = DATA.parts[p].room; if (!Jobs.bestRoom(c, room)) { why.push(DATA.text.noRoad(DATA.rooms[room].n)); W_.day.stuck[room] = (W_.day.stuck[room] || 0) + 0.02; continue; }
      if (!Path.to(c, o.asmRoom)) continue;
      const near = o.asmRoom.prio === 'near' && Derive.leftCount(o) === 1 ? 1000 : 0;
      opts.push({ o, p, sc: o.t0 - Derive.star(c, room) * DATA.skill.pickBias - near });
    }
    if (opts.length) {
      opts.sort((a, b) => a.sc - b.sc); const { o, p } = opts[0]; o.making[p] = (o.making[p] || 0) + 1;
      return { type: 'part', o, part: p, acts: [{ to: () => Jobs.bestRoom(c, DATA.parts[p].room), act: 'work', what: 'part' }, { to: () => o.asmRoom, act: 'drop' }] };
    }
    // 3) 배부: 접수함 주문서 → 받을 수 있는 조립실
    if (ok({ type: 'dispatch' })) {
      const inn = Jobs.room('in');
      for (const o of W_.orders) if (o.state === 'inbox') {
        const r = Jobs.asmFor(c, o);
        if (!r) { why.push(World.rooms.some(x => x.kind === 'asm' && !x.reject.has(o.r)) ? DATA.text.asmFull : DATA.text.noAsm(DATA.recipes[o.r].n)); continue; }
        if (!Path.to(c, inn)) { why.push(DATA.text.noRoad(DATA.rooms.in.n)); break; }
        o.state = 'toAsm'; o.asmRoom = r; r.slots.push(o); o.claimed = c;
        return { type: 'dispatch', o, acts: [{ to: () => inn, act: 'take' }, { to: () => o.asmRoom, act: 'drop' }] };
      }
    }
    c.why = c.energy <= 0 ? DATA.text.noCoffee : why[0] || (c.role ? DATA.text.roleIdle(Teams.roleOf(c.role).n) : DATA.text.idle);
    return null;
  },
  room: kind => World.rooms.find(r => r.kind === kind && !r.held),
  // 일 시간 = 기본 × 숙련 할인 ÷ 꼬물이 속도(기질·버프·간식)
  workTime(c, r, act) {
    let base = DATA.rooms[r.kind].work || 1;
    if (act.what === 'asm') base = DATA.asm.base + DATA.asm.perPart * Object.values(c.job.o.need).reduce((a, b) => a + b, 0);
    if (act.what === 'qa') base = Jobs.qaTime(c, c.job.o);
    return base * (1 - DATA.skill.speedBonus * Derive.star(c, r.kind)) / Crew.mul(c, 'work', r);
  },
  // 검수 시간은 상자 상태로 정해진다: 정상·명작 = 도장만, 오류 = 고치기(감사관은 뒤집기)
  // 오류 상자를 알아챌지는 검수를 시작할 때 정한다: 감사관·Lv.2 검수대는 늘, 보통은 catch 확률. 못 알아채면 도장만 찍는다
  qaTime(c, o) {
    const q = DATA.qa; if (o.tag !== 'hallucinated') return q.fastPass;
    if (DATA.quirks[c.quirk].alchemy) return q.alchemy;
    c.qaCaught = Rand() < (c.room.lv >= 2 ? q.catchLv2 : q.catch);
    return c.qaCaught ? q.fix : q.fastPass;
  },
  // 알아서 분업에 쓰는 밀린 일의 양(초)
  demand() {
    const d = {};
    for (const o of World.orders) {
      if (o.state === 'placed') { for (const [p, n] of Object.entries(o.need)) { const left = n - Derive.have(o, p); if (left > 0) d[p] = (d[p] || 0) + left * (DATA.rooms[DATA.parts[p].room].work || 1); } if (Derive.ready(o)) d.asm = (d.asm || 0) + DATA.teams.asmCost; }
      if (o.state === 'asm' || o.state === 'carry') d.asm = (d.asm || 0) + DATA.teams.asmCost;
    }
    // 배부는 조립실에 빈자리가 있을 때만 할 수 있는 일이다
    const free = World.rooms.filter(r => r.kind === 'asm' && !r.held).reduce((a, r) => a + Math.max(0, Derive.slotsOf(r) - (r.slots ? r.slots.length : 0)), 0);
    const waiting = World.orders.filter(o => o.state === 'inbox').length;
    d.dispatch = Math.min(free, waiting) * DATA.teams.dispatchCost;
    return d;
  },
};

// ═════════ 꼬물이 상태 기계 ═════════
// idle → walk → (방 앞) → enter → work → 다음 행동
//                        ↘ queue(줄)      ↘ stuck(길 없음, 잠시 뒤 다시)
// 기질·카페인·버프는 모두 Crew.mul(속도)과 Crew.partTag(부품 상태) 두 곳에서만 계산한다.
const Crew = {
  // ── 속도 배율: 기질 × 버프 × 간식 × 카페인 ──
  rushOn(c) { const q = DATA.quirks[c.quirk]; return !!q.rushMul && (Derive.inboxList().length >= q.rushInbox || Derive.rush()); },
  mul(c, kind, room) {
    const q = DATA.quirks[c.quirk], S = World.S, b = c.buff; let m = S.pace;
    if (kind === 'walk') { m *= S.walk; if (c.energy <= 0 && !Crew.rushOn(c)) m *= DATA.energy.emptyWalk; }
    else {
      m *= q.workMul || 1;
      if (room && room.kind === 'qa') m *= q.qaMul || 1;
      if (q.soloMul && room && !DATA.rooms[room.kind].coffee) m *= c.solo ? q.soloMul : q.crowdMul;
    }
    if (q.rushMul) m *= Crew.rushOn(c) ? q.rushMul : q.baseMul;
    if (b.chat) m *= DATA.chat.mul; if (b.praise) m *= DATA.poke.praiseMul; if (b.coffee) m *= DATA.energy.coffeeBuff;
    return m;
  },
  // ── 부품 상태: 환각 확률 → 영감 확률 → 정상 순으로 한 번 굴린다 ──
  partTag(c, r) {
    const q = DATA.quirks[c.quirk], S = World.S;
    const hal = ((q.hallucinate || 0) + S.halluAdd) * S.halluMul;
    const ins = Derive.star(c, r.kind) * DATA.skill.inspirePerStar + (q.inspire || 0) + (q.soloInspire && c.solo ? q.soloInspire : 0) + (c.buff.chat ? S.chatInspire : 0);
    const x = Rand(); return x < hal ? 'hallucinated' : x < hal + ins ? 'inspired' : 'normal';
  },
  start(c) {
    c.act = c.job && c.job.acts[0];
    if (!c.act) { Crew.endJob(c); return; }
    const r = c.act.to();
    // 검수: 검수대가 없거나 줄이 너무 길면 건너뛰고 바로 발송구로(오류 상자면 사고가 난다)
    if (c.act.kind === 'qa' && (!r || r.queue.length >= DATA.qa.skipQueue)) {
      World.day.qa.skip++; if (c.job.o.tag === 'hallucinated') UI.log(DATA.text.skipQa(c.name));
      Crew.next(c); return;
    }
    if (!r || r.held) { c.st = 'stuck'; c.why = '갈 방 없음'; c.retry = DATA.think.stuckRetry; return; }
    const p = Path.to(c, r);
    if (!p) { c.st = 'stuck'; c.why = DATA.text.noRoad(DATA.rooms[r.kind].n); c.retry = DATA.think.stuckRetry; World.day.stuck[r.kind] = (World.day.stuck[r.kind] || 0) + 1; return; }
    c.room = r; c.fin = p.pop() || [r.x, r.y]; c.path = p; c.st = 'walk'; c.why = '';
  },
  atDoor(c) {
    const r = c.room, a = c.act;
    if (!r || r.held) { Crew.start(c); return; }
    if (a.act === 'work') { if (r.workers.length < Derive.cap(r)) Crew.enter(c, r); else { if (!r.queue.includes(c)) r.queue.push(c); c.st = 'queue'; } return; }
    Crew.instant(c, a);
  },
  enter(c, r) { r.workers.push(c); c.solo = r.queue.length === 0; c.path = [c.fin]; c.st = 'enter'; },
  pull(r) { while (r.queue.length && r.workers.length < Derive.cap(r)) Crew.enter(r.queue.shift(), r); },
  instant(c, a) {
    const j = c.job, o = j.o;
    if (a.act === 'take') { o.picked = true; c.carry = { slip: o }; }
    else if (a.act === 'drop' && j.type === 'dispatch') { o.state = 'placed'; o.picked = false; c.carry = null; FX.pop(c, '#e9e2cc'); }
    else if (a.act === 'drop' && j.type === 'part') { (o.got[j.part] = o.got[j.part] || []).push(c.carry.tag); j.delivered = true; c.carry = null; FX.pop(c, DATA.parts[j.part].col); }
    else if (a.act === 'deliver') Flow.deliver(c, o);
    Crew.next(c);
  },
  next(c) { c.job.acts.shift(); Crew.start(c); },
  finish(c) {
    const r = c.room, a = c.act, j = c.job, S = World.S;
    r.workers = r.workers.filter(x => x !== c); Crew.pull(r);
    if (a.what === 'coffee') { c.energy = DATA.energy.max; c.buff.coffee = DATA.energy.coffeeSec; World.day.coffee++; FX.add(c, 'cup'); Crew.next(c); return; }
    c.skill[r.kind] = (c.skill[r.kind] || 0) + S.skillMul;
    if (!Crew.rushOn(c)) { c.energy = Math.max(0, c.energy - 1); if (!c.energy) FX.add(c, 'cup'); }
    if (j.type === 'part') { const tag = Crew.partTag(c, r); c.carry = { part: j.part, tag }; World.day.made[tag]++; const mb = World.day.madeBy[c.quirk] = World.day.madeBy[c.quirk] || { normal: 0, inspired: 0, hallucinated: 0 }; mb[tag]++; if (tag !== 'normal') FX.add(c, tag === 'inspired' ? 'star' : 'bang'); }
    if (a.what === 'asm') { j.o.tag = Derive.boxTag(j.o); c.carry = { result: j.o }; j.o.state = 'carry'; }
    if (a.what === 'qa') Flow.inspect(c, j.o);
    Crew.next(c);
  },
  endJob(c) {
    if (c.job && c.job.type === 'asm' && c.job.o.state !== 'done') { c.job.o.state = 'placed'; c.job.o.tag = null; }
    c.job = null; c.act = null; c.room = null; c.carry = null; c.st = 'idle'; c.look = 0;
  },
  arrived(c) { if (c.st === 'walk') Crew.atDoor(c); else if (c.st === 'enter') { c.st = 'work'; c.wt = Jobs.workTime(c, c.room, c.act); } },
  step(c, dt) {
    c.ph += dt; c.chatCd -= dt;
    for (const k in c.buff) if ((c.buff[k] -= dt) <= 0) delete c.buff[k];
    if (c.st === 'queue') { const k = c.room.kind; World.day.qwait[k] = (World.day.qwait[k] || 0) + dt; return; }
    if (c.path.length) {
      const [tx, ty] = c.path[0], [px, py] = Path.center(tx, ty), dx = px - c.x, dy = py - c.y, d = Math.hypot(dx, dy), v = DATA.walk.pxPerSec * Crew.mul(c, 'walk') * dt;
      if (Math.abs(dx) > .5) c.face = dx > 0 ? 1 : -1;
      if (d <= v) { c.x = px; c.y = py; c.path.shift(); Crew.aura(c); if (!c.path.length) Crew.arrived(c); } else { c.x += dx / d * v; c.y += dy / d * v; }
      return;
    }
    if (c.st === 'walk' || c.st === 'enter') { Crew.arrived(c); return; }
    if (c.st === 'work') { c.wt -= dt; if (Rand() < dt * 4) FX.spark(c, DATA.rooms[c.room.kind].top); if (c.wt <= 0) Crew.finish(c); return; }
    if (c.st === 'stuck') { c.retry -= dt; if (c.retry <= 0) Crew.start(c); return; }
    if (c.st === 'idle') {
      c.look -= dt; if (c.look > 0) return; c.look = DATA.think.idleLook;
      const j = Jobs.find(c); if (j) { c.job = j; c.why = ''; Crew.start(c); return; }
      if (Rand() < 0.25) Crew.wander(c);
    }
  },
  // Lv.2 탕비실 근처 길을 지나가면 커피를 채운다(무정차 커피)
  aura(c) {
    if (c.energy >= DATA.energy.max) return;
    const [x, y] = Path.tileOf(c), R = DATA.energy.auraRange;
    if (World.rooms.some(r => !r.held && r.kind === 'pantry' && r.lv >= 2 && Math.abs(r.x - x) + Math.abs(r.y - y) <= R)) {
      c.energy = DATA.energy.max; c.buff.coffee = DATA.energy.coffeeSec; World.day.coffee++; FX.add(c, 'cup');
    }
  },
  // 수다쟁이: 걷다가 동료와 마주치면 둘 다 신난다
  social() {
    const ch = DATA.chat;
    for (const c of World.crew) {
      if (!DATA.quirks[c.quirk].chatty || c.chatCd > 0 || !c.path.length) continue;
      const d = World.crew.find(o => o !== c && ['walk', 'idle'].includes(o.st) && Math.hypot(o.x - c.x, o.y - c.y) < ch.reach);
      if (!d) continue;
      c.buff.chat = d.buff.chat = ch.sec; c.chatCd = ch.cd; World.day.chats++; FX.add(c, 'note'); FX.add(d, 'note');
    }
  },
  wander(c) { const [sx, sy] = Path.tileOf(c), opts = []; for (let dy = -1; dy <= 1; dy++) for (let dx = -2; dx <= 2; dx++) if (Path.isRoad(sx + dx, sy + dy)) opts.push([sx + dx, sy + dy]); if (opts.length) { const o = Rand.pick(opts); c.path = Path.bfs(sx, sy, o[0], o[1]) || []; } },
  // 판이 바뀌면 걷던 꼬물이는 길을 다시 찾고, 길 밖에 선 꼬물이는 가까운 길로 옮긴다
  replan() { for (const c of World.crew) { const [sx, sy] = Path.tileOf(c); if (!Path.isRoad(sx, sy) && !Path.roomAt(sx, sy)) { const f = Path.nearestRoad(sx, sy); if (f) [c.x, c.y] = Path.center(f[0], f[1]); } if (c.st === 'walk') Crew.start(c); else if (c.st === 'idle') c.path = []; } },
  // 방을 들면 그 방에 걸린 일은 하던 일을 유지한 채 다시 찾기로
  release(r) { for (const c of World.crew) if (c.room === r && ['work', 'queue', 'enter', 'walk'].includes(c.st)) { const [sx, sy] = Path.tileOf(c); if (!Path.isRoad(sx, sy)) { const f = Path.nearestRoad(sx, sy); if (f) [c.x, c.y] = Path.center(f[0], f[1]); } c.path = []; c.st = 'stuck'; c.retry = 0.3; } r.workers = []; r.queue = []; },
  // 판 위에서 누를 수 있는 꼬물이 찾기
  at: (px, py) => World.crew.find(c => Math.abs(c.x - px) < 9 && Math.abs(c.y - 8 - py) < 10),
};
const FX = {
  pop: (c, col) => World.fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .6, col }),
  spark: (c, col) => World.fx.push({ k: 'spark', x: c.x + (Rand() - .5) * 12, y: c.y - 16, t: 0, life: .4, col }),
  // 그림 효과: star(★영감), bang(!환각), cup(커피), note(♪ 수다), heart(칭찬), knock(꿀밤), burst(명작 변환)
  add: (c, k) => World.fx.push({ k, x: c.x, y: c.y - 22, t: 0, life: k === 'burst' ? 1.2 : .9 }),
};

// ═════════ 하루 흐름: 도착, 검수, 납품, 목표, 지표, 카드 ═════════
const Flow = {
  arrAcc: 0, pick: [],
  rate() {
    const S = World.S, a = DATA.arrival, ph = (S.t % DATA.day.length) / DATA.day.length;
    return (a.base + a.perDay * (S.day - 1) + a.perGoal * S.goal) * (1 - a.wave / 2 + a.wave * Math.sin(ph * Math.PI * 2 - 1)) * (Derive.rush() ? DATA.day.rushArrival : 1);
  },
  spawn() {
    const S = World.S, r = Rand.pick(S.recipes);
    if (Derive.inboxList().length >= S.inboxCap) { World.day.lost++; UI.log(DATA.text.lost); return; }
    const o = Make.order(r);
    if (Rand() < 0.3) UI.log(`<b>[${o.client}]</b> ${Rand.pick(DATA.recipes[r].say)}`);
  },
  // 검수: 결과는 상자 상태(사실)로만 정해진다. 무작위 실패는 없다.
  inspect(c, o) {
    const q = World.day.qa;
    if (o.tag !== 'hallucinated') { q.pass++; FX.pop(c, '#7fe0d0'); return; }
    World.day.halBy[c.quirk] = (World.day.halBy[c.quirk] || 0) + 1;
    if (DATA.quirks[c.quirk].alchemy) { o.tag = 'inspired'; q.alchemy++; FX.add(c, 'burst'); UI.log(DATA.text.alchemy(c.name)); }
    else if (c.qaCaught) { o.tag = 'normal'; q.fix++; FX.pop(c, '#7fe0d0'); }
    else q.miss++;   // 못 알아채고 도장만 찍었다 → 발송구에서 사고
  },
  deliver(c, o) {
    const S = World.S, d = World.day, R = DATA.recipes[o.r], say = s => Rand.pick(s).replace('{c}', o.client);
    d.done++; d.wait += S.t - o.t0; o.state = 'done';
    if (o.tag === 'inspired') { d.master++; UI.log(DATA.text.masterLog(say(R.win))); FX.add(c, 'burst'); }
    else if (o.tag === 'hallucinated') { d.oops++; UI.log(DATA.text.oopsLog(say(R.oops)), 'bad'); FX.add(c, 'bang'); }
    else FX.pop(c, DATA.box.normal);
    S.delivered[o.r] = (S.delivered[o.r] || 0) + DATA.goalCredit[o.tag || 'normal'];
    World.orders.splice(World.orders.indexOf(o), 1);
    c.carry = null; Flow.checkGoal();
  },
  checkGoal() {
    const S = World.S, g = DATA.goals[S.goal]; if (!g) return;
    if (!Object.entries(g.need).every(([r, n]) => (S.delivered[r] || 0) >= n)) return;
    S.goal++; S.delivered = {};
    if (g.recipe && !S.recipes.includes(g.recipe)) S.recipes.push(g.recipe);
    if (g.room) World.toPlace.push(g.room);
    UI.log(`<b>목표 달성!</b> ${g.n}.`); Edit.nextPlace(); UI.recipes();
  },
  metrics() {
    const d = World.day;
    return { done: d.done, master: d.master, avg: d.done ? d.wait / d.done : null, trust: d.done ? 1 - d.oops / d.done : null, cost: Derive.upkeep(), lost: d.lost, oops: d.oops };
  },
  diagnose() {
    const d = World.day, out = [];
    const worst = Object.entries(d.qwait).sort((a, b) => b[1] - a[1])[0];
    out.push(worst && worst[1] > 5 ? `가장 막힌 곳: <b>${DATA.rooms[worst[0]].n}</b> (모두 합쳐 ${Math.round(worst[1])}초 줄 섬)` : '줄이 길게 선 곳은 없었어요.');
    const stuck = Object.entries(d.stuck).filter(e => e[1] >= 1).sort((a, b) => b[1] - a[1])[0]; if (stuck) out.push(`길이 없어 못 간 곳: <b>${DATA.rooms[stuck[0]].n}</b>`);
    const m = d.made; if (m.hallucinated) out.push(`!환각 부품 ${m.hallucinated}개 → 검수대가 고침 ${d.qa.fix}, 명작으로 뒤집음 ${d.qa.alchemy}, 꿀밤 ${d.knock}, <b>사고 ${d.oops}</b>`);
    if (d.qa.skip) out.push(`검수대 줄이 길어 건너뛴 상자 ${d.qa.skip}개`);
    if (d.qa.miss) out.push(`검수대가 못 알아챈 오류 상자 ${d.qa.miss}개 (감사관이나 Lv.2 검수대는 다 잡는다)`);
    out.push(`★영감 부품 ${m.inspired}개 · 커피 ${d.coffee}잔 · 수다 ${d.chats}번`);
    const idle = World.crew.filter(c => c.st === 'idle' && c.why).reduce((acc, c) => (acc[c.why] = (acc[c.why] || 0) + 1, acc), {});
    for (const [w, n] of Object.entries(idle)) if (n >= 2) out.push(`노는 꼬물이 ${n}마리: ${w}`);
    return { text: out.join('<br>'), worst: worst && worst[1] > 5 ? worst[0] : null };
  },
  endDay() {
    const S = World.S; S.inDay = false; UI.closePop();
    const m = Flow.metrics(), diag = Flow.diagnose(), C = DATA.cards;
    m.perfect = m.done > 0 && m.oops === 0;
    const pool = C.specials.filter(c => !c.needPart || S.recipes.some(r => DATA.recipes[r].parts[c.needPart]));
    let sp = diag.worst && Rand() < C.bottleneckChance && pool.find(c => c.room === diag.worst); if (!sp) sp = Rand.pick(pool);
    Flow.pick = [{ ...sp, n: `${sp.n} + 길 ${C.strongRoads}칸`, roads: C.strongRoads }, Rand.pick(C.alts)];
    UI.report(m, S.yday, S.best, diag.text, Flow.pick);
    const b = S.best; S.yday = m;
    const pickBest = (k, f) => m[k] == null ? b[k] : b[k] == null ? m[k] : f(b[k], m[k]);
    S.best = b ? { done: Math.max(b.done, m.done), master: Math.max(b.master, m.master), avg: pickBest('avg', Math.min), trust: pickBest('trust', Math.max), cost: Math.min(b.cost, m.cost) } : { ...m };
  },
  choose(card) {
    const S = World.S, perfect = S.yday && S.yday.perfect; UI.hideReport(); S.day++; S.inDay = true; World.day = newDayStats();
    S.roads += (card.roads || 0) + (perfect ? DATA.perfect.roads : 0);
    for (const q of card.crew || []) Make.crew(q);
    if (card.mul) for (const [k, v] of Object.entries(card.mul)) S[k] *= v;
    if (card.add) for (const [k, v] of Object.entries(card.add)) S[k] += v;
    if (card.room) World.toPlace.push(card.room);
    Teams.apply(); UI.log(`${card.n}.${perfect ? ' ' + DATA.text.perfect(DATA.perfect.roads) : ''}`); Edit.nextPlace(); UI.crewPanel();
  },
  step(dt) {
    const S = World.S; if (!S.inDay || S.paused) return;
    S.t += dt; S.pokeCd = Math.max(0, S.pokeCd - dt);
    Flow.arrAcc += dt * Flow.rate(); while (Flow.arrAcc >= 1) { Flow.arrAcc--; Flow.spawn(); }
    Derive.refresh(); Teams.tick(dt);
    for (const c of World.crew) Crew.step(c, dt);
    Crew.social();
    for (const f of World.fx) f.t += dt; World.fx = World.fx.filter(f => f.t < f.life);
    if (S.t >= S.day * DATA.day.length) Flow.endDay();
  },
};

// ═════════ 편집: 고르기, 길 깔기·지우기, 방 들어 옮기기·겹쳐 증축, 꼬물이 누르기 ═════════
// 다시 설계하는 손품은 싸게(Good Company 반면교사). 편집 중에도 시간은 흐른다(교착 방지).
const Edit = {
  tool: 'sel', held: null, hover: [0, 0], dragging: false,
  setTool(t) { Edit.tool = t; UI.tools(); if (t !== 'sel') UI.closePop(); },
  paint(x, y) {
    if (!Path.inb(x, y) || Path.roomAt(x, y)) return; const i = y * G.w + x, S = World.S;
    if (Edit.tool === 'road' && !World.road[i] && S.roads > 0) { World.road[i] = 1; S.roads--; Crew.replan(); }
    else if (Edit.tool === 'erase' && World.road[i]) { World.road[i] = 0; S.roads++; Crew.replan(); }
  },
  // 같은 종류 방 위에 놓으면 층이 오른다(Stacklands식 겹치기)
  stackTarget(x, y) { const h = Edit.held, t = h && Path.roomAt(x, y); return t && t !== h && t.kind === h.kind && !DATA.rooms[t.kind].fixed && t.lv + h.lv <= DATA.stack.maxLv ? t : null; },
  canPlace: (x, y) => Path.inb(x, y) && ((!World.road[y * G.w + x] && !Path.roomAt(x, y)) || !!Edit.stackTarget(x, y)),
  drop(x, y) {
    const h = Edit.held; if (!h || !Edit.canPlace(x, y)) return false;
    const t = Edit.stackTarget(x, y);
    if (t) {
      t.lv += h.lv; World.rooms.splice(World.rooms.indexOf(h), 1);
      for (const o of World.orders) if (o.asmRoom === h) o.asmRoom = t;   // 들고 온 조립실의 주문은 아래층으로
      Crew.pull(t); UI.log(DATA.text.stack(DATA.rooms[t.kind].n, t.lv));
    } else { h.x = x; h.y = y; h.held = false; if (!Path.roadNext(h)) UI.log(`<b>${DATA.rooms[h.kind].n}</b> 옆에 길이 없어요. 길을 이어 주세요.`); }
    Edit.held = null; Crew.replan(); Edit.nextPlace(); UI.crewPanel(); return true;
  },
  lift(r) { if (DATA.rooms[r.kind].fixed) return; Crew.release(r); r.held = true; r.from = [r.x, r.y]; Edit.held = r; UI.closePop(); Crew.replan(); },
  cancel() { const h = Edit.held; if (h && h.from) { h.x = h.from[0]; h.y = h.from[1]; h.held = false; Edit.held = null; Crew.replan(); Edit.nextPlace(); } },
  nextPlace() { if (Edit.held || !World.toPlace.length) return; const k = World.toPlace.shift(); const r = Make.room(k, -5, -5); r.held = true; r.from = null; Edit.held = r; Edit.setTool('sel'); UI.log(`새 <b>${DATA.rooms[k].n}</b>: 길 옆 빈 칸, 또는 같은 방 위(증축)를 누르세요.`); },
  // 조립실이 받지 않을 주문(거부 목록). 새로 열리는 주문은 기본으로 받는다.
  toggleReject(r, recipe) { if (r.reject.has(recipe)) r.reject.delete(recipe); else r.reject.add(recipe); },
  cyclePrio(r) { const ks = Object.keys(DATA.prioModes); r.prio = ks[(ks.indexOf(r.prio) + 1) % ks.length]; },
  // 한 번 누르기: !환각을 든 꼬물이 → 꿀밤(★영감으로 뒤집힘), 그 밖 → 칭찬(카페인 완충 + 가속). 쿨타임 공유
  poke(c) {

    return true;
  },
};

// ═════════ 그림(캔버스) ═════════
// 판, 길, 방, 꼬물이, 들고 있는 것, 효과. 글자는 UI(HTML)가 맡는다.
// 기질은 이모지가 아니라 몸에 붙은 도트 소품으로 보여 준다(안경, 선글라스, 수면 모자, 머리띠, 입).
const Render = {
  ctx: null, spr: {},
  init(cv) { Render.ctx = cv.getContext('2d'); },
  rect(c, x, y, w, h) { const g = Render.ctx; g.fillStyle = c; g.fillRect(x, y, w, h); },
  // 작은 도트 그림: 문자열 한 줄 = 한 줄 픽셀, '#' = 칠함
  glyph(rows, x, y, col, out) {
    const R = Render.rect;
    if (out) rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === '#') R(out, x + i - 1, y + j - 1, 3, 3); }));
    rows.forEach((row, j) => [...row].forEach((ch, i) => { if (ch === '#') R(col, x + i, y + j, 1, 1); }));
  },
  G: {
    star: ['..#..', '.###.', '#####', '.###.', '.#.#.'],
    bang: ['#', '#', '#', '.', '#'],
    cup: ['.#.#', '#.#.', '....', '###.', '####', '###.'],
    note: ['..##', '..#.', '..#.', '###.', '##..'],
    heart: ['.#.#.', '#####', '#####', '.###.', '..#..'],
    knock: ['#...#', '.#.#.', '..#..', '.#.#.', '#...#'],
  },
  // !환각 말풍선: 빨간 바탕에 흰 느낌표(막힘 표시는 흰 바탕에 빨간 느낌표)
  halBubble(x, y, on) { const R = Render.rect; R('#1b1420', x - 1, y - 1, 7, 10); R(on ? '#ff4d6d' : '#c02848', x, y, 5, 8); R('#fff', x + 2, y + 1, 1, 4); R('#fff', x + 2, y + 6, 1, 1); R(on ? '#ff4d6d' : '#c02848', x, y + 8, 2, 2); },
  // 16px 꼬물이: 코드로 찍고 색·프레임·기질별로 캐시
  critter(tint, frame, quirk) {
    const key = tint + frame + quirk; if (Render.spr[key]) return Render.spr[key];
    const s = 16, cv = document.createElement('canvas'); cv.width = s; cv.height = s; const x = cv.getContext('2d');
    const px = (a, b, col) => { x.fillStyle = col; x.fillRect(a, b, 1, 1); }, box = (a, b, w, h, col) => { x.fillStyle = col; x.fillRect(a, b, w, h); };
    const bot = 13, top = 3, cx = 7.5, rx = 6.4, ry = (bot - top) / 2 + 0.4, cy = top + ry - 0.4 + (frame ? 0.5 : 0);
    const ins = (i, j) => ((i - cx) / rx) ** 2 + ((j - cy) / ry) ** 2 <= 1;
    for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) { if (!ins(i, j)) continue; const edge = !ins(i - 1, j) || !ins(i + 1, j) || !ins(i, j - 1) || !ins(i, j + 1); px(i, j, edge ? '#2b1d2c' : tint); if (!edge && j > cy + ry * 0.35) px(i, j, 'rgba(0,0,0,.18)'); if (!edge && i < cx - 1 && j < cy - ry * 0.35) px(i, j, 'rgba(255,255,255,.28)'); }
    const ey = Math.round(cy - 1), ax = 8 + (frame ? 1 : 0);
    box(4, ey, 2, 3, '#1b1420'); box(10, ey, 2, 3, '#1b1420');
    box(2, ey + 3, 1, 1, '#f08a7a'); box(13, ey + 3, 1, 1, '#f08a7a');
    box(4, 14, 2, frame === 0 ? 1 : 2, '#2b1d2c'); box(10, 14, 2, frame === 1 ? 1 : 2, '#2b1d2c');
    if (quirk === 'dreamer') {          // 수면 모자(더듬이 대신)
      box(5, 3, 7, 1, '#6a4ab0'); box(6, 2, 5, 1, '#8a6ad0'); box(8, 1, 3, 1, '#8a6ad0'); px(11, 0, '#f4f1ff'); px(10, 1, '#f4f1ff');
    } else {
      box(ax, 0, 1, 3, '#2b1d2c'); px(ax, 0, '#7fe0d0');
    }
    if (quirk === 'auditor') {          // 동그란 안경
      const f = '#f4f1ff'; box(3, ey - 1, 4, 1, f); box(3, ey + 3, 4, 1, f); box(3, ey, 1, 3, f); box(6, ey, 1, 3, f);
      box(9, ey - 1, 4, 1, f); box(9, ey + 3, 4, 1, f); box(9, ey, 1, 3, f); box(12, ey, 1, 3, f); box(7, ey, 2, 1, f);
    } else if (quirk === 'loner') {     // 선글라스
      box(3, ey, 10, 2, '#0e0c14'); px(4, ey, '#6a6680'); px(10, ey, '#6a6680');
    } else if (quirk === 'chatty') {    // 동그랗게 벌린 입
      box(7, ey + 3, 2, 2, '#b04060'); px(7, ey + 3, '#ff9ab0');
    } else if (quirk === 'sprinter') {  // 빨간 머리띠
      for (let i = 1; i < 15; i++) if (ins(i, 4)) px(i, 4, '#ff5a5a'); px(14, 5, '#ff5a5a'); px(15, 6, '#ff5a5a');
    }
    return (Render.spr[key] = cv);
  },
  tile(x, y) { const R = Render.rect, px = x * TILE, py = y * TILE; R((x + y) % 2 ? '#24203a' : '#27233e', px, py, TILE, TILE); R('#1a1729', px, py + TILE - 1, TILE, 1); R('#1a1729', px + TILE - 1, py, 1, TILE); R('rgba(255,255,255,.05)', px, py, TILE - 1, 1); R('rgba(255,255,255,.05)', px, py, 1, TILE - 1); },
  road(x, y) {
    const R = Render.rect, px = x * TILE, py = y * TILE, link = (dx, dy) => Path.isRoad(x + dx, y + dy) || !!Path.roomAt(x + dx, y + dy), c = '#3a3552';
    R(c, px + 6, py + 6, 12, 12);
    if (link(1, 0)) R(c, px + 18, py + 6, 6, 12); if (link(-1, 0)) R(c, px, py + 6, 6, 12);

    R('rgba(127,224,208,.22)', px + 11, py + 11, 2, 2);
  },
  // Lv.2 탕비실의 커피 향 범위(무정차 충전 구역)
  aura(r, t) {
    const R = DATA.energy.auraRange, g = Render.ctx; g.fillStyle = `rgba(216,160,112,${0.07 + 0.03 * Math.sin(t * 3)})`;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) if (Math.abs(dx) + Math.abs(dy) <= R && Path.isRoad(r.x + dx, r.y + dy)) g.fillRect((r.x + dx) * TILE + 2, (r.y + dy) * TILE + 2, TILE - 4, TILE - 4);
  },
  // 방: 윗면 색 + 기호. 부품 방은 만드는 부품 색 네모가 크게 들어간다(아래 범례와 같은 색). Lv.2는 위층 판이 겹쳐 보인다
  room(r, t, ghost) {
    const R = Render.rect, g = Render.ctx, k = DATA.rooms[r.kind], px = r.x * TILE, py = r.y * TILE, wh = '#f4f1ff';
    g.globalAlpha = ghost ? .55 : 1;
    if (r.lv >= 2) { R('rgba(0,0,0,.4)', px + 4, py, 19, 4); R(k.top, px + 3, py - 2, 18, 3); }
    R('rgba(0,0,0,.4)', px + 2, py + 3, 21, 21); R(k.col, px + 1, py + 1, 22, 21); R(k.top, px + 1, py + 1, 22, 5); R('rgba(0,0,0,.3)', px + 1, py + 6, 22, 1);
    if (r.lv >= 2) { R('#1b1420', px + 16, py + 2, 6, 3); R(wh, px + 17, py + 3, 1, 1); R(wh, px + 20, py + 3, 1, 1); }
    const ix = px + 7, iy = py + 9;
    if (r.kind === 'in') { R(wh, ix, iy + 2, 10, 7); R(k.col, ix + 2, iy + 4, 6, 1); }
    else if (r.kind === 'out') { R(wh, ix + 1, iy, 8, 6); R(wh, ix + 4, iy + 6, 2, 2); R(wh, ix + 2, iy + 8, 6, 1); }
    else if (r.kind === 'asm') { R('#c8a878', ix, iy - 1, 10, 11); R(wh, ix + 1, iy + 1, 8, 8); ['#8ac8ff', '#ff9ad0', '#f0e070', '#f4f1ff'].forEach((c, i) => R(c, ix + 2 + (i % 2) * 3, iy + 2 + Math.floor(i / 2) * 3, 2, 2)); }
    else if (r.kind === 'qa') { R(wh, ix, iy, 10, 10); R('#3aa060', ix + 2, iy + 5, 2, 2); R('#3aa060', ix + 4, iy + 7, 2, 1); R('#3aa060', ix + 6, iy + 3, 2, 4); }
    else if (r.kind === 'pantry') { R('#1b1420', ix, iy - 1, 10, 11); R('#6a6680', ix + 1, iy, 8, 4); R('#ff5a5a', ix + 2, iy + 1, 1, 1); R(wh, ix + 3, iy + 6, 4, 3); R('#8a5a3a', ix + 4, iy + 6, 2, 1); R(wh, ix + 7, iy + 7, 1, 1); if (!ghost && Math.sin(t * 4) > 0) R('rgba(255,255,255,.6)', ix + 4, iy + 4 - (t * 4 % 2 | 0), 1, 1); }
    else if (k.part) { R('#1b1420', ix - 1, iy - 1, 12, 12); R(DATA.parts[k.part].col, ix, iy, 10, 10); }
    if (r.workers.length && !ghost) R(Math.sin(t * 10) > 0 ? k.top : '#fff', px + 19, py + 9, 2, 2);
    g.globalAlpha = 1;
  },
  // 들고 있는 것: 주문서 / 부품(★ 금테, ! 빨간 테 + 느낌표) / 상자(일반 노랑, 명작 무지개 테, 오류 빨강)
  carry(c, x, y, t) {
    const R = Render.rect, k = c.carry; if (!k) return;
    const blink = Math.sin(t * 9 + c.i) > 0;
    if (k.slip) { R('#2b1d2c', x - 3, y - 5, 7, 7); R('#e9e2cc', x - 2, y - 4, 5, 5); R('#6b6258', x - 1, y - 3, 3, 1); R('#6b6258', x - 1, y - 1, 3, 1); return; }
    if (k.part) {
      const tg = k.tag, edge = tg === 'inspired' ? DATA.tags.inspired.col : tg === 'hallucinated' ? DATA.tags.hallucinated.col : '#2b1d2c';
      R(edge, x - 3, y - 4, 6, 6); R(DATA.parts[k.part].col, x - 2, y - 3, 4, 4);
      if (tg === 'inspired' && blink) R('#fff', x + 2, y - 6, 1, 1);
      if (tg === 'hallucinated') Render.halBubble(x + 4, y - 14, blink);
      return;
    }
    const tg = k.result.tag || 'normal', B = DATA.box;
    const edge = tg === 'inspired' ? B.rainbow[Math.floor(t * 8) % B.rainbow.length] : '#2b1d2c';
    R(edge, x - 4, y - 5, 8, 7); R(B[tg], x - 3, y - 4, 6, 5); R(tg === 'hallucinated' ? '#7a1a2a' : '#c8a040', x - 3, y - 2, 6, 1);
    if (tg === 'hallucinated') Render.halBubble(x + 4, y - 15, blink);
    if (tg === 'inspired' && blink) Render.glyph(Render.G.star, x - 2, y - 12, '#ffe27a', '#1b1420');
  },
  crew(c, t) {
    const R = Render.rect, g = Render.ctx, moving = c.path.length > 0;
    const fr = moving ? Math.floor(t * 8 + c.ph) % 2 : c.st === 'work' ? Math.floor(t * 5) % 2 : 0;
    const img = Render.critter(c.tint, fr, c.quirk), x = Math.round(c.x - 8), y = Math.round(c.y - 16);
    // 들고 있는 것의 상태가 발밑 빛으로 보인다: !환각 = 빨강 맥박, ★영감 = 금빛
    const k = c.carry, tg = k && (k.part ? k.tag : k.result && k.result.tag), pulse = Math.sin(t * 8 + c.i) > 0;
    if (tg === 'hallucinated') { R(pulse ? 'rgba(255,77,109,.85)' : 'rgba(255,77,109,.45)', x + 1, y + 14, 14, 3); R('rgba(255,77,109,.35)', x - 1, y + 15, 18, 2); }
    else if (tg === 'inspired') { R(pulse ? 'rgba(255,226,122,.8)' : 'rgba(255,226,122,.45)', x + 1, y + 14, 14, 3); }
    else R('rgba(0,0,0,.3)', x + 3, y + 15, 10, 2);
    if (Crew.rushOn(c)) for (let k = 0; k < 3; k++) R(k % 2 ? '#ffd040' : '#ff7a3a', x + 2 + ((t * 20 + k * 5) % 12 | 0), y + 13 - ((t * 9 + k) % 3 | 0), 1, 2);   // 벼락치기 불꽃
    if (c.buff.praise || c.buff.chat || c.buff.coffee) { const col = c.buff.praise ? '#ff9ab0' : c.buff.chat ? '#ffb0d8' : '#d8a070'; if (Math.sin(t * 12 + c.i) > .3) R(col, x + (t * 30 % 14 | 0), y + 2, 1, 1); }
    if (c.face < 0) { g.save(); g.translate(x + 16, y); g.scale(-1, 1); g.drawImage(img, 0, 0); g.restore(); } else g.drawImage(img, x, y);
    Render.carry(c, Math.round(c.x), y, t);
    if (c.role) { const role = Teams.roleOf(c.role); const col = role.part ? DATA.parts[role.part].col : role.job === 'asm' ? '#a8e0a8' : '#8ac8ff'; R('#1b1420', x + 1, y + 1, 4, 4); R(col, x + 2, y + 2, 2, 2); }
    if (c.energy <= 0 && !c.carry) Render.glyph(Render.G.cup, x + 12, y - 5, '#d8a070', '#1b1420');   // 카페인 바닥
    if (c.st === 'stuck') { R('#fff', x + 11, y - 9, 7, 8); R('#ff5a5a', x + 14, y - 8, 1, 4); R('#ff5a5a', x + 14, y - 3, 1, 1); }
    else if (c.st === 'idle' && c.why && !moving && c.energy > 0) { const b = Math.floor(t * 2 % 2); R('#9a93ad', x + 12, y - 5 - b, 3, 1); R('#9a93ad', x + 14, y - 4 - b, 1, 1); R('#9a93ad', x + 12, y - 3 - b, 3, 1); }
  },
  fx(t) {
    const R = Render.rect, Gl = Render.G;
    for (const f of World.fx) { const q = f.t / f.life, x = Math.round(f.x), y = Math.round(f.y - q * 8);
      if (f.k === 'spark') R(f.col, Math.round(f.x), Math.round(f.y - q * 6), 1, 1);
      else if (f.k === 'pop') R(f.col, x - 1, Math.round(f.y - q * 10), 3, 3);
      else if (f.k === 'star') Render.glyph(Gl.star, x - 2, y, '#ffe27a', '#1b1420');
      else if (f.k === 'bang') Render.glyph(Gl.bang, x, y, '#ff4d6d', '#fff');
      else if (f.k === 'cup') Render.glyph(Gl.cup, x - 2, y, '#d8a070', '#1b1420');
      else if (f.k === 'note') Render.glyph(Gl.note, x - 2 + Math.round(Math.sin(q * 9) * 2), y, '#ffb0d8', '#1b1420');
      else if (f.k === 'heart') Render.glyph(Gl.heart, x - 2, y, '#ff6a8a', '#fff');
      else if (f.k === 'knock') Render.glyph(Gl.knock, x - 2, Math.round(f.y) - 4, q < .5 ? '#fff' : '#ffe27a', '#1b1420');
      else if (f.k === 'burst') { const rr = 3 + q * 12, B = DATA.box.rainbow; for (let k = 0; k < 8; k++) { const a = k / 8 * Math.PI * 2 + q; R(B[k % B.length], Math.round(f.x + Math.cos(a) * rr), Math.round(f.y + 6 + Math.sin(a) * rr * .7), 2, 2); } }
    }
  },
  frame(t) {
    const g = Render.ctx;

    for (const r of World.rooms) if (!r.held && r.kind === 'pantry' && r.lv >= 2) Render.aura(r, t);
    const [hx, hy] = Edit.hover;
    if ((Edit.tool !== 'sel' || Edit.held) && Path.inb(hx, hy)) { g.strokeStyle = Edit.held ? (Edit.stackTarget(hx, hy) ? '#ffe27a' : Edit.canPlace(hx, hy) ? '#7fe0d0' : '#ff5a5a') : Edit.tool === 'road' ? '#7fe0d0' : '#ff8a7a'; g.strokeRect(hx * TILE + .5, hy * TILE + .5, TILE - 1, TILE - 1); }
    // 들고 있는 방과 같은 방은 노란 테두리로 "여기 겹치면 증축" 표시
    if (Edit.held) for (const r of World.rooms) if (!r.held && r.kind === Edit.held.kind && !DATA.rooms[r.kind].fixed && r.lv + Edit.held.lv <= DATA.stack.maxLv && Math.sin(t * 6) > 0) { g.strokeStyle = '#ffe27a'; g.strokeRect(r.x * TILE + 1.5, r.y * TILE + 1.5, TILE - 3, TILE - 3); }
    for (const r of World.rooms) if (!r.held) Render.room(r, t);

    const inn = Jobs.room('in'), n = Derive.inboxList().length; for (let i = 0; i < n; i++) { const x = inn.x * TILE + 3 + (i % 4) * 5, y = inn.y * TILE + 26 + Math.floor(i / 4) * 5; Render.rect('#2b1d2c', x - 1, y - 1, 5, 5); Render.rect('#e9e2cc', x, y, 3, 3); }
    if (n >= World.S.inboxCap - DATA.inbox.warnBefore) { g.strokeStyle = Math.sin(t * 12) > 0 ? '#ff5a5a' : '#ffb0a0'; g.lineWidth = 2; g.strokeRect(inn.x * TILE + 1, inn.y * TILE + 1, TILE - 2, TILE - 2); g.lineWidth = 1; }
    for (const r of World.rooms) r.queue.forEach((c, i) => { if (i > 0) c.x += ((Math.floor(c.x / TILE) * TILE + 12 - i * 3) - c.x) * .15; });
    for (const c of [...World.crew].sort((a, b) => a.y - b.y)) Render.crew(c, t);
    Render.fx(t);
    if (Edit.held && Path.inb(hx, hy)) Render.room({ ...Edit.held, x: hx, y: hy }, t, true);
  },
};

// ═════════ 화면(HTML) ═════════
// 읽어야 하는 정보는 모두 HTML 글자로: 목표 카드, 주문 카드, 조립실 진행판, 분업판, 꼬물이 목록, 툴팁, 방송 띠, 하루 보고.
const $ = id => document.getElementById(id);
const tagCls = { inspired: ' ins', hallucinated: ' hal' };
const chip = (p, filled = true, tag) => `<i class="chip${filled ? '' : ' empty'}${tagCls[tag] || ''}" style="--c:${DATA.parts[p].col}">${DATA.parts[p].ch}</i>`;
const recipeChips = r => Object.entries(DATA.recipes[r].parts).map(([p, n]) => Array.from({ length: n }, () => chip(p)).join('')).join('');
const quirkTag = q => `<i class="qt" style="--c:${DATA.quirks[q].col}">${DATA.quirks[q].short}</i>`;
const UI = {
  // 방송 띠: 최근 몇 줄을 쌓아 보여 준다(단골 반응, 사고, 명작)
  log(s, cls = '') { World.log.unshift({ s, cls }); World.log.length = Math.min(World.log.length, 5); $('ticker').innerHTML = World.log.map((l, i) => `<div class="${l.cls}${i ? ' old' : ''}">${l.s}</div>`).join(''); },

    else if (r) {

      if (r.kind === 'asm') html += `<br>맡은 주문 ${r.slots.length}/${Derive.slotsOf(r)} · ${DATA.prioModes[r.prio]}${r.reject.size ? `<br>안 받음: ${[...r.reject].map(x => DATA.recipes[x].n).join(', ')}` : ''}`;
      if (r.kind === 'qa') html += `<br>줄이 ${DATA.qa.skipQueue}마리 넘으면 건너뛰고 그냥 보낸다`;
      if (!k.fixed && r.lv < DATA.stack.maxLv) html += `<br><i>같은 방을 위에 놓으면 Lv.${r.lv + 1}</i>`;

  openPop(r) {
    const p = $('pop'), k = DATA.rooms[r.kind];
    let body = `<i>${k.d}</i>`;
    if (r.kind === 'asm') body += `<div>먼저 만들 주문</div><div class="row"><button type="button" data-a="prio" class="on">${DATA.prioModes[r.prio]}</button></div><div>받을 주문 <i>(끄면 이 조립실은 그 주문을 안 받음)</i></div><div class="row">${World.S.recipes.map(x => `<button type="button" data-r="${x}" class="${r.reject.has(x) ? '' : 'on'}">${DATA.recipes[x].n}</button>`).join('')}</div>`;
    p.innerHTML = `<b>${k.n}${r.lv > 1 ? ' Lv.' + r.lv : ''}</b>${body}<div class="row">${k.fixed ? '<i>고정된 칸</i>' : '<button type="button" data-a="move">옮기기</button>'}<button type="button" data-a="close">닫기</button></div>`;
    p.style.left = Math.min(62, (r.x * TILE + TILE) / W * 100) + '%'; p.style.top = Math.min(45, r.y * TILE / H * 100) + '%'; p.hidden = false;
    p.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { Edit.toggleReject(r, b.dataset.r); UI.openPop(r); });
    p.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { const a = b.dataset.a; if (a === 'move') Edit.lift(r); else if (a === 'prio') { Edit.cyclePrio(r); UI.openPop(r); } else UI.closePop(); });
  },
  closePop() { $('pop').hidden = true; },
  report(m, y, b, diag, pick) {
    const fmt = { done: v => v + '개', master: v => v + '개', avg: v => v.toFixed(1) + '초', trust: v => Math.round(v * 100) + '%', cost: v => v };
    const better = { done: (a, b) => a > b, master: (a, b) => a > b, avg: (a, b) => a < b, trust: (a, b) => a > b, cost: (a, b) => a < b };
    const rowsDef = [['done', '처리한 주문'], ['master', '그중 ★명작'], ['avg', '평균 걸린 시간 (속도)'], ['trust', '신뢰도 (무사고율)'], ['cost', '유지비 (길 + 방 Lv.1 3 · Lv.2 4)']];
    const cell = (v, f) => v == null ? '-' : f(v);
    const rows = rowsDef.map(([k, n]) => { const v = m[k], yv = y && y[k]; const arrow = v == null || yv == null || v === yv ? '' : better[k](v, yv) ? ' <span class="up">▲</span>' : ' <span class="down">▼</span>'; return `<tr><td>${n}</td><td>${cell(v, fmt[k])}${arrow}</td><td>${y ? cell(yv, fmt[k]) : '-'}</td><td>${b ? cell(b[k], fmt[k]) : '-'}</td></tr>`; }).join('');
    const bonus = m.perfect ? `<p class="good">오늘 환각 사고 0건. ${DATA.text.perfect(DATA.perfect.roads)} (내일 지급)</p>` : m.oops ? `<p class="bad">환각 사고 ${m.oops}건 → 무사고 보너스 없음</p>` : '';
    $('rep').innerHTML = `<h2>${World.S.day}일째 보고</h2><table><tr><th>지표</th><th>오늘</th><th>어제</th><th>최고</th></tr>${rows}<tr><td>놓친 주문</td><td>${m.lost}</td><td>${y ? y.lost : '-'}</td><td></td></tr></table>
      ${bonus}<p class="diag">${diag}</p><p>하나를 고르세요 (1, 2). 강한 카드일수록 길이 적게 옵니다.</p>
      <div class="cards">${pick.map((c, i) => `<button type="button" class="card" data-i="${i}"><b>${i + 1}. ${c.n}</b><i>${c.d || (c.room ? '방 하나. 같은 방 위에 놓으면 Lv.2로 증축' : '길을 넉넉히')}</i></button>`).join('')}</div>`;
    $('repOv').hidden = false; $('rep').querySelectorAll('.card').forEach(bt => bt.onclick = () => Flow.choose(pick[+bt.dataset.i]));
  },
  hideReport() { $('repOv').hidden = true; },
};

// ═════════ 입력, 루프, 확인용 봇 ═════════
const Main = {
  cv: null,
  toTile(e) { const r = Main.cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * G.w), Math.floor((e.clientY - r.top) / r.height * G.h)]; },
  bind() {
    const cv = Main.cv;
    cv.addEventListener('pointermove', e => {
      Edit.hover = Main.toTile(e); if (Edit.dragging) Edit.paint(...Edit.hover);
      const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
      if (Edit.tool === 'sel' && !Edit.held) UI.tooltip(fx * W, fy * H, fx * 100, fy * 100); else $('tip').hidden = true;
    });
    cv.addEventListener('pointerleave', () => { $('tip').hidden = true; });
    cv.addEventListener('pointerdown', e => {
      if (e.button === 2) return; const [x, y] = Edit.hover = Main.toTile(e);
      if (Edit.held) { Edit.drop(x, y); return; }
      if (Edit.tool !== 'sel') { Edit.dragging = true; cv.setPointerCapture(e.pointerId); Edit.paint(x, y); return; }
      // 꼬물이를 누르면 한 번 누르기(꿀밤·칭찬). 손이 쉬는 중이면 그 칸의 방 설정을 연다
      const b = cv.getBoundingClientRect(), c = Crew.at((e.clientX - b.left) / b.width * W, (e.clientY - b.top) / b.height * H);
      if (c && Edit.poke(c)) { UI.closePop(); return; }
      const r = Path.roomAt(x, y); if (r) UI.openPop(r); else UI.closePop();
    });
    addEventListener('pointerup', () => { Edit.dragging = false; });
    cv.addEventListener('contextmenu', e => { e.preventDefault(); Edit.cancel(); UI.closePop(); });
    addEventListener('keydown', e => {
      if (!$('repOv').hidden) { if (e.key === '1' || e.key === '2') { const c = Flow.pick[+e.key - 1]; if (c) Flow.choose(c); } return; }
      const k = e.key.toLowerCase(), S = World.S;
      if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; UI.tools(); }
      else if (k === 'r' || k === 'ㄱ') Edit.setTool(Edit.tool === 'road' ? 'sel' : 'road');
      else if (k === 'e' || k === 'ㄷ') Edit.setTool(Edit.tool === 'erase' ? 'sel' : 'erase');
      else if (k === 's' || k === 'ㄴ') Edit.setTool('sel');
      else if (k === 'f' || k === 'ㄹ') Main.cycleSpeed();
      else if (e.key === 'Escape') { Edit.cancel(); UI.closePop(); Edit.setTool('sel'); }
    });
    $('tSel').onclick = () => Edit.setTool('sel'); $('tRoad').onclick = () => Edit.setTool('road'); $('tErase').onclick = () => Edit.setTool('erase');
    $('tPause').onclick = () => { World.S.paused = !World.S.paused; UI.tools(); }; $('tSpeed').onclick = Main.cycleSpeed;
  },
  cycleSpeed() { const sp = DATA.speeds, S = World.S; S.speed = sp[(sp.indexOf(S.speed) + 1) % sp.length]; UI.tools(); },
  last: 0, uiT: 0,
  loop(now) {
    const dt = Math.min(0.1, (now - Main.last) / 1000); Main.last = now;
    for (let k = 0; k < World.S.speed; k++) Flow.step(dt);
    Render.frame(now / 1000);
    Main.uiT -= dt; if (Main.uiT <= 0) { Main.uiT = 0.2; UI.overlays(); UI.crewList(); UI.goal(); if (Teams.mode === 'auto') UI.crewPanel(); }
    UI.hud(); requestAnimationFrame(Main.loop);
  },
  start() {
    setupWorld(); Main.cv = $('cv'); Render.init(Main.cv); Main.bind();
    UI.tools(); UI.recipes(); UI.crewPanel(); UI.goal();
    const [ra, rb] = DATA.day.rush, rz = $('daybar').querySelector('.rushz'); rz.style.left = ra / DATA.day.length * 100 + '%'; rz.style.width = (rb - ra) / DATA.day.length * 100 + '%';
    Main.last = performance.now(); requestAnimationFrame(Main.loop);
  },
};
// 확인용 봇: __sim(초, 옵션) — 카드는 card번(기본 0), 새 방은 stack이면 같은 방 위로 증축, 아니면 가운데 길 위·아래 빈 칸.
// 옵션: mode(분업), quirks(모든 꼬물이 기질 덮어쓰기), pin({quirk, role}: 그 기질을 그 역할로 고정), poke(손이 쉬면 !환각 든 애에게 꿀밤)
window.__sim = (sec, o = {}) => {
  if (o.mode && Teams.mode !== o.mode) Teams.setMode(o.mode);
  const fixQuirks = () => { if (o.quirks) World.crew.forEach((c, i) => c.quirk = o.quirks[i % o.quirks.length]); if (o.pin) for (const c of World.crew) if (c.quirk === o.pin.quirk && !c.pinned) { c.pinned = true; c.role = o.pin.role; } Teams.apply(); };
  fixQuirks();
  const dt = 0.1, out = []; let stuckMax = 0, idleMax = 0, frozen = 0;
  const pos = new Map();
  for (let k = 0; k < sec / dt; k++) {
    Flow.step(dt);
    stuckMax = Math.max(stuckMax, World.crew.filter(c => c.st === 'stuck').length);
    if (Derive.inboxList().length >= World.S.inboxCap - 1) idleMax = Math.max(idleMax, World.crew.filter(c => c.st === 'idle').length);
    // 교착 감시: 일감을 쥔 채 20초 넘게 같은 상태·같은 자리에 있는 꼬물이(줄 서기 제외)
    for (const c of World.crew) { const key = `${c.st}|${Math.round(c.x)}|${Math.round(c.y)}|${c.act && c.act.what}`, p = pos.get(c) || { key, t: 0 }; p.t = p.key === key && c.job && c.st !== 'queue' ? p.t + dt : 0; p.key = key; pos.set(c, p); if (p.t > 20) frozen++; }
    if (o.poke && World.S.pokeCd <= 0) { const c = World.crew.find(c => c.carry && (c.carry.tag === 'hallucinated' || (c.carry.result && c.carry.result.tag === 'hallucinated'))); if (c) Edit.poke(c); }
    if (!$('repOv').hidden) {
      const m = World.S.yday, d = World.day;
      const row = { day: World.S.day, done: m.done, master: m.master, avg: m.avg == null ? null : +m.avg.toFixed(1), trust: m.trust == null ? null : Math.round(m.trust * 100), cost: m.cost, lost: m.lost, oops: m.oops, goal: World.S.goal, crew: World.crew.length,
        made: { ...d.made }, madeBy: JSON.parse(JSON.stringify(d.madeBy)), qa: { ...d.qa }, knock: d.knock, halBy: { ...d.halBy }, coffee: d.coffee, chats: d.chats, stuckMax, idleWhenFull: idleMax, frozen, roles: { ...Teams.counts }, lv2: World.rooms.filter(r => r.lv > 1).map(r => r.kind).join(',') };
      row.card = Flow.pick[o.card || 0].n; out.push(row); stuckMax = idleMax = frozen = 0; Flow.choose(Flow.pick[o.card || 0]); fixQuirks();
    }
    while (Edit.held) {
      let ok = false;
      if (o.stack) { const t = World.rooms.find(r => !r.held && r.kind === Edit.held.kind && Edit.stackTarget(r.x, r.y)); if (t) ok = Edit.drop(t.x, t.y); }
      for (let d = 0; d < G.w && !ok; d++) for (const x of [7 + d, 7 - d]) for (const y of [3, 5]) if (!ok && x > 0 && x < G.w - 1 && Edit.canPlace(x, y) && !Edit.stackTarget(x, y)) ok = Edit.drop(x, y);
      if (!ok) break;
    }
  }
  return out;
};
