<title>꼬물이 에이전트 회사</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: "Galmuri11"; src: url(data:font/woff2;base64,__FONT__) format("woff2"); font-display: block; }
/* 타일 격자 회로판: 위 상태 줄, 가운데 판(16×9칸), 아래 도구·방송·하루 보고. 방 이름과 설정 창은 판 위 HTML. */
:root {
  --bg: #12101a; --panel: #1c1928; --line: #363049; --fg: #ece6f5; --dim: #9a93ad;
  --acc: #7fe0d0; --warm: #f2b46d; --hot: #ff6a5a; --paper: #e9e2cc; --ink: #2a2338; --inkdim: #6b6258;
  --f: "Galmuri11", "Apple SD Gothic Neo", "Malgun Gothic", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 13px/1.5 var(--f); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 24px; -webkit-font-smoothing: none; }
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.wrap { max-width: 1000px; margin: 0 auto; display: grid; gap: 8px; }
header { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 6px 16px; }
h1 { margin: 0; font-size: 20px; font-weight: 400; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-variant-numeric: tabular-nums; }
.stats span { color: var(--dim); }
.stats b { color: var(--acc); font-weight: 400; }
.stats .mood { color: var(--warm); }
.daybar { height: 4px; background: var(--panel); }
.daybar i { display: block; height: 100%; background: var(--acc); width: 0; }
.screen { position: relative; border: 2px solid var(--line); background: #000; aspect-ratio: 16 / 9; max-width: 100%; }
.screen canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; }
.labels { position: absolute; inset: 0; pointer-events: none; }
.lab { position: absolute; transform: translate(-50%, 0); font-size: 10px; color: #fff; text-shadow: 1px 1px 0 #000, -1px 0 0 #000, 0 -1px 0 #000; white-space: nowrap; line-height: 1.1; }
.badge { position: absolute; transform: translate(-50%, -100%); background: var(--hot); color: #fff; font-size: 10px; padding: 0 4px; white-space: nowrap; }
.badge.q { background: var(--warm); color: var(--ink); }
.mode { position: absolute; left: 50%; top: 4px; transform: translateX(-50%); background: var(--warm); color: var(--ink); padding: 0 10px; font-size: 12px; pointer-events: none; white-space: nowrap; }
.pop { position: absolute; background: var(--paper); color: var(--ink); padding: 8px 10px; font-size: 12px; display: grid; gap: 6px; z-index: 5; min-width: 160px; box-shadow: 0 4px 0 rgba(0,0,0,.4); }
.pop b { font-weight: 400; font-size: 13px; }
.pop .row { display: flex; flex-wrap: wrap; gap: 4px; }
.pop button { background: #d9d0b4; border: 1px solid var(--inkdim); padding: 1px 6px; cursor: pointer; color: var(--ink); }
.pop button.on { background: var(--ink); color: var(--paper); }
.pop i { font-style: normal; color: var(--inkdim); }
.tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tools button { background: var(--panel); border: 1px solid var(--line); padding: 3px 10px; cursor: pointer; color: var(--dim); }
.tools button.on { border-color: var(--acc); color: var(--fg); }
.tools kbd { font: inherit; color: var(--fg); border: 1px solid var(--line); padding: 0 4px; margin-right: 4px; }
.tools .inv { color: var(--dim); font-size: 12px; margin-left: auto; }
.tools .inv b { color: var(--fg); font-weight: 400; }
.ticker { background: var(--panel); border: 1px solid var(--line); padding: 4px 10px; white-space: nowrap; overflow: hidden; color: var(--dim); }
.ticker b { color: var(--fg); font-weight: 400; }
.legend { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px; vertical-align: -1px; border: 1px solid #000; }
.ov { position: fixed; inset: 0; background: rgba(10,8,18,.8); display: grid; place-items: center; z-index: 20; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); }
.report { background: var(--paper); color: var(--ink); width: min(560px, 100%); padding: 14px 18px; display: grid; gap: 6px; max-height: 100%; overflow: auto; }
.report h2 { margin: 0; font-size: 18px; font-weight: 400; }
.report .row { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--inkdim); font-variant-numeric: tabular-nums; }
.report p { margin: 0; color: var(--inkdim); }
.report .diag { color: var(--ink); background: #fff3d0; padding: 6px 8px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }
.card { text-align: left; background: #d9d0b4; border: 2px solid var(--ink); padding: 8px 10px; cursor: pointer; color: var(--ink); display: grid; gap: 2px; }
.card:hover { background: #fff6dc; }
.card b { font-weight: 400; font-size: 14px; }
.card i { font-style: normal; font-size: 12px; color: var(--inkdim); }
.help { font-size: 12px; color: var(--dim); margin: 0; max-width: 84ch; }
@media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
</style>

<div class="wrap">
  <header>
    <h1>꼬물이 에이전트 회사</h1>
    <div class="stats"><span id="day">1일째</span><span>처리 <b id="done">0</b></span><span class="mood" id="mood">인간 기분 70</span></div>
  </header>
  <div class="daybar"><i id="dayFill"></i></div>
  <div class="screen" id="screen"><canvas id="cv" width="384" height="216"></canvas><div class="labels" id="labels"></div><div class="mode" id="mode" hidden></div><div class="pop" id="pop" hidden></div></div>
  <div class="tools">
    <button type="button" id="tSel" class="on"><kbd>S</kbd>고르기</button>
    <button type="button" id="tRoad"><kbd>R</kbd>길 깔기</button>
    <button type="button" id="tErase"><kbd>E</kbd>길 지우기</button>
    <button type="button" id="tPause"><kbd>Space</kbd>멈춤</button>
    <span class="inv" id="inv"></span>
  </div>
  <div class="ticker" id="ticker"><b>인간</b> 컴퓨터 앞에 앉았다.</div>
  <div class="legend" id="legend"></div>
  <p class="help">꼬물이는 <b>길</b> 위로만 다닙니다. 인간의 요청은 처음엔 무슨 일인지 모르는 회색 꾸러미로 접수함에 쌓이고, <b>분류대</b>를 거쳐야 종류(색)가 정해집니다. 그 뒤 종류마다 정해진 방을 차례로 돌고 발송구로 나갑니다. 방을 누르면 그 방이 받을 요청 종류를 고르거나 옮길 수 있습니다. 하루는 1분이고, 끝나면 가장 막힌 곳을 알려 주고 카드 두 장 중 하나를 고릅니다.</p>
</div>
<div class="ov" id="repOv" hidden><div class="report" role="dialog" aria-label="하루 보고" id="rep"></div></div>

<script>
'use strict';
// ───────── 표 ─────────
const T = 24, GW = 16, GH = 9, W = GW * T, H = GH * T, DAY = 60;
const KINDS = {
  in:     { n: '접수함', col: '#3e5878', top: '#8ac8ff', work: 0 },
  out:    { n: '발송구', col: '#335a4c', top: '#7fe0d0', work: 0 },
  sort:   { n: '분류대', col: '#4a4466', top: '#c8b8ff', work: 0.8 },
  search: { n: '검색실', col: '#34406a', top: '#9ab0ff', work: 2.0 },
  write:  { n: '작성실', col: '#5e5032', top: '#ffd38a', work: 2.4 },
  draw:   { n: '그림실', col: '#5e3450', top: '#ff9ad0', work: 3.0 },
  calc:   { n: '계산실', col: '#545228', top: '#f0e070', work: 2.0 },
  qa:     { n: '검수대', col: '#583434', top: '#ff8a7a', work: 1.1 },
};
const REQ = {
  ask:    { n: '질문', col: '#8ac8ff', route: ['search', 'write', 'qa'], day: 1, say: ['"이거 왜 안 돼?"', '"점심 뭐 먹지"', '"이메일 좀 다듬어 줘"', '"이 단어 뜻이 뭐야"'] },
  pic:    { n: '그림', col: '#ff9ad0', route: ['search', 'draw', 'qa'], day: 2, say: ['"고양이 그려 줘"', '"발표 표지 만들어 줘"', '"이 사진 배경 지워 줘"'] },
  num:    { n: '계산', col: '#f0e070', route: ['calc', 'qa'], day: 3, say: ['"이번 달 가계부 정리"', '"더치페이 계산해 줘"', '"이 표 합계 내 줘"'] },
  report: { n: '보고서', col: '#8fe0a0', route: ['search', 'calc', 'write', 'qa'], day: 4, say: ['"내일까지 보고서..."', '"시장 조사 좀 해 줘"', '"회의 자료 만들어 줘"'] },
};
const NEWROOM = { 2: 'draw', 3: 'calc' };
const NAMES = ['꼬미', '물이', '삑이', '도리', '콩이', '비트', '바이', '클로', '모리', '찌리', '토리', '나노', '포포', '두두'];
const TINTS = ['#f2b46d', '#9fd88a', '#8ac8ff', '#f2a0c8', '#e8d870', '#c8a8ff', '#ff9a6a', '#7fe0d0', '#f4f1ff', '#d8b890', '#b0e0ff', '#ffc0a0', '#a0f0c0', '#ffb0d8'];

// ───────── 상태 ─────────
const S = { day: 1, t: 0, done: 0, mood: 70, qaFail: 0.2, walk: 1, inboxCap: 10, roads: 0, paused: false, inDay: true };
const road = new Uint8Array(GW * GH);       // 1 = 길
let sts = [], crew = [], inbox = [], fx = [], uid = 0, dayStat = newDayStat();
function newDayStat() { return { done: 0, wait: 0, fails: 0, overflow: 0, qwait: {}, stuck: {} }; }
const at = (x, y) => sts.find(s => !s.held && s.x === x && s.y === y);
const inb = (x, y) => x >= 0 && y >= 0 && x < GW && y < GH;
function addSt(kind, x, y) { const s = { id: uid++, kind, x, y, busy: null, queue: [], accept: null, fixed: kind === 'in' || kind === 'out' }; sts.push(s); return s; }
// 처음 판: 가운데 길 한 줄과 방 몇 개(모두 옮길 수 있음)
addSt('in', 0, 4); addSt('out', 15, 4);
for (let x = 1; x <= 14; x++) road[4 * GW + x] = 1;
addSt('sort', 2, 3); addSt('search', 5, 3); addSt('write', 8, 5); addSt('qa', 11, 3);
S.roads = 30 - 14;
function addCrew() { const i = crew.length; crew.push({ i, name: NAMES[i % NAMES.length], tint: TINTS[i % TINTS.length], x: (2 + i % 10) * T + 12, y: 4 * T + 18, path: [], fin: null, st: 'idle', tk: null, s: null, wt: 0, face: 1, ph: Math.random() * 6, idleT: Math.random() * 2, bub: '' }); }
for (let k = 0; k < 6; k++) addCrew();

// ───────── 길 찾기: 길 칸만 지나고, 마지막 한 칸(방)에만 들어간다 ─────────
function bfs(sx, sy, tx, ty) {
  if (sx === tx && sy === ty) return [];
  const prev = new Int16Array(GW * GH).fill(-1), s0 = sy * GW + sx, goal = ty * GW + tx, q = [s0]; prev[s0] = s0;
  for (let h = 0; h < q.length; h++) {
    const c = q[h], cx = c % GW, cy = (c / GW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy; if (!inb(nx, ny)) continue; const n = ny * GW + nx;
      if (prev[n] >= 0) continue; if (n !== goal && !road[n]) continue; prev[n] = c;
      if (n === goal) { const out = []; let k = n; while (k !== s0) { out.push([k % GW, (k / GW) | 0]); k = prev[k]; } return out.reverse(); }
      q.push(n);
    }
  }
  return null;
}
const tileOf = c => [Math.max(0, Math.min(GW - 1, Math.floor(c.x / T))), Math.max(0, Math.min(GH - 1, Math.floor((c.y - 6) / T)))];
const center = (x, y) => [x * T + 12, y * T + 18];
const accepts = (s, type) => !s.accept || !type || s.accept.has(type);
function route(c, s) { const [sx, sy] = tileOf(c); const p = bfs(sx, sy, s.x, s.y); if (!p) return false; c.fin = p.pop() || [s.x, s.y]; c.path = p; c.s = s; return true; }
function pickSt(c, kind) {
  const [sx, sy] = tileOf(c); let best = null, bs = 1e9;
  for (const s of sts) if (!s.held && s.kind === kind && accepts(s, c.tk && c.tk.type)) { const p = bfs(sx, sy, s.x, s.y); if (!p) continue; const sc = p.length / (2.6 * S.walk) + (s.queue.length + (s.busy ? 1 : 0)) * KINDS[kind].work; if (sc < bs) { bs = sc; best = s; } }
  return best;
}

// ───────── 일의 흐름 ─────────
function nextKind(tk) { if (!tk.type) return 'sort'; const r = REQ[tk.type].route; return tk.step < r.length ? r[tk.step] : 'out'; }
function goNext(c) {
  const kind = nextKind(c.tk), s = pickSt(c, kind);
  if (!s) { c.st = 'stuck'; c.need = kind; c.bub = '?'; dayStat.stuck[kind] = (dayStat.stuck[kind] || 0) + 1; if (Math.random() < 0.3) ticker(`<b>${c.name}</b> ${KINDS[kind].n}로 가는 길이 없어요.`); return; }
  c.bub = ''; c.st = 'walk'; route(c, s);
}
// 방 바로 앞 길 칸에 도착: 방이 비면 들어가고, 아니면 그 자리에서 줄
function atDoor(c) {
  const s = c.s;
  if (!s || s.held) { c.st = c.tk ? 'stuck' : 'idle'; c.need = c.tk ? nextKind(c.tk) : null; return; }
  if (s.kind === 'in') { const tk = inbox.find(t => t.by === c); if (!tk) { c.st = 'idle'; return; } inbox.splice(inbox.indexOf(tk), 1); c.tk = tk; c.path = [c.fin]; c.st = 'enter'; return; }
  if (s.kind === 'out') { c.path = [c.fin]; c.st = 'enter'; return; }
  if (!s.busy) { s.busy = c; c.path = [c.fin]; c.st = 'enter'; }
  else { if (!s.queue.includes(c)) s.queue.push(c); c.st = 'queue'; }
}
function inside(c) {
  const s = c.s;
  if (s.kind === 'in') { c.path = []; c.st = 'leave'; c.after = 'next'; return; }
  if (s.kind === 'out') { deliver(c); return; }
  c.st = 'work'; c.wt = KINDS[s.kind].work;
}
function finish(c) {
  const s = c.s, tk = c.tk; s.busy = null;
  if (s.kind === 'sort') { tk.type = tk.hidden; fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .6, col: REQ[tk.type].col }); }
  else if (s.kind === 'qa' && Math.random() < S.qaFail) { tk.step = Math.max(0, tk.step - 1); dayStat.fails++; fx.push({ k: 'x', x: c.x, y: c.y - 20, t: 0, life: 1 }); }
  else tk.step++;
  if (s.queue.length) { const n = s.queue.shift(); s.busy = n; n.path = [n.fin]; n.st = 'enter'; }
  goNext(c);
}
function deliver(c) {
  const tk = c.tk, wait = S.t - tk.t0;
  S.done++; dayStat.done++; dayStat.wait += wait;
  S.mood = Math.max(0, Math.min(100, S.mood + (wait < 18 ? 1.2 : wait < 32 ? 0.2 : -1.5)));
  fx.push({ k: 'pop', x: c.x, y: c.y - 20, t: 0, life: .8, col: REQ[tk.type].col });
  c.tk = null; c.s = null; c.st = 'idle'; c.idleT = 0;
}
function stepCrew(c, dt) {
  c.ph += dt;
  if (c.st === 'queue') { dayStat.qwait[c.s.kind] = (dayStat.qwait[c.s.kind] || 0) + dt; return; }
  if (c.path.length) {
    const [tx, ty] = c.path[0], [px, py] = center(tx, ty), dx = px - c.x, dy = py - c.y, d = Math.hypot(dx, dy), v = 62 * S.walk * dt;
    if (Math.abs(dx) > .5) c.face = dx > 0 ? 1 : -1;
    if (d <= v) { c.x = px; c.y = py; c.path.shift(); if (!c.path.length) { if (c.st === 'walk') atDoor(c); else if (c.st === 'enter') inside(c); } }
    else { c.x += dx / d * v; c.y += dy / d * v; }
    return;
  }
  if (c.st === 'walk') { atDoor(c); return; }
  if (c.st === 'enter') { inside(c); return; }
  if (c.st === 'leave') { goNext(c); return; }
  if (c.st === 'work') { c.wt -= dt; if (Math.random() < dt * 4) fx.push({ k: 'spark', x: c.x + (Math.random() - .5) * 12, y: c.y - 16, t: 0, life: .4, col: KINDS[c.s.kind].top }); if (c.wt <= 0) finish(c); return; }
  if (c.st === 'stuck') { const s = pickSt(c, c.need); if (s) { c.bub = ''; c.st = 'walk'; route(c, s); } return; }
  if (c.st === 'idle') {
    const tk = inbox.find(t => !t.by), inn = sts.find(s => s.kind === 'in');
    if (tk) { const [sx, sy] = tileOf(c); if (bfs(sx, sy, inn.x, inn.y)) { tk.by = c; c.st = 'walk'; route(c, inn); return; } }
    c.idleT -= dt;
    if (c.idleT <= 0) { c.idleT = 1.5 + Math.random() * 3; const [sx, sy] = tileOf(c); const opts = []; for (let dy = -2; dy <= 2; dy++) for (let dx = -3; dx <= 3; dx++) if (inb(sx + dx, sy + dy) && road[(sy + dy) * GW + sx + dx]) opts.push([sx + dx, sy + dy]); if (opts.length) { const o = opts[Math.floor(Math.random() * opts.length)]; c.path = bfs(sx, sy, o[0], o[1]) || []; } }
  }
}
// 판이 바뀌면(길, 방) 가던 꼬물이는 길을 다시 찾는다
function replan() {
  for (const c of crew) {
    const [sx, sy] = tileOf(c);
    if (!road[sy * GW + sx] && !at(sx, sy)) { const f = nearestRoad(sx, sy); if (f) { [c.x, c.y] = center(f[0], f[1]); } }
    if (c.st === 'walk' && c.s) { if (c.s.held || !route(c, c.s)) { c.st = c.tk ? 'stuck' : 'idle'; c.need = c.tk ? nextKind(c.tk) : null; c.path = []; } }
    else if (c.st === 'idle') c.path = [];
  }
}
function nearestRoad(x, y) { for (let r = 1; r < 8; r++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) if (inb(x + dx, y + dy) && road[(y + dy) * GW + x + dx]) return [x + dx, y + dy]; return null; }
function release(s) { // 방을 들면 거기서 일하거나 줄 서던 꼬물이는 다른 곳을 찾는다
  for (const c of crew) if (c.s === s && ['work', 'queue', 'enter', 'walk'].includes(c.st)) { const [sx, sy] = tileOf(c); if (c.st === 'work' || c.st === 'enter') { const f = nearestRoad(sx, sy); if (f) [c.x, c.y] = center(f[0], f[1]); } c.path = []; c.st = c.tk ? 'stuck' : 'idle'; c.need = c.tk ? nextKind(c.tk) : null; }
  s.busy = null; s.queue = [];
}

// 도착
let arrAcc = 0;
const typesNow = () => Object.keys(REQ).filter(k => REQ[k].day <= S.day);
function rate() { const ph = (S.t % DAY) / DAY; return (0.3 + 0.09 * (S.day - 1)) * (0.85 + 0.3 * Math.sin(ph * Math.PI * 2 - 1)); }
function spawn() {
  const ty = typesNow(), hidden = ty[Math.floor(Math.random() * ty.length)];
  if (inbox.length >= S.inboxCap) { S.mood = Math.max(0, S.mood - 2); dayStat.overflow++; if (Math.random() < 0.4) ticker('<b>인간</b> 대답이 없자 다른 탭을 열었다.'); return; }
  inbox.push({ hidden, type: null, t0: S.t, step: 0, by: null });
  if (Math.random() < 0.4) { const s = REQ[hidden].say; ticker(`<b>인간</b> ${s[Math.floor(Math.random() * s.length)]}`); }
}

// ───────── 하루 끝 ─────────
const CARDS = [
  { n: '길 10칸', d: '깔 수 있는 길이 늘어난다.', f: () => { S.roads += 10; } },
  { n: '꼬물이 둘', d: '일손이 늘어난다. 대신 길이 붐빈다.', f: () => { addCrew(); addCrew(); } },
  { n: '검수 교육', d: '검수에서 틀리는 일이 40% 줄어든다.', f: () => { S.qaFail *= 0.6; } },
  { n: '작은 운동화', d: '모두 30% 빨리 걷는다.', f: () => { S.walk *= 1.3; } },

  { n: '검수대 하나 더', d: '확인 줄이 짧아진다.', st: 'qa' },
  { n: '그림실 하나 더', d: '그리기 일을 나눠 맡는다.', st: 'draw', need: 2 },
  { n: '계산실 하나 더', d: '계산 일을 나눠 맡는다.', st: 'calc', need: 3 },

let pick = [];
function endDay() {

  if (stuck) diag += `<br>길이 없어 헤맨 일: <b>${KINDS[stuck[0]].n}</b>로 가는 길 ${stuck[1]}번`;

    <div class="row"><span>처리한 요청</span><span>${dayStat.done}개</span></div>

    <div class="row"><span>검수에서 되돌아감</span><span>${dayStat.fails}번</span></div>

}
let toPlace = [];
function choose(c) {

}
function nextPlace() { if (held || !toPlace.length) return; const k = toPlace.shift(); held = addSt(k, -5, -5); held.held = true; held.from = null; setTool('sel'); ticker(`새 <b>${KINDS[k].n}</b>: 길 옆 빈 칸을 누르세요.`); }

// ───────── 편집: 고르기 / 길 깔기 / 길 지우기 / 방 들기 ─────────
let tool = 'sel', held = null, hover = [0, 0], dragging = false, popSt = null;

function paint(x, y) {

}
const canPlace = (x, y) => inb(x, y) && !road[y * GW + x] && !at(x, y);
function drop(x, y) { if (!canPlace(x, y)) return false; held.x = x; held.y = y; held.held = false; const s = held; held = null; replan(); if (!hasRoadNext(s)) ticker(`<b>${KINDS[s.kind].n}</b> 옆에 길이 없어요. 길을 이어 주세요.`); nextPlace(); return true; }
const hasRoadNext = s => [[1, 0], [-1, 0], [0, 1], [0, -1]].some(([dx, dy]) => inb(s.x + dx, s.y + dy) && road[(s.y + dy) * GW + s.x + dx]);
function lift(s) { release(s); held = s; held.from = [s.x, s.y]; s.held = true; closePop(); replan(); }
function cancelHold() { if (held && held.from) { held.x = held.from[0]; held.y = held.from[1]; held.held = false; held = null; replan(); nextPlace(); } }
function openPop(s) {
  popSt = s; const p = $('pop'), types = typesNow();
  const filt = s.kind === 'in' || s.kind === 'out' || s.kind === 'sort' ? '' : `<div>받을 요청 <i>(끄면 이 방은 그 요청을 안 받음)</i></div><div class="row">${types.filter(t => REQ[t].route.includes(s.kind)).map(t => `<button type="button" data-t="${t}" class="${accepts(s, t) ? 'on' : ''}">${REQ[t].n}</button>`).join('')}</div>`;
  p.innerHTML = `<b>${KINDS[s.kind].n}</b>${filt}<div class="row">${s.fixed ? '<i>고정된 칸</i>' : '<button type="button" data-a="move">옮기기</button>'}<button type="button" data-a="close">닫기</button></div>`;
  p.style.left = Math.min(70, (s.x * T + T) / W * 100) + '%'; p.style.top = Math.min(60, (s.y * T) / H * 100) + '%'; p.hidden = false;
  p.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t; if (!s.accept) s.accept = new Set(typesNow()); if (s.accept.has(t)) s.accept.delete(t); else s.accept.add(t); openPop(s); });
  p.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { if (b.dataset.a === 'move') lift(s); else closePop(); });
}
function closePop() { $('pop').hidden = true; popSt = null; }

// ───────── 한 틱 ─────────
function step(dt) {
  if (!S.inDay || S.paused) return;
  S.t += dt;
  arrAcc += dt * rate(); while (arrAcc >= 1) { arrAcc--; spawn(); }
  for (const c of crew) stepCrew(c, dt);
  for (const f of fx) f.t += dt; fx = fx.filter(f => f.t < f.life);
  if (S.t >= S.day * DAY) endDay();
}

// ───────── 그림 ─────────
const sprCache = {};
function critter(tint, frame) {
  const key = tint + frame; if (sprCache[key]) return sprCache[key];
  const s = 16, c = document.createElement('canvas'); c.width = s; c.height = s; const x = c.getContext('2d');
  const px = (a, b, col) => { x.fillStyle = col; x.fillRect(a, b, 1, 1); };
  const bot = 13, top = 3, cx = 7.5, rx = 6.4, ry = (bot - top) / 2 + 0.4, cy = top + ry - 0.4 + (frame ? 0.5 : 0);
  const ins = (i, j) => ((i - cx) / rx) ** 2 + ((j - cy) / ry) ** 2 <= 1;
  for (let j = 0; j < s; j++) for (let i = 0; i < s; i++) { if (!ins(i, j)) continue; const edge = !ins(i - 1, j) || !ins(i + 1, j) || !ins(i, j - 1) || !ins(i, j + 1); px(i, j, edge ? '#2b1d2c' : tint); if (!edge && j > cy + ry * 0.35) px(i, j, 'rgba(0,0,0,.18)'); if (!edge && i < cx - 1 && j < cy - ry * 0.35) px(i, j, 'rgba(255,255,255,.28)'); }
  const ey = Math.round(cy - 1); x.fillStyle = '#1b1420'; x.fillRect(4, ey, 2, 3); x.fillRect(10, ey, 2, 3);
  x.fillStyle = '#f08a7a'; x.fillRect(2, ey + 3, 1, 1); x.fillRect(13, ey + 3, 1, 1);
  x.fillStyle = '#2b1d2c'; x.fillRect(8 + (frame ? 1 : 0), 0, 1, 3); px(8 + (frame ? 1 : 0), 0, '#7fe0d0');
  x.fillRect(4, 14, 2, frame === 0 ? 1 : 2); x.fillRect(10, 14, 2, frame === 1 ? 1 : 2);
  return (sprCache[key] = c);
}
const cv = $id('cv'), ctx = cv.getContext('2d');
function $id(id) { return document.getElementById(id); }
function drawTile(x, y) { // 빈 칸: 타일 한 장씩 테두리가 보이게
  const px = x * T, py = y * T; ctx.fillStyle = (x + y) % 2 ? '#24203a' : '#27233e'; ctx.fillRect(px, py, T, T);
  ctx.fillStyle = '#1a1729'; ctx.fillRect(px, py + T - 1, T, 1); ctx.fillRect(px + T - 1, py, 1, T);
  ctx.fillStyle = 'rgba(255,255,255,.05)'; ctx.fillRect(px, py, T - 1, 1); ctx.fillRect(px, py, 1, T - 1);
}
function drawRoad(x, y) { // 길: 이웃 길·방으로 이음새가 붙는다
  const px = x * T, py = y * T, link = (dx, dy) => inb(x + dx, y + dy) && (road[(y + dy) * GW + x + dx] || at(x + dx, y + dy));
  ctx.fillStyle = '#3a3552'; ctx.fillRect(px + 6, py + 6, 12, 12);
  if (link(1, 0)) ctx.fillRect(px + 18, py + 6, 6, 12); if (link(-1, 0)) ctx.fillRect(px, py + 6, 6, 12);
  if (link(0, 1)) ctx.fillRect(px + 6, py + 18, 12, 6); if (link(0, -1)) ctx.fillRect(px + 6, py, 12, 6);
  ctx.fillStyle = 'rgba(127,224,208,.22)'; ctx.fillRect(px + 11, py + 11, 2, 2);
}
function drawSt(s, t, ghost) {
  const k = KINDS[s.kind], px = s.x * T, py = s.y * T; ctx.globalAlpha = ghost ? .55 : 1;
  ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(px + 2, py + 3, 21, 21);
  ctx.fillStyle = k.col; ctx.fillRect(px + 1, py + 1, 22, 21);
  ctx.fillStyle = k.top; ctx.fillRect(px + 1, py + 1, 22, 5);
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(px + 1, py + 6, 22, 1);
  // 작은 그림 기호
  const ix = px + 7, iy = py + 9; ctx.fillStyle = '#f4f1ff';
  if (s.kind === 'in') { ctx.fillRect(ix, iy + 2, 10, 7); ctx.fillStyle = k.col; ctx.fillRect(ix + 2, iy + 4, 6, 1); }
  else if (s.kind === 'out') { ctx.fillRect(ix + 1, iy, 8, 6); ctx.fillRect(ix + 4, iy + 6, 2, 2); ctx.fillRect(ix + 2, iy + 8, 6, 1); }
  else if (s.kind === 'sort') { ['#8ac8ff', '#ff9ad0', '#f0e070', '#8fe0a0'].forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(ix + (i % 2) * 5, iy + Math.floor(i / 2) * 5, 4, 4); }); }
  else if (s.kind === 'search') { ctx.fillRect(ix, iy, 6, 6); ctx.fillStyle = k.col; ctx.fillRect(ix + 1, iy + 1, 4, 4); ctx.fillStyle = '#f4f1ff'; ctx.fillRect(ix + 6, iy + 6, 3, 3); }
  else if (s.kind === 'write') { ctx.fillRect(ix, iy, 9, 10); ctx.fillStyle = k.col; for (let r = 0; r < 3; r++) ctx.fillRect(ix + 2, iy + 2 + r * 3, 5, 1); }

  if (s.accept && !ghost) { let i = 0; for (const tp of typesNow()) if (REQ[tp].route.includes(s.kind) && s.accept.has(tp)) { ctx.fillStyle = REQ[tp].col; ctx.fillRect(px + 3 + i * 4, py + 19, 3, 2); i++; } }
  if (s.busy && !ghost) { ctx.fillStyle = Math.sin(t * 10) > 0 ? k.top : '#fff'; ctx.fillRect(px + 19, py + 9, 2, 2); }
  ctx.globalAlpha = 1;
}
function drawTicket(tk, x, y) { ctx.fillStyle = '#2b1d2c'; ctx.fillRect(x - 3, y - 4, 7, 6); ctx.fillStyle = tk.type ? REQ[tk.type].col : '#9a93ad'; ctx.fillRect(x - 2, y - 3, 5, 4); if (!tk.type) { ctx.fillStyle = '#2b1d2c'; ctx.fillRect(x, y - 2, 1, 1); } }

    if (c.face < 0) { ctx.save(); ctx.translate(x + 16, y); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0); ctx.restore(); } else ctx.drawImage(img, x, y);
    if (c.tk) drawTicket(c.tk, Math.round(c.x), y - 1);
    if (c.bub) { ctx.fillStyle = '#fff'; ctx.fillRect(x + 11, y - 9, 7, 8); ctx.fillStyle = '#ff5a5a'; ctx.fillRect(x + 14, y - 8, 1, 4); ctx.fillRect(x + 14, y - 3, 1, 1); }
  }
  for (const f of fx) { const q = f.t / f.life; if (f.k === 'spark') { ctx.fillStyle = f.col; ctx.fillRect(Math.round(f.x), Math.round(f.y - q * 6), 1, 1); } else if (f.k === 'x') { ctx.fillStyle = '#ff5a5a'; const x = Math.round(f.x), y = Math.round(f.y - q * 6); for (let k = -2; k <= 2; k++) { ctx.fillRect(x + k, y + k, 1, 1); ctx.fillRect(x + k, y - k, 1, 1); } } else if (f.k === 'pop') { ctx.fillStyle = f.col; ctx.fillRect(Math.round(f.x - 1), Math.round(f.y - q * 10), 3, 3); } }
  if (held) { const [hx, hy] = hover; if (inb(hx, hy)) drawSt({ ...held, x: hx, y: hy, accept: null }, t, true); }
}

// ───────── HTML ─────────
function $(id) { return document.getElementById(id); }
function ticker(s) { $('ticker').innerHTML = s; }
function buildLegend() { $('legend').innerHTML = `<span><i style="background:#9a93ad"></i>분류 전: 접수함 → 분류대</span>` + typesNow().map(k => `<span><i style="background:${REQ[k].col}"></i>${REQ[k].n}: ${REQ[k].route.map(r => KINDS[r].n).join(' → ')} → 발송구</span>`).join(''); }
function renderLabels() {
  let h = '';
  for (const s of sts) {
    if (s.held) continue; const cx = (s.x * T + 12) / W * 100;
    h += `<div class="lab" style="left:${cx}%;top:${(s.y * T + T) / H * 100}%">${KINDS[s.kind].n}</div>`;
    const q = s.queue.length; if (q >= 2) h += `<div class="badge q" style="left:${cx}%;top:${(s.y * T) / H * 100}%">줄 ${q}</div>`;
  }
  const st = crew.filter(c => c.st === 'stuck'); if (st.length) { const c = st[0]; h += `<div class="badge" style="left:${c.x / W * 100}%;top:${(c.y - 22) / H * 100}%">${KINDS[c.need].n} 가는 길 없음</div>`; }
  $('labels').innerHTML = h;
}
function renderHud() {
  $('day').textContent = `${S.day}일째`; $('done').textContent = S.done;
  $('mood').textContent = `인간 기분 ${Math.round(S.mood)} · 접수함 ${inbox.length}/${S.inboxCap}`;
  $('dayFill').style.width = Math.min(100, (S.t - (S.day - 1) * DAY) / DAY * 100) + '%';
  $('inv').innerHTML = `남은 길 <b>${S.roads}</b>칸 · 꼬물이 <b>${crew.length}</b>${toPlace.length ? ` · 놓을 방 <b>${toPlace.length}</b>` : ''}`;
  const md = $('mode'); md.hidden = !held && !S.paused && tool === 'sel'; md.textContent = held ? `${KINDS[held.kind].n} 놓을 칸을 누르세요${held.from ? ' (Esc 취소)' : ''}` : S.paused ? '멈춤' : tool === 'road' ? '길 깔기: 누르거나 끌기' : '길 지우기: 누르거나 끌기';
  $('tPause').innerHTML = `<kbd>Space</kbd>${S.paused ? '계속' : '멈춤'}`;
}

// ───────── 입력 ─────────
function toTile(e) { const r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * GW), Math.floor((e.clientY - r.top) / r.height * GH)]; }
cv.addEventListener('pointermove', e => { hover = toTile(e); if (dragging) paint(...hover); });
cv.addEventListener('pointerdown', e => {
  if (e.button === 2) return; const [x, y] = hover = toTile(e);
  if (held) { drop(x, y); return; }
  if (tool !== 'sel') { dragging = true; cv.setPointerCapture(e.pointerId); paint(x, y); return; }
  const s = at(x, y); if (s) openPop(s); else closePop();
});
addEventListener('pointerup', () => { dragging = false; });
cv.addEventListener('contextmenu', e => { e.preventDefault(); cancelHold(); closePop(); });
addEventListener('keydown', e => {
  if (!$('repOv').hidden) { if (e.key === '1' || e.key === '2') { const c = pick[+e.key - 1]; if (c) choose(c); } return; }
  const k = e.key.toLowerCase();
  if (e.code === 'Space') { e.preventDefault(); S.paused = !S.paused; }
  else if (k === 'r' || k === 'ㄱ') setTool(tool === 'road' ? 'sel' : 'road');
  else if (k === 'e' || k === 'ㄷ') setTool(tool === 'erase' ? 'sel' : 'erase');
  else if (k === 's' || k === 'ㄴ') setTool('sel');
  else if (e.key === 'Escape') { cancelHold(); closePop(); setTool('sel'); }
});
$('tSel').onclick = () => setTool('sel'); $('tRoad').onclick = () => setTool('road'); $('tErase').onclick = () => setTool('erase'); $('tPause').onclick = () => { S.paused = !S.paused; };

// 확인용 봇: 카드 첫 장, 새 방은 길 옆 빈 칸에
window.__sim = sec => { const dt = 0.1, out = []; for (let k = 0; k < sec / dt; k++) { step(dt); if (!$('repOv').hidden) { const w = Object.entries(dayStat.qwait).sort((a, b) => b[1] - a[1])[0]; out.push(`day${S.day} done${dayStat.done} avg${(dayStat.wait / Math.max(1, dayStat.done)).toFixed(1)} fails${dayStat.fails} over${dayStat.overflow} mood${Math.round(S.mood)} crew${crew.length} worst:${w ? w[0] + Math.round(w[1]) : '-'} stuck:${JSON.stringify(dayStat.stuck)}`); choose(pick[0]); } while (held) { let ok = false; for (let y = 0; y < GH && !ok; y++) for (let x = 1; x < GW - 1 && !ok; x++) if (canPlace(x, y) && [[0, 1], [0, -1]].some(([dx, dy]) => inb(x + dx, y + dy) && road[(y + dy) * GW + x + dx])) ok = drop(x, y); if (!ok) break; } } return out.join('\n'); };

buildLegend();
let last = performance.now(), labT = 0;
function frame(now) { const dt = Math.min(0.1, (now - last) / 1000); last = now; step(dt); draw(now / 1000); labT -= dt; if (labT <= 0) { labT = 0.15; renderLabels(); } renderHud(); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
